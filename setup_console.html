<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tournament setup</title>
<!-- SETUP-3 §1 — THE FONTS LINK IS DROPPED AND THE FALLBACK STACK IS THE FACE.
     §1 sanctions this in advance and needs no new approval ("the approved design's fallback stack
     is part of the design"). MEASURED at build, not assumed: with
     `<link href="https://fonts.googleapis.com/css2?family=Quicksand…">` in the head, an offline
     load raises `Failed to load resource: net::ERR_CONNECTION_RESET` on the console-error channel,
     and `setup_console_golden` part B — which asserts a clean load with no errors of any kind —
     goes red on every lane. The link cannot be held green, so it goes.
     What this costs: the brand faces render only where the reader already has them installed.
     Quicksand falls to Avenir / Trebuchet MS (both rounded, both echo the wordmark), Public Sans
     to Segoe UI / system-ui, IBM Plex Mono to SF Mono / Consolas. Layout, weights and every
     measurement in §6A are unchanged — they were specified against the fallback metrics too.
     ⚠ Do not "restore" the link: F11 makes this ONE self-contained file, and a webfont fetch is
     the only thing in it that ever needed a network. -->
<style>
  :root{
    /* ===== SETUP-3 §6A — WYN TENNIS ACADEMY BRAND TOKENS (design LOCKED 8/20) =====
       THE ONLY PALETTE THIS FILE HAS. The house-style tokens adopted from schedule_editor.html
       (`--paper`/`--court`/`--sans`/the `--fs-*` scale) are gone: every surface is re-skinned as
       of §7 step 7, so keeping a second, unused palette defined would just be an invitation to
       reach for it. Nothing outside this file ever read them — the Edit console carries its own
       copy and is untouched by this build.

       ⚠ AMENDED AT SKIN-SETUP-1 (2026-08-23), NOT REWRITTEN. The 8/20 lock above still records
       what it recorded; ONE pair of values in it was superseded. `--w-red` was `#c6242c` and
       `--w-red-h` `#a51d24`. BRAND-1 measured the mark's own wing slashes at `#ba141a` across
       20,256 pixels and ruled the palette to the mark (`DESIGN_RECORD.md` §2): six values apart
       on the red channel reads as a printing fault rather than as two colours, and the mark is
       fixed — used exactly as supplied — so the palette moved to it, not the other way round.
       The hover mate is DERIVED, never chosen: the 8/20 pair is a lightness reduction to 0.8291
       in HSL with hue and saturation held, and the same ratio on `#ba141a` gives `#9a1116`.
       Both tokens are declared ONCE, here, and read through `var()` at 47 and 6 sites — so this
       is a two-value edit that repaints 53 places, and nothing in this file paints red directly.
       The retired pair survives ONLY in this sentence, which is why
       `tests/brand1_design_lock.py` part C reads the record's TABLE ROWS and not its prose. */
    --w-bg:#ffffff; --w-ink:#141414; --w-muted:#5f5f5f; --w-faint:#8f8f8f;
    --w-hair:#e9e6e3; --w-rule:#cfcac6; --w-rule-2:#d8d4d0;
    --w-red:#ba141a; --w-red-h:#9a1116;
    --w-sun:#ffc20e; --w-avoid:#c99700;
    --w-cell-1:#ffe9a6; --w-cell-2:#fff3cd; --w-cell-3:#fff9e6;
    /* ⚠ THE FACES, AMENDED AT SKIN-SETUP-1 (2026-08-23) to `DESIGN_RECORD.md` §4, which the
       Operator ruled the same day. The 8/20 stacks led with `Quicksand`, `Public Sans` and
       `IBM Plex Mono` — and BRAND-1 measured that NONE OF THE THREE SHIPS ON WINDOWS OR MACOS,
       so the director has never once seen them; every stack was already falling through to its
       tail. The record's rule is that a face must exist on both machines or the choice buys
       nothing, so the stacks now name what actually renders and stop describing a machine
       nobody has. What it costs, honestly: the rounded geometric display face that echoed the
       mark's wing curves is given up — Trebuchet MS's humanist bowls are the closest thing on
       both machines and they are not the same thing.
       On WINDOWS the display face does not move at all (the old stack already fell to Trebuchet
       MS); on macOS it moves Avenir -> Trebuchet MS. The BODY face moves on BOTH — Segoe UI on
       Windows and system-ui on macOS, each -> Arial — and it is the ONLY thing in this build
       that can move text. MEASURED FIRST, in Chromium, before any other edit was made
       (SKIN-SETUP-1 §9 step 1), on all four views at 1440 / 1280 / 900: Arial is ~10.4% NARROWER
       than the face this container falls to, so lines get SHORTER; the one fixed-width `nowrap`
       label that holds free text — `.tab-constraints .citytier .tierlab`, 124px, carrying
       "Commuter · 75" — gained slack rather than losing it, +5.03px -> +16.59px; and the swap
       introduced ZERO new overflowing boxes and ZERO new text-wider-than-its-box sites at any
       of the three widths. NOTHING was truncated, and this file's count of ellipsis-truncation
       rules stayed at ZERO — the record forbids the first one, and the string is deliberately
       not spelled here so that a raw sweep of this file reads 0 as truly as a decommented one.
       ⚠ NOTHING IS EVER FETCHED. No @font-face, no font link. That is F11's offline guarantee
       and the §1 comment below is the measured evidence for why it must be. */
    --w-display:'Trebuchet MS','Avenir',sans-serif;
    --w-body:Arial, Helvetica, sans-serif;
    --w-mono:'SF Mono',Consolas,ui-monospace,monospace;
    /* ===== end SETUP-3 BRAND TOKENS ===== */
  }
  /* CUI-2: dark mode retired — these pages publish as artifacts and print; one
     predictable light appearance everywhere beats a theme that follows the reader. */
  *{box-sizing:border-box}
  html,body{margin:0; max-width:100%}
  /* SETUP-3 §6A/§6B: the page ground is the brand white and the body face is Public Sans. The
     `--paper`/`--sans` house tokens stay defined for the panel internals still wearing them. */
  /* ⚠ `overflow-x` IS `clip`, NEVER `hidden`, AND THAT IS THE PINNED GRID'S WHOLE BUG (Operator
     reported it unpinned, 2026-08-24; measured here the same day).
     `overflow-x:hidden` on `body` forces `overflow-y` to compute to `auto` — driven, the body
     reported `hidden auto` — which makes BODY a scroll container. A `position:sticky` descendant
     then sticks against the BODY's scroll box, while the page actually scrolls on
     `document.scrollingElement`, which is the documentElement. The sticky element has nothing to
     stick against and rides away with the content. It is the single commonest cause of "sticky
     silently does nothing", and Chromium happens to be lenient about it — which is exactly why
     twelve driven scenarios here all reported the pin holding while it did not hold for the
     Operator. THE TEST WAS RIGHT AND THE BROWSER WAS DIFFERENT.
     `overflow-x:clip` clips the same overflow WITHOUT creating a scroll container, so the guard
     the `hidden` was doing (§0.3's zero-overflowing-boxes promise) is kept and sticky works.
     ⚠ DO NOT "TIDY" THIS BACK TO `hidden`. */
  body{font-family:var(--w-body); color:var(--w-ink); background:var(--w-bg); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:clip; font-variant-numeric:tabular-nums}
  /* ---- THE FRAME IS THE VIEWPORT (Operator, 2026-08-24) ----
     §6B's 1440px frame is RETIRED. It was right for a laptop and wrong for a desktop monitor:
     the shell was capped at 1440 and centred, so on a 2560-wide window it used 56% of the screen
     and left 560px of white margin down each side — the console read as a miniature page floating
     in a canvas. MEASURED at the report, and the cause is ONE DECLARATION, not a scale:
       · `transform`, `zoom` and `scale` — ZERO elements carry any of them, swept across the DOM
       · root and body `font-size` — 16px, `devicePixelRatio` 1: a normal desktop scale
       · the only capped elements were `.wrap` (1440px), `textarea` (100%) and `.seg` (300px)
     So nothing was ever scaled down; the shell was simply narrow. Removing the cap is the fix,
     and it is why NO font size moves in this change — enlarging type would have treated the
     symptom and broken the ruled type hierarchy.
     ⚠ `width:100%` WITH `max-width:none`, not a wider fixed frame: the console has to expand with
     the window rather than step between hardcoded desktop widths. The 72px sides stay (a Ledger
     step) and drop to 24px on a narrow screen, so the courtside tablet the runbook opens this on
     is unaffected. `min-height:100vh` keeps the page ground full-bleed when a tab is short. */
  .wrap{width:100%; max-width:none; min-height:100vh; margin:0; padding:0 72px 56px}
  @media (max-width:900px){ .wrap{padding:0 24px 56px} }

  /* ---- SETUP-3 §6B — masthead + underline tabs (replaces the two-tab strip AND the pinned
     `.stickytop` band; the interim sidebar direction was itself superseded at the 8/20 lock) ----
     The band is sticky so "Build my setup" — the button pressed last — is reachable without
     scrolling back up. That is the one piece of 4b's intent the nav-view model keeps; the tall
     emitted block never joins it (it lives on the Review & Build view, in normal flow). */
  .mastband{position:sticky; top:0; z-index:20; background:var(--w-bg)}
  /* ⚠ SHRUNK AT THE OPERATOR'S REVIEW, 2026-08-24 ("make the title bar smaller — as much as
     possible while retaining readability"), reviewed as a screenshot mockup and ruled option 3.
     MEASURED: the band was 248px, of which the pinned grid below it made 557px fixed on a
     1000px window — just over half the screen, and only ~243px of workable page on a 800px
     laptop. It is 148px now in every condition driven (157px with a deliberately overlong
     tournament name), so 100px comes back WITHOUT shrinking the tabs, the buttons or the mark.
     WHERE THE HEIGHT WENT: the mark used to take its own line ABOVE the tournament name. It sits
     BESIDE it now, which `DESIGN_RECORD.md` §3 rule 3 explicitly allows — "the tournament name
     sits below it or beside it, never inside its clear space" — and the 16px gap keeps rule 4's
     clear space (9.8% of 150px = ~15px) intact. The mark itself does NOT shrink: 150px is the
     record's floor and the shapes close below 119px.
     ⚠ `flex-wrap:nowrap` AND `.mast-idrow` ARE LOAD-BEARING, NOT TIDYING. The first cut put the
     mark and name in `.mast-left` directly and let the dates line take `flex-basis:100%`; that
     made `.mast-left` demand the full width, which pushed "Load a saved setup" and "Build my
     setup" onto a SECOND LINE and gave back 72 of the 100px — on a long name or a narrow window,
     which is exactly when the room is needed. Driven at 1120px wide and at a 57-character
     tournament name before the fix and after it. */
  header{display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:nowrap; padding:16px 0 12px}
  .mast-left{display:flex; flex-direction:column; gap:4px; min-width:0; flex:1 1 auto}
  .mast-idrow{display:flex; align-items:center; gap:16px; min-width:0}
  /* SKIN-SETUP-1 §3.4: `.lockup` and its four child rules RETIRE WITH THE SPANS THEY STYLED —
     `.wyn`, `.ten`, `.acad` and `.dot` no longer exist in the markup, so the rules go with them
     rather than sitting here unreferenced. The mark replaces them. Its width is declared, which
     is what `tests/brand1_design_lock.py` part E reads to enforce the 150px minimum; the height
     follows from the asset's measured 2.9231 : 1 ratio. `display:block` so it takes its own line
     above the tournament name, per the record's §3 rule 3.

     ⚠ THE CLEAR SPACE IS 16px, NOT 14.7px, AND THAT IS THE TWO RULES AGREEING RATHER THAN ONE
     BEING BENT. The record's §3 rule 4 makes clear space the height of the yellow dot — 9.8% of
     rendered width, so 14.7px at 150px — and it is a MINIMUM, not an exact value. 14.7 is not one
     of the record's eight Ledger spacing steps, so declaring it would put a value on this surface
     that the record does not name, which is exactly what decision 1 closed. 16px is the nearest
     step, it is ABOVE the minimum rather than below it, and it is declared on the mark itself
     rather than borrowed from `.mast-left`'s flex gap — so the clear space cannot be silently
     lost by someone editing the parent. Actual separation from the tournament name is 16px + the
     parent's 8px gap = 24px, also a step. */
  /* 2026-08-24: the 16px is now the gap to the name BESIDE it (`.mast-idrow`) rather than the
     margin below it. Same number, same rule 4 clear space, same 150px floor part E enforces. */
  .mark{display:block; width:150px; height:auto; margin:0; flex:0 0 auto}
  h1{font-family:var(--w-display); font-size:30px; font-weight:500; letter-spacing:-.01em; line-height:1.1; margin:0; color:var(--w-ink)}
  .mast-sub{font-size:14px; color:var(--w-muted)}
  .mast-right{display:flex; align-items:center; gap:16px; flex:0 0 auto}
  .viewtabs{display:flex; gap:30px; border-bottom:1px solid var(--w-hair); flex-wrap:wrap}
  .vtab{font-family:var(--w-body); font-size:14px; font-weight:500; color:var(--w-faint); background:none; border:none;
        border-bottom:2px solid transparent; padding:8px 4px; margin-bottom:-1px; cursor:pointer; border-radius:0}
  .vtab:hover{color:var(--w-ink)}
  .vtab:focus-visible{outline:2px solid var(--w-red); outline-offset:2px}
  .vtab.active{font-weight:600; color:var(--w-ink); border-bottom-color:var(--w-red)}

  /* ---- CUI-2: top warning bar — the one place problems appear ----
     SETUP-3 §6A: re-skinned onto the brand. The ordinary bar wears the AVOID gold, the `stop`
     variant the brand red — the same two-level reading the palette gives the Locked Rules flags,
     so a director learns one colour language and not two.

     SKIN-SETUP-1 §3.5b (Operator decision 5, 2026-08-23, option 1) — ONE BOX RADIUS ON THIS
     SURFACE, 10px, recorded in `DESIGN_RECORD.md` §5's Ledger column. This is the first of the
     TEN boxed elements it governs; the other nine are `.tab-slate .day`, `.tab-slate .loaded-bar`,
     `.hint.inert`, `textarea`, `.loadpanel textarea`, `.mcell`, `.mcell input`, `.emit pre` and
     `.loadpanel`. They carried FOUR different radii, none of them a value the record named.
     ⚠ CONTROLS ARE NOT BOXES. `button`, `.btn-ghost`, `.seg` and the rest of the 999px pill
     family are governed by the record's control-radius row, and every `border-radius:0` field by
     its field row. Neither is touched by this ruling, and part G excludes them BY VALUE rather
     than by selector so a new control cannot slip past a selector list.
     ⚠ THIS IS NOT PERMISSION TO BOX A SECTION. The record's Ledger separator row still reads
     "hairline rule, no box"; these ten are exceptions to it, not the pattern. */
  .warnbar{display:none; margin:16px 0 0; border-radius:10px; padding:12px 16px; font-size:14px;
           border:1px solid #efdcb0; background:#fdf7e8; color:#8a6a08}
  .warnbar.show{display:block}
  .warnbar.stop{border-color:#eecdcf; background:#fbf1f1; color:var(--w-red)}
  .warnbar b{display:block; font-size:14px; font-weight:600; color:var(--w-ink); margin-bottom:4px}
  .warnbar ul{margin:4px 0 0; padding-left:16px}
  .warnbar li{margin:4px 0}

  /* SETUP-3 §3.7 A5: the status-strip CSS retires with the element it painted.
     SETUP-3 §2: so does the two-tab `.daytab` strip — the new tabs carry equivalent roles/ARIA
     (`.vtab` above); the machinery moved, the semantics did not.
     SETUP-3 §6F: and so do `.loadwrap` / `.intake` / `.intake-row`, the three retired load
     surfaces' chrome. One load panel replaced them and wears its own. */
  /* SKIN-SETUP-1 fold 1 of 6 (§3.2): the tinted panel ground `#fbfaf9` -> `--w-bg`. The tint was
     never a named colour; the 1px hairline border already draws this box. ⚠ This is the ONE fold
     of the six that TAKES a cue away rather than substituting for one — §10 risk 8. */
  textarea{width:100%; max-width:100%; min-height:80px; resize:vertical; padding:8px 8px;
        font-family:var(--w-mono); font-size:12.5px; color:var(--w-ink);
        border:1px solid var(--w-hair); border-radius:10px; background:var(--w-bg)}
  textarea:focus, input:focus, select:focus{outline:2px solid var(--w-red); outline-offset:1px}
  .note{font-size:12.5px; color:var(--w-faint); margin:0}
  .err{color:var(--w-red); font-size:13px; font-weight:600; display:none; margin-top:4px}
  .err.show{display:block}
  .file-label{font-size:13.5px; font-weight:600; color:var(--w-red); cursor:pointer}
  .file-label:hover{color:var(--w-red-h)}
  .file-label input{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}

  /* ---- buttons — SETUP-3 §6A: pill buttons, brand red ----
     ⚠ RED SERVES BOTH BRAND-PRIMARY AND DESTRUCTIVE ACTIONS. Accepted at the 8/20 ruling (§3.10)
     and flagged there so nobody "fixes" it unasked: Build my setup, Delete venue and Reset and
     start over are all red on purpose. */
  button{font-family:var(--w-body); cursor:pointer; border-radius:999px; font-size:14px; font-weight:600; border:1.5px solid transparent; padding:0 24px; height:44px}
  button:focus-visible{outline:2px solid var(--w-red); outline-offset:2px}
  .btn-primary{background:var(--w-red); color:#fff} .btn-primary:hover{background:var(--w-red-h)}
  .btn-primary:disabled{background:#d9d5d1; color:#8f8f8f; cursor:not-allowed}
  .btn-ghost{background:transparent; color:var(--w-red); border-color:var(--w-red); height:38px; padding:0 16px; font-size:13.5px}
  .btn-ghost:hover{background:#fbf1f1}
  .btn-sm{font-size:12.5px; height:32px; padding:0 12px}
  /* S-3 §1-B — the Undo control's bar, one per editable tab.
     ⚠ REBUILT AT THE OPERATOR'S REVIEW, 2026-08-24: reported as "UNDO button NOT present". It WAS
     present — and measured invisible. As a `btn-link` it rendered 42.5 x 15px in the disabled
     link colour `--w-rule-2` (#d8d4d0) against `--w-bg`, which is a pale grey word on a pale grey
     ground with no border and no box. A control nobody can see is not a control.
     It is `btn-ghost btn-sm` now — the bordered pill "+ Add a venue" and "Add city" already wear,
     so no new token is minted (S-1 §1-D) — and the disabled state below keeps the outline, so the
     control is legible at rest and still visibly unavailable when there is nothing to take back. */
  .undobar{display:flex; justify-content:flex-end; padding:8px 0 0}
  /* S-3 review: the Undo control and the courts-by-day grid, pinned to the top of Venues & Days.
     `--pin-top` is written by JS from the measured masthead height (the masthead is sticky at
     top:0, so a fixed number here would slide under it at another window width).
     The grid is capped and scrolls inside the pin: a 3-venue x 10-day grid is short, but a
     10-venue slate would otherwise pin more than the screen and leave nothing to scroll. */
  .slatepin{position:sticky; top:var(--pin-top, 0px); z-index:10; background:var(--w-bg);
        border-bottom:1px solid var(--w-hair); margin-bottom:16px}
  /* The measured fallback (see the pin's self-check in the script). `.pinslot` is a zero-height
     placeholder that stays in the flow: it is what the fixed pin reads its left and width from,
     and what holds the page's height open once the pin leaves the flow. Both are inert until the
     self-check adds `pin-fixed`, so the sticky lane pays nothing for them. */
  .pinslot{height:0}
  body.pin-fixed .slatepin{position:fixed; margin-bottom:0}
  .slatepin [data-el="matrixHost"]{max-height:44vh; overflow-y:auto}
  .slatepin .matsec{padding:8px 0 16px}
  /* ---- the grid's caret, and its folded state (Operator, 2026-08-24) ----
     ⚠ THIS REVERSES SETUP-3 §2 FOR ONE CONTROL AND ONE ONLY. That build retired the fold's whole
     visual layer — ":228 — no closed-by-default sections, no chevrons" — and the Operator asked
     for a caret here on 8/24 after seeing the pinned grid measured at 309px. The reversal is
     BOUNDED to the pinned capacity grid: no other section on this console gains a caret, and
     `FOLD_OPEN` / `foldable` / `chevHTML` stay retired.
     FOLDED KEEPS THE DAY HEADINGS AND THE TOTAL ROW. A closed section that hid the numbers
     entirely would mean opening it to learn anything, which is the opposite of why it is pinned:
     the whole point is reading the day totals while scrolling the venue list below. */
  .mathead .htitle{display:inline-flex; align-items:center; gap:8px}
  .capcaret{background:none; border:none; padding:0; height:auto; border-radius:0; line-height:1;
        color:var(--w-ink); font-size:16px; font-family:var(--w-body)}
  .capcaret:hover{color:var(--w-red)}
  .slatepin.folded .matrix > .rowlab:not(.total){display:none}
  .slatepin.folded .matrix > .mcell:not(.total){display:none}
  .slatepin.folded .matsec{padding:8px 0 12px}
  .undobar button:disabled{color:var(--w-muted); border-color:var(--w-rule); background:transparent; cursor:not-allowed}

  /* the text-link button: the masthead's load control and every in-panel "do this instead" verb */
  .btn-link{background:none; border:none; color:var(--w-red); padding:0 4px; height:auto; font-size:13.5px; font-weight:600; border-radius:0}
  .btn-link:hover{color:var(--w-red-h)}
  .btn-link:disabled{color:var(--w-rule-2); cursor:not-allowed}
  .caps{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint)}
  hr.hair{border:none; border-top:1px solid var(--w-hair); margin:0}

  /* ---- common field grids ---- SETUP-3 §6A: on the brand's underline-input shape.
     The `.field` wrapper survives the re-skin because the Rules view's hidden sections still build
     with it — a loaded document has to keep round-tripping through controls that are there. */
  .field{display:flex; flex-direction:column; gap:8px}
  .field label{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint)}
  .field input, .field select{font-family:var(--w-body); font-size:14px; font-weight:600;
        border:none; border-bottom:1.5px solid var(--w-rule); background:transparent; color:var(--w-ink);
        padding:4px 4px 4px; border-radius:0; width:100%; font-variant-numeric:tabular-nums}
  .field input:focus, .field select:focus{outline:none; border-bottom-color:var(--w-red)}
  .grid{display:flex; gap:24px; flex-wrap:wrap}
  .grid .field{flex:1 1 140px}
  .grid .field.narrow{flex:0 0 96px}
  .grid .field.wide{flex:2 1 260px}
  .hint{font-size:12.5px; color:var(--w-muted); margin:8px 4px 0}
  /* the one-shot notice bar (a split, a merged day, a removed venue). It reports something that
     just happened, so it takes the AVOID gold the warnbar takes and not the brand red. */
  .hint.inert{color:#8a6a08; background:#fdf7e8; border:1px solid #efdcb0; border-radius:10px; padding:8px 12px}
  .hint.inert b{color:#8a6a08}
  /* SETUP-3: `.baked` retires — WIRE-1 §5(f)'s read-only rules box left the console at
     SETUP-STRIP item 3, and §6E's Locked Rules view is what replaced it. */
  /* SETUP-3 §6B/§3.4-8: `.tname` and `.counts` retire with the two lines they styled — the
     tournament name moved to the masthead, the grey counts line went with the sub-headings. */

  /* ---- panels ---- */
  .panel-tab{display:none}
  .panel-tab.active{display:block}

  /* ============ SETUP-3 §6C — VENUES & DAYS, THE CLUB LEDGER (design LOCKED 8/20) ============
     SETUP-FOLD's visual layer retires here (§2): no closed-by-default sections, no chevrons, no
     `.section`/`.loc-head` fold machinery on this view. What replaces it is the ledger — hairline
     -separated venue sections, oversized numerals, circular day tokens, and one capacity matrix.
     The `.loc-grid` / `.loc` / `.days` / `.day` / `.caprow` / `.cell-field` class NAMES survive
     the re-skin on purpose: five harness parts address the day rows through them. */
  .tab-slate .cards{display:flex; flex-direction:column; gap:0}

  /* ---- the playing-day band + the derived sentence (§6C) ---- */
  .dayband{display:flex; align-items:flex-end; gap:56px; flex-wrap:wrap; padding:30px 0 24px}
  .dayband .spacer{flex:1}
  .derived{font-family:var(--w-display); font-size:21px; font-style:italic; color:#4a4a4a; padding-bottom:4px; margin:0}
  .derived b{color:var(--w-red); font-weight:600; font-style:normal}
  /* §6A: underline inputs — no box, a 1.5px bottom rule. One shape for every free-typed value on
     this view, at three sizes (band / ledger numeral / club name). */
  .win{display:flex; flex-direction:column; gap:8px}
  .win > label{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint)}
  .win input, .win select{border:none; border-bottom:1.5px solid var(--w-rule); background:transparent;
        font-family:var(--w-body); font-size:16px; font-weight:600; color:var(--w-ink);
        padding:4px 4px 4px; width:88px; font-variant-numeric:tabular-nums; border-radius:0}
  .win input:focus, .win select:focus{outline:none; border-bottom-color:var(--w-red)}
  .win.num input{width:74px}

  /* ---- the Venues header row + the bulk range lane (§6C: the lane rides the token row) ---- */
  .venhead{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:24px 0 0}
  .venhead .htitle{font-family:var(--w-display); font-size:24px; font-weight:500}
  .venhead .hleft{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap}
  .tab-slate .bulk{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; padding:16px 0 4px}
  .tab-slate .bulk .btitle{flex-basis:100%; margin:0; font-size:10.5px; letter-spacing:.18em;
        text-transform:uppercase; color:var(--w-faint); font-weight:600}
  .tab-slate .bulk .bfield{display:flex; flex-direction:column; gap:8px}
  .tab-slate .bulk .bfield label{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint); font-weight:600}
  .tab-slate .bulk .bfield input, .tab-slate .bulk .bfield select{border:none; border-bottom:1.5px solid var(--w-rule);
        background:transparent; font-family:var(--w-body); font-size:14px; font-weight:600; color:var(--w-ink);
        padding:4px 4px 4px; border-radius:0; font-variant-numeric:tabular-nums}
  .tab-slate .bulk .bfield input[type=number]{width:70px}
  .tab-slate .bulk .bfield input[type=date]{width:150px}
  .tab-slate .bulk .bfield select{width:92px}

  /* ---- one ledger section per venue, hairline-separated (§6C) ---- */
  .tab-slate .loc-grid{display:flex; flex-direction:column; gap:0}
  .tab-slate .loc{display:flex; flex-direction:column; gap:16px; padding:30px 0; border-top:1px solid var(--w-hair)}
  .tab-slate .loc:first-child{border-top:none; padding-top:24px}
  .vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap}
  .vhead .hleft{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap}
  .vname input{border:none; border-bottom:1.5px solid transparent; background:transparent;
        font-family:var(--w-display); font-size:29px; font-weight:500; color:var(--w-ink);
        padding:0 0 4px; min-width:340px; border-radius:0}
  .vname input:hover{border-bottom-color:var(--w-hair)}
  .vname input:focus{outline:none; border-bottom-color:var(--w-red)}
  .vname input::placeholder{color:var(--w-rule-2)}
  /* the rank-1 chip is the ONE place the sun yellow carries type (§6A) */
  .chip-main{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
        color:var(--w-ink); background:var(--w-sun); border-radius:999px; padding:4px 12px; white-space:nowrap}
  .vhead .hright{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
  .rbtns{display:flex; gap:8px; padding-bottom:4px}
  .rbtn{width:28px; height:28px; padding:0; border-radius:999px; border:1.5px solid var(--w-rule);
        background:transparent; color:#4a4a4a; font-size:12px; line-height:1; display:flex;
        align-items:center; justify-content:center}
  .rbtn:hover:not(:disabled){border-color:var(--w-red); color:var(--w-red)}
  /* §3.9-6: endpoint dimming — the top venue cannot move up, the bottom cannot move down */
  /* SKIN-SETUP-1 folds 4 and 5 of 6 (§3.2): the disabled rank button's border `#e5e1dd` and its
     text `#d3cfcb` BOTH -> `--w-rule-2`, which the record names for "disabled and dashed states"
     — exactly this. The border goes a shade darker and still reads off; the glyph goes a hair
     lighter and does NOT become more legible. The point of folding both onto one value: a
     disabled control becomes ONE ghost rather than two greys. */
  .rbtn:disabled{border-color:var(--w-rule-2); color:var(--w-rule-2); cursor:not-allowed}
  .vdel{color:var(--w-red); font-size:12.5px; font-weight:600; background:none; border:none; padding:0 0 4px; height:auto; border-radius:0}
  .vdel:hover{color:var(--w-red-h)}

  /* ---- SETUP-3 (Operator, 8/21): the oversized-numeral headline band is REMOVED ----
     `.statgrp` / `.bignum` retire with it. What is left on this row is the round day tokens and
     the compact settings line — the three CONTROLS the band also carried (Max Courts, Lit,
     Lights on), in ordinary type, because they are inputs and this is their only home. */
  .statrow{display:flex; align-items:flex-start; gap:30px; flex-wrap:wrap}
  .vset{display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap; padding-bottom:4px}
  .vsetfield{display:inline-flex; align-items:baseline; gap:8px}
  .vsetfield > label{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
        color:var(--w-faint); white-space:nowrap}
  .vsetfield input, .vsetfield select{font-family:var(--w-body); font-size:15px; font-weight:600;
        border:none; border-bottom:1.5px solid var(--w-rule); background:transparent; color:var(--w-ink);
        padding:1px 2px 3px; border-radius:0; font-variant-numeric:tabular-nums; -moz-appearance:textfield}
  .vsetfield input::-webkit-outer-spin-button, .vsetfield input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .vsetfield input{width:48px; text-align:right}
  .vsetfield input:focus, .vsetfield select:focus{outline:none; border-bottom-color:var(--w-red)}
  .vset .hint{flex-basis:100%; margin:0}
  /* §3.1: the "New" badge — this field has never been asked for before, and a director who ran
     the tool last year needs to see that it is new rather than wonder what he missed. */
  .newbadge{display:inline-block; font-size:9px; font-weight:700; letter-spacing:.1em;
        color:#fff; background:var(--w-red); border-radius:999px; padding:4px 8px; margin-left:4px;
        vertical-align:1px}
  .statrow .spacer{flex:1}
  .toks{display:flex; gap:8px; flex-wrap:wrap}
  /* §6C: red filled = open, dashed = closed. A closed token opens the day; an open one opens that
     day's detail (hours, the morning step-up, and "close this day"), which is the other half of
     the toggle. One control, two states — nothing new invented. */
  .tok{width:34px; height:34px; padding:0; border-radius:999px; display:flex; align-items:center;
       justify-content:center; font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;
       border:1.5px solid transparent}
  .tok-on{background:var(--w-red); color:#fff}
  .tok-on:hover{background:var(--w-red-h)}
  .tok-off{border:1.5px dashed var(--w-rule-2); color:#9a9a9a; background:transparent}
  .tok-off:hover{border-color:var(--w-red); color:var(--w-red)}
  .tok-open{box-shadow:0 0 0 2px var(--w-sun)}
  /* the master bubble (2026-08-24): the row's own control, not an eleventh day. Sun yellow —
     the same token the main-site chip carries, which is the ONE place this palette lets yellow
     carry type — so it reads as a control rather than as a day that is somehow different. */
  .tok-all{background:var(--w-sun); color:var(--w-ink); border-color:var(--w-sun); font-size:14px}
  .tok-all:hover{background:var(--w-avoid)}

  /* ---- THE VENUE CARD IS ONE TWO-COLUMN GRID (Operator, 2026-08-24: "the stack on the right is
     uneven — clean this up") ----
     MEASURED before: the right-hand side had THREE different left edges — the club code at 954,
     max courts at 843, the bulk block at 735 — three near-misses, which is what reads as untidy.
     Every block now starts on one of two lines (the card's left edge, or the halfway gutter) and
     the right column stacks straight down.
     ⚠ THE APPLY BUTTONS DELIBERATELY DO NOT ALIGN WITH EACH OTHER. Pushing each to its column's
     right edge lined them up beautifully and left a long empty gap between a button and the boxes
     it acts on. The column edges carry the order; the button stays next to its own fields. */
  .vhead{align-items:flex-start}
  .vhead .hleft{flex:0 0 auto; width:calc(50% - 15px); min-width:0}
  .vhead .hright{width:calc(50% - 15px); justify-content:flex-start; align-items:flex-end; gap:24px}
  .statrow{align-items:flex-end}
  .statrow .spacer{display:none}
  .statrow .toks{flex:0 0 auto; width:calc(50% - 15px)}
  .statrow .vset{flex:0 0 auto; width:calc(50% - 15px); justify-content:flex-start; padding-bottom:0}
  /* `.bulkpair` retired 2026-08-24 with the morning step-up row it paired — one block does not
     need a pairing wrapper, and `.bulk` is full width on its own. The two-column rules above
     still govern the header cluster and the max-courts row, which is where the card's grid
     actually reads. */

  /* ---- the day detail, opened from a token (§6C). The two plain-language rows SLATE-1 built —
     "Morning: N courts until HH:MM" + the hours row — minus the court count, which §6C moves into
     the capacity matrix so one value has one input. ---- */
  .tab-slate .days{display:flex; flex-direction:column; gap:12px}
  .tab-slate .days:empty{display:none}
  /* SKIN-SETUP-1 fold 1 of 6 (§3.2), site 2 of 3: the venue day card's tint -> `--w-bg`. */
  .tab-slate .day{display:none; background:var(--w-bg); border:1px solid var(--w-hair); border-radius:10px; padding:12px 16px}
  .tab-slate .day.open{display:block}
  .tab-slate .day-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px}
  .tab-slate .day-head input[type=date]{font-family:var(--w-body); font-size:13.5px; font-weight:600;
        border:none; border-bottom:1.5px solid var(--w-rule); background:transparent; color:var(--w-ink);
        padding:4px 4px 4px; border-radius:0}
  .tab-slate .day-head .grow{margin-left:auto}
  .tab-slate .caprow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:4px 0; font-size:13.5px; color:var(--w-ink)}
  .tab-slate .caprow .lead{color:var(--w-faint); font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; min-width:92px}
  .tab-slate .caprow .tail{color:var(--w-muted)}
  /* S-3 §1-A: `.dayfig` is DELETED with the read-only figure it styled. The day's own court count
     is an input again (8/24, reversing SETUP-3 §6C), and it wears `.cell-field` like the morning
     hold-back one row below it. */
  .tab-slate .cell-field{display:inline-flex; align-items:center; gap:8px}
  .tab-slate .cell-field label{font-size:10.5px; letter-spacing:.14em; color:var(--w-faint); text-transform:uppercase; font-weight:600}
  .tab-slate .cell-field input, .tab-slate .cell-field select{font-family:var(--w-body); font-size:13.5px; font-weight:600;
        border:none; border-bottom:1.5px solid var(--w-rule); background:transparent; color:var(--w-ink);
        padding:4px 4px 4px; border-radius:0; font-variant-numeric:tabular-nums}
  .tab-slate .cell-field input:focus, .tab-slate .cell-field select:focus{outline:none; border-bottom-color:var(--w-red)}
  .tab-slate .cell-field input[type=number]{width:58px}
  .tab-slate .cell-field select{width:88px}

  /* ---- the courts-by-day capacity matrix (Concept A) ----
     S-3 §1-A (Operator, 2026-08-24) REVERSES SETUP-3 §6C: THE CELLS ARE READ-ONLY FIGURES. The
     matrix is "a visual representation of the venue information entered in the panes above" — its
     one input moved back into the day detail, and the figures here mirror it as he types. A dashed
     cell is still a day the venue is closed on, and clicking it still opens the day. */
  .matsec{display:flex; flex-direction:column; gap:16px; padding:30px 0 24px}
  .mathead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .mathead .htitle{font-family:var(--w-display); font-size:24px; font-weight:500}
  .matwrap{overflow-x:auto}
  .matrix{display:grid; gap:8px; align-items:center; min-width:640px}
  .matrix .rowlab{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint)}
  .matrix .rowlab.rank1{color:var(--w-red)}
  .matrix .rowlab.total{color:var(--w-ink)}
  .matrix .colhead{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint); text-align:center}
  .mcell{display:flex; align-items:center; justify-content:center; height:36px; border-radius:10px;
         font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}
  /* S-3 §1-A: the cell's `input` rules are DELETED with the input. A figure cell is the `.mcell`
     box and its own text — the shape the Total row already used. */
  .mcell.shut{border:1.5px dashed #d8d4d0; color:#9a9a9a; background:transparent; cursor:pointer; padding:0; font-weight:600}
  .mcell.shut:hover{border-color:var(--w-red); color:var(--w-red)}
  .mcell.total{border-top:1.5px solid var(--w-ink); border-radius:0; color:var(--w-red)}

  /* ---- the footer band: the summary sentence + the travel pairs (§6C) ---- */
  .footband{display:flex; align-items:flex-start; justify-content:space-between; gap:30px; flex-wrap:wrap; padding:24px 0 0}
  .footband .fsum{font-family:var(--w-display); font-size:19px; color:#4a4a4a; margin:0}
  .footband .fright{display:flex; flex-direction:column; gap:12px}
  .footband .stitle{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--w-faint)}
  /* S-3 review (Operator, 2026-08-24): the travel pairs moved to the RULES tab, so these rules
     are no longer scoped to `.tab-slate`. The markup is unchanged — the same control, a new home. */
  .transit-row{display:flex; align-items:center; gap:12px}
  .transit-row .pair{font-size:12.5px; font-weight:600; color:var(--w-ink); min-width:132px}
  .transit-row input{font-family:var(--w-body); font-size:13.5px; font-weight:600; width:52px;
        border:none; border-bottom:1.5px solid var(--w-rule); background:transparent; color:var(--w-ink);
        padding:4px 4px 4px; border-radius:0; text-align:right; font-variant-numeric:tabular-nums}
  .transit-row input:focus{outline:none; border-bottom-color:var(--w-red)}
  .transit-row .u{font-size:11px; color:var(--w-faint)}

  /* ---- S-6: the divisions table — ONE ROW PER DIVISION HE IS ADDING ----
     ⚠ NOT A NEW TOKEN (S-1 §1-D), on the precedent directly above. The row is `.transit-row`'s
     shape — a flex line of label-plus-input cells — and every cell in it is the shipped `.field`,
     which is already unscoped and already builds every other control on this tab. So the only
     thing stated here is WIDTH, and a width is not a rhythm: the name takes the row's spare
     space, the two counts are narrow numbers, and the two picklists have to fit "Round robin"
     and "Level 2" rather than a number.
     NO new colour (every value is an existing `--w-*`), NO off-Ledger spacing step (12 / 8 / 4),
     NO second radius — `brand1_design_lock` parts C, E and G are untouched by construction.
     The column labels repeat on every row so the control stays readable when a row scrolls away
     from the first; after the first row they are `.visually-hidden`, so the screen reads as a
     table while a screen reader still hears which field it is on. */
  .divrow{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:12px 0 0}
  .divrow .field{flex:0 0 auto; gap:4px}
  .divrow .field.dname{flex:1 1 200px; min-width:0}
  .divrow .field.dnum input{width:76px; text-align:right}
  .divrow .field.dsel select{width:124px}
  .divrow .players{font-size:11px; color:var(--w-faint); white-space:nowrap; padding:0 0 8px}
  .divrow .rm{padding:0 0 8px}
  /* One separation step, used by the add control and by the toggle: the toggle is the ANSWER
     "none", so it sits apart from the rows it replaces rather than among them. */
  .addedstep{margin:16px 0 0}

  .tab-slate .loaded-bar{display:none; align-items:center; justify-content:space-between; gap:12px;
        border:1px solid var(--w-hair); border-radius:10px; padding:12px 12px; font-size:12.5px; color:var(--w-muted); margin-top:12px}
  .tab-slate .loaded-bar b{color:var(--w-ink)}
  .tab-slate input.field-error, .tab-slate select.field-error{border-bottom-color:var(--w-red) !important; background:#fbf1f1 !important}
  /* S-3 §1-A: the matrix-cell error outline goes with the matrix input. A refused `courts` value
     is now marked on the day-detail field, which the rule above already covers. */

  /* ================== SETUP-3 §6D — THE RULES VIEW (design LOCKED 8/20) ==================
     Ledger sections, hairline-separated, NO sub-headings (§3.4-8). S-3 §1-C (Operator, 8/24)
     takes the count from four to EIGHT; the one section still off the screen is HIDDEN, not
     deleted — see the one hide rule below. */
  .tab-constraints .cards{display:flex; flex-direction:column; gap:0}
  /* `.rulerow` is RETAINED as a shipped token (S-1 §1-D's list) though the Rules tab no longer
     builds one — see `.rulegrid` below, which replaced it on 2026-08-24. */
  .rulerow{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 72px; padding:30px 0}
  @media (max-width:900px){ .rulerow{grid-template-columns:minmax(0,1fr); gap:30px 0} }

  /* ---- THE RULES TAB IS ONE THREE-COLUMN GRID (Operator, 2026-08-24, option 1 of three mocked:
     "adjust layout to maximize use of space — there's too much dead space. Lock to grid.") ----
     MEASURED before: six two-column rows, and THREE of them carried a single section each, so
     828px of row used half its width. Nine visible sections can never fill a two-column layout
     evenly — one half-row is always empty — which is why the fix is three columns, not tidier
     rows. Driven after: 1,192px against 1,619px, and no empty cell.
     TWO SECTIONS TAKE THE WIDTH THEIR CONTENT NEEDS, and that is what option 1 bought over the
     plain three-column cut: `added` spans two columns because it holds a free-typed list of
     divisions — measured at 840px here against 380px in the plain cut, where the placeholder
     truncated mid-word — and `locality` spans all three so its city chips lay out in a line.
     The nine then fill four rows exactly. */
  .rulegrid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0 72px}
  .rulegrid > .section{border-top:1px solid var(--w-hair); padding:30px 0; min-width:0}
  .rulegrid > .section[data-section="added"]{grid-column:span 2}
  .rulegrid > .section[data-section="locality"]{grid-column:1 / -1}
  /* The hidden section must not lay down a row of its own; `display:none` from the hide rule
     already removes it from the grid, and this keeps its border off the tab if that ever lifts. */
  .rulegrid > .section[data-section="ml1"]{border-top:0; padding:0}
  @media (max-width:1200px){
    .rulegrid{grid-template-columns:repeat(2, minmax(0,1fr))}
    .rulegrid > .section[data-section="added"]{grid-column:1 / -1}
  }
  @media (max-width:900px){
    .rulegrid{grid-template-columns:minmax(0,1fr)}
    .rulegrid > .section[data-section="added"]{grid-column:auto}
  }
  .tab-constraints .section{display:flex; flex-direction:column; gap:16px; min-width:0}
  .tab-constraints .section-body{display:flex; flex-direction:column; gap:16px}
  .tab-constraints .stitle{font-family:var(--w-display); font-size:23px; font-weight:500}

  /* ---- THE ONE HIDE RULE, NARROWED TO ONE SECTION (S-3 §1-C, Operator, 2026-08-24) ----
     It hid FIVE sections on 8/20 (§3.3 · §3.4-5 · §3.9-2). Four of those five come back:
     *"There were at least five rule inputs/toggles hidden in a previous decision. I am reversing
     that — I want them all back on the RULES tab that the TD drives."* `rest`, `sdf`, `pacing`
     and `earliest` were hidden for CLUTTER, and clutter is what the 8/24 reversal covers.

     ⚠ `ml1` IS NOT REVERSED — it was hidden for a stated reason, and that reason was re-affirmed
     on 2026-08-24: *"skip this box - leave it off. Draws are source of truth for this."* The
     8/20 ruling behind it stands verbatim in the section's own comment: L1 is a USTA definition,
     non-variable, and a typed list OVERRIDES what the tool read from the draws. So the rule
     narrows onto it rather than being deleted.

     ⚠ AND THE SECTION ITSELF STAYS BUILT. Its `sectionEl` call, its `data-section` hook, its
     state, its read-back and its emitted `mixed_level_1` key are all untouched, so a saved
     document carrying a hand-typed list still round-trips verbatim (the silent-rewrite guard,
     §5a). This is the PLAYER-SNAP `#subPanel` deprecate-not-delete pattern; `match_caps`
     (SETUP-FOLD N8, not rendered at all, and RULED OUT again on 8/24 as measurably inert) is the
     precedent for the emit half. DELETING THE SECTION WOULD BREAK THE ROUND-TRIP.

     ⚠ WHAT THE DIRECTOR LOSES, PLAINLY, AND IT IS NOW ONE THING: Level-1 Mixed is read from the
     draws only. In a year whose printed draws do not make the split unambiguous there is no
     on-screen way to settle it — the move is to fix the draws, which is where the authority now
     sits. */
  .tab-constraints .section[data-section="ml1"]{display:none}

  /* ---- Match Duration: the pill segments (§6D) ---- */
  .seg{display:flex; border:1.5px solid var(--w-rule); border-radius:999px; overflow:hidden; max-width:300px}
  .seg button{flex:1; height:38px; padding:0 4px; border:none; border-radius:0; background:transparent;
        font-size:13px; font-weight:600; color:var(--w-muted); font-variant-numeric:tabular-nums}
  /* SKIN-SETUP-1 fold 6 of 6 (§3.2): the segmented control's hover ground `#faf8f7` -> `--w-hair`.
     ⚠ THE ONE FOLD THAT MAKES SOMETHING MORE VISIBLE, AND IT IS DELIBERATE. There is no ruled
     faint wash; today's hover is close to invisible and the text-colour change was carrying the
     state alone. Folding UP to the hairline rather than down to white keeps a hover state that
     actually exists. */
  .seg button:hover:not(.on){background:var(--w-hair); color:var(--w-ink)}
  .seg button.on{background:var(--w-red); color:#fff}
  .seg button:focus-visible{outline:2px solid var(--w-red); outline-offset:-4px}
  /* §6H marks every refused field, and a segmented control has no input to outline — the pill
     border carries it. (A loaded document with a non-standard duration is the case: validate()
     refuses it and the director has to be able to SEE which control is refused.) */
  .seg.field-error{border-color:var(--w-red); background:#fbf1f1}

  /* ---- Early Match Preferences: the red toggles (§6A/§6D) ----
     A real <input type=checkbox> under the pill, so the control keeps its keyboard and
     screen-reader behaviour and its `data-field` name. Only the paint is new. */
  /* SKIN-SETUP-1 fold 2 of 6 (§3.2): the unnamed near-ink green-grey `#333833` -> the record's
     `--w-slate`, `#4a4a4a`. Nearest AND on-label — the record defines `--w-slate` as the display
     face's grey, "the derived sentence, the summary lines", which is literally what two of its
     three sites are. Prose goes a shade LIGHTER, not darker.
     ⚠ WRITTEN AS THE LITERAL, DELIBERATELY, and this is the file's idiom rather than a lapse.
     `--w-slate` is one of the three colours DESIGN_RECORD.md §2 named on 8/23 only AFTER part C
     found them already in use here; this console has never declared them as tokens, and it
     already paints `#4a4a4a` at six other sites. Declaring a token and then using it at three

  .tab-constraints .check-row{display:flex; align-items:center; justify-content:space-between;

  .tab-constraints .check-row input[type=checkbox]{appearance:none; -webkit-appearance:none;

        border:none; margin:0; position:relative; cursor:pointer; transition:background .12s}
  .tab-constraints .check-row input[type=checkbox]::after{content:""; position:absolute; top:3px; left:3px;
        width:17px; height:17px; border-radius:999px; background:#fff; transition:left .12s}

  .tab-constraints .check-row b{font-weight:600; color:var(--w-ink)}

  .tab-constraints .chips{display:flex; flex-wrap:wrap; gap:8px; padding:4px 0}
  .tab-constraints .chips-empty{font-size:12px; color:var(--w-faint)}
  /* SKIN-SETUP-1 fold 2 of 6 (§3.2), site 2 of 3: the chip's prose grey -> `--w-slate` #4a4a4a. */
  .tab-constraints .zipchip{display:inline-flex; align-items:center; gap:8px; font-size:12.5px;

  .tab-constraints .chip-x{background:none; border:none; color:#9a9a9a; cursor:pointer; font-size:11px;
        line-height:1; padding:0; height:auto; border-radius:0}

  .tab-constraints .addrow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:8px}
  .tab-constraints .addrow input{font-family:var(--w-body); font-size:13.5px; font-weight:600;

  .tab-constraints .addrow input:focus{outline:none; border-bottom-color:var(--w-red)}
  /* CONS-1: the division picker's native <select> (ELIG-1 — nothing hand-built; on the tablet

     inside a hidden section (see the hide rule above) and keeps its markup so a loaded document
     still round-trips; `setup_console_golden` part H reveals it mechanically to keep it graded. */
  .tab-constraints .addrow select.divpick{font-family:var(--w-body); font-size:13.5px;
        border:none; border-bottom:1.5px solid var(--w-rule); background:transparent; color:var(--w-ink);

  .tab-constraints .field input, .tab-constraints .field select{font-family:var(--w-body); font-size:14px;
        font-weight:600; border:none; border-bottom:1.5px solid var(--w-rule); background:transparent;

  .lockintro{font-family:var(--w-display); font-size:21px; font-style:italic; color:#4a4a4a; margin:0}

  .lockfilters button{font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;

        padding:0 0 4px; height:auto; border-radius:0}

  .rr{display:grid; grid-template-columns:52px 230px minmax(0,1fr) 140px; gap:0 16px; align-items:center;

      padding:12px 0; border-top:1px solid var(--w-hair)}
  .rr.head{border-top:1.5px solid var(--w-ink); padding:8px 0}
  .rr.last{border-bottom:1.5px solid var(--w-ink)}
  .rr.hide{display:none}

  .rr .rn{font-size:14px; font-weight:600}
  .rr .rd{font-size:13.5px; color:#4a4a4a}
  .rr .fl{font-size:10.5px; font-weight:700; letter-spacing:.14em}
  .rr .fl.INVARIABLE{color:var(--w-red)}
  .rr .fl.AVOID{color:var(--w-avoid)}
  .rr .fl.NICE-TO-HAVE{color:var(--w-faint)}
  .locknone{font-size:13.5px; color:var(--w-muted); padding:16px 0}
  @media (max-width:900px){ .rr{grid-template-columns:44px minmax(0,1fr); gap:4px 12px}
                            .rr .rd, .rr .fl{grid-column:2} }

  /* ---- SETUP-3 §6F — the emitted block, on the Review & Build view ----
     SETUP-FOLD's `.stickytop` pinned band RETIRES here (§2). Its whole reason was that Build/Copy
     and the tab chips scrolled away; the masthead band above is sticky instead, and the emitted
     block never travels with it — it sits on its own view, in normal flow, which is what 4b's

  .gate-note{font-size:13.5px; color:var(--w-muted)}
  .emit{display:none}
  .emit.show{display:block}
  /* SKIN-SETUP-1 fold 3 of 6 (§3.2), site 2 of 2: the emit block's text on the ink ground

  .reviewgrid{display:grid; grid-template-columns:560px minmax(0,1fr); gap:0 72px; padding:30px 0 0}

  /* SKIN-SETUP-1 fold 2 of 6 (§3.2), site 3 of 3: the review summary's prose -> `--w-slate`

  .sumgrp p{margin:0; font-size:14px; color:#4a4a4a; line-height:1.6}
  .sumgrp p.faint{font-size:13px; color:var(--w-faint)}

  .rhead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}

  /* ---- §6F — the ONE load entry point, behind the masthead control ----
     The Venues-view intake and the Rules-view "reuse rules" chip both retire into this panel:
     three load surfaces on two views became one, where the design puts it. It takes the WHOLE

     `td-resource-slate/v1` or `td-constraints/v1` document still loads on its own. */

var LOCKED_FLAGS = ["INVARIABLE", "AVOID", "NICE-TO-HAVE"];
// The ruled sort, derived — never a second hand-ordered list to fall out of step with the first.
function lockedRulesSorted(){
  return LOCKED_RULES.slice().sort(function(a, b){
    var fa = LOCKED_FLAGS.indexOf(a.flag), fb = LOCKED_FLAGS.indexOf(b.flag);
    if(fa !== fb) return fa - fb;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  }).map(function(r, i){
    return { id: ("0"+(i+1)).slice(-2), name:r.name, flag:r.flag, text:r.text };
  });
}
function lockedRuleCount(){ return LOCKED_RULES.length; }

// ============ SETUP-FOLD's fold registry — RETIRED at SETUP-3 §2, and WHY IT MATTERED ============
// `FOLD_OPEN`, `foldable`, `chevHTML`, `foldPaint` and `foldRevealFrom` are gone with the visual
// layer they served: there are no carets on any view now, so every one of them had zero callers,
// and forty-five lines of live-looking machinery for a retired design is how a retired design
// comes back. Its ERROR REVEAL is replaced by §6H's, below.
//
// ⚠ WHAT MUST NOT COME BACK WITH THEM IS THE DEFECT THEY EXISTED TO PREVENT, so it is restated
// here where the next person to add a disclosure will read it. BOTH EDITABLE PANELS REBUILD THEIR
// WHOLE DOM FROM SCRATCH on ~20 edit paths — every time field, every day-row edit, + Add a venue,
// the bulk apply, split, delete, every chip control on the Rules view. Any open/closed or
// shown/hidden state held ONLY as a class is therefore wiped by the next keystroke-commit, with no
// error: a director who opens something, types, and tabs away watches it snap shut under his
// hands, including the thing he is typing in.
//
// So every such state in this file lives in a JS registry that `render()` re-applies:
//   `VIEW_ACTIVE` (§6B, which of the four views is showing)
//   `DAY_SHUT`    (§6C, which day details the director has COLLAPSED — days default open)
//   `CITY_OPEN`   (§6D, which city tier is expanded)
// Add a disclosure, add a registry. That is SETUP-FOLD's lesson and it outlived SETUP-FOLD.

// ============================ the warning bar ============================
// CUI-2: everything that needs attention collects in one bar at the top, so a
// problem on a tab you are not looking at is still visible.
function showWarnBar(title, items, stop){
  var bar=document.getElementById("warnBar");
  if(!bar) return;
  if(!items || !items.length){ bar.className="warnbar"; bar.innerHTML=""; return; }
  var h="<b>"+esc(title)+"</b><ul>";
  items.slice(0,8).forEach(function(m){ h+="<li>"+esc(m)+"</li>"; });
  if(items.length>8) h+="<li>and "+(items.length-8)+" more</li>";
  bar.innerHTML=h+"</ul>";
  bar.className="warnbar show"+(stop?" stop":"");
}

function refreshStatus(){
  var problems=[];
  if(Slate){
    Slate.validate().forEach(function(m){ problems.push("Venues & days — "+(m.msg||m)); });
  }
  if(Constraints){
    Constraints.validate().forEach(function(m){ problems.push("Rules — "+(m.msg||m)); });
  }
  showWarnBar("Check these before you build your setup", problems, false);
}

// ==================== SETUP-3 §6B — THE VIEW REGISTRY ====================
// Four views, one DOM, client-side show/hide. The active view lives in `VIEW_ACTIVE`, NOT in the
// DOM — SETUP-FOLD's lesson survives its own visual layer (§2): both panels rebuild themselves
// from scratch on ~20 edit paths, so any open/closed or shown/hidden UI state that lives only in
// a class is undone by the next re-render, mid-edit, with no error. `showView` is idempotent and
// re-applying it is always safe, which is what lets a re-render call it.
var VIEW_ACTIVE = "slate";
var VIEWS = (function(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll('#tablist [role=tab]'));
  function panelOf(name){ return document.getElementById("panel-"+name); }
  function show(name){
    VIEW_ACTIVE = name;
    tabs.forEach(function(t){
      var on = t.getAttribute("data-tab")===name;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on?"true":"false");
      t.tabIndex = on?0:-1;
      var p=panelOf(t.getAttribute("data-tab"));
      if(p) p.classList.toggle("active", on);
    });
    // §6F: the Review view is rendered FROM LIVE STATE, never hand-maintained, so it is rebuilt
    // on arrival rather than left holding whatever it showed last time.
    if(name==="review" && typeof renderReview==="function"){ try{ renderReview(); }catch(e){} }
    // S-3 review: the Rules tab's travel pairs are DERIVED from the venue codes on the other tab,
    // so they are rebuilt on arrival for the same reason the Review view is — a control that
    // named a venue the director has since renamed or deleted is worse than no control.
    if(name==="constraints"){ try{ Constraints.refreshTransit(); }catch(e){} }
  }
  tabs.forEach(function(t){ t.addEventListener("click", function(){ show(t.getAttribute("data-tab")); }); });
  document.getElementById("tablist").addEventListener("keydown", function(e){
    var i = tabs.indexOf(document.activeElement);
    if(i<0) return;
    var ni=null;
    if(e.key==="ArrowRight"||e.key==="ArrowDown") ni=(i+1)%tabs.length;
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp") ni=(i-1+tabs.length)%tabs.length;
    else if(e.key==="Home") ni=0;
    else if(e.key==="End") ni=tabs.length-1;
    if(ni!==null){ e.preventDefault(); tabs[ni].focus(); show(tabs[ni].getAttribute("data-tab")); }
  });
  return { show:show, active:function(){ return VIEW_ACTIVE; } };
})();

// ============================================================================
// SLATE MODULE — validate()/buildSlate() originally copied verbatim from
// resource_slate_console.html (footer/emit UI removed; el() scoped to the slate panel).
//
// SLATE-1 (2026-07-30) reworked the day presentation and the date model:
//   · each open day renders as up to two plain-language rows (morning step-up + rest of day)
//     over the UNCHANGED R7-3 morning_courts/morning_until/courts fields;
//   · the global Dates panel is gone — tournament days ARE the union of the days open at the
//     locations, so a date with no open venue cannot be entered (it used to be a validation
//     error). The emitted `dates` array keeps its shape (sorted "YYYY-MM-DD" strings);
//   · per-venue lit-court fields are emitted for the reporter (item 6), read by no engine path.
// ============================================================================
Slate = (function(){
  var root = document.getElementById("panel-slate");
  var el = scoped(root);
  var SCHEMA = "td-resource-slate/v1";
  // SLATE-1 item 5 (ruling D8, window clause superseded by brief ruling 27, 2026-07-30):
  // the tournament window prefills to the MEASURED 2026 envelope.
  // `daily_end` is a COMPLETION deadline — the engine admits a slot only while
  // start + match_minutes <= daily_end - eod_buffer (scheduler_multi.py:427-430) — so 17:45
  // puts the latest 90-minute start at exactly 15:30, the D1 gender-doubles band. Setting it to
  // the measured LATEST START (16:00) instead would cap starts at 14:15 and make that band
  // unreachable; measured on the real field it also costs 18 placements. Do not "restore" 16:00.
  // WIRE-1 (D-9 / OI-37 a1): `min_s2s` is GONE from this tab. It was a decoy — the TD could set a
  // rest floor here and the Rules tab's copy would silently win, because apply_constraints writes
  // cfg.min_start_to_start_minutes (constraints.py:177-178) after config_from_slate has already
  // read the slate. The Rules tab is the single source. NOTE: this removes the CONSTRAINTS-side
  // decoy only — resource_slate.py:303's slate-side `min_rest_minutes` read is a different key,
  // is live, and is deliberately untouched.
  var DEFAULTS = { daily_start:"08:00", daily_end:"17:45", eod_buffer:45 };
  var state = null;
  // A one-shot message for actions whose effect wouldn't otherwise be obvious (splitting courts on
  // duplicate, refusing to blank a date). Consumed by the next render so it never goes stale.
  var notice = "";
  function setNotice(m){ notice = m || ""; if(m) announce(m); }

  // WIRE-1: the engine now HONOURS the Rules tab's pick, so every derived figure on this tab
  // computes from the picked block. `ENGINE_BLOCK_MINUTES` is retired as a constant — the pick and
  // the engine can no longer disagree, so there is no gap left to disclose. The fallback below
  // covers only the moment before the Rules tab has state (module init order), never a live
  // disagreement.
  var DEFAULT_BLOCK_MINUTES = 90;
  function plannedBlock(){
    try {
      if(Constraints && Constraints.getMatchMinutes){
        var n = Number(Constraints.getMatchMinutes());
        if(isFinite(n) && n > 0) return Math.round(n);
      }
    } catch(e){}
    return DEFAULT_BLOCK_MINUTES;
  }

  function pairKey(a,b){ return [a,b].sort().join("|"); }

  // ================= S-3 §1-B — UNDO (Operator, 2026-08-24) =================
  // "The console needs an undo button that reverses input — as many times as possible without
  // escalating the size of the build. The button should be present on the venues tab AND the
  // rules tab."
  //
  // ONE COMMITTED CHANGE PER PRESS, DEPTH 50 — ruled. The GRAIN is what sizes this, not the depth:
  // both modules' states are pure JSON (strings, numbers, plain objects and arrays; no DOM nodes,
  // no functions), so `JSON.parse(JSON.stringify(state))` is a lossless snapshot, and the WHOLE
  // emitted document measures 6,854 bytes — 50 deep is under 350 KB.
  //
  // ⚠ `input` NEVER PUSHES A STEP. It is the same event §1-A.3's live mirror rides, and if a
  // keystroke pushed history, typing "130" would bury two steps nobody can see. The two features
  // share one event and must not share the history. So a FIELD is snapshotted when he ENTERS it
  // and the snapshot is pushed at `change`/`focusout`, only if the state actually moved — three
  // digits and one commit is exactly ONE step. The declined alternative was per-keystroke, whose
  // measured failure shape is: press Undo four times, the screen looks unchanged because only
  // four digits walked back, press it four more — and a venue is gone.
  //
  // ⚠ EVERY SNAPSHOT IS THE STATE BEFORE THE CHANGE. For a click that is the CAPTURE-phase
  // listener below, which runs before the button's own handler; for a field it is the copy taken
  // when he entered it; for a load or a reset it is taken at the top of `prefillFrom`, because
  // those two are the ways to wipe this screen by accident and an undo that cannot reverse a
  // mis-clicked load is not the undo he asked for.
  //
  // ⚠ `DAY_SHUT` AND THE ACTIVE TAB LIVE OUTSIDE `state` AND STAY THERE — that is what keeps an
  // undo from slamming his open day panes shut.
  var HISTORY = [], HIST_MAX = 50, PENDING = null, RESETTING = false;
  function pushHistory(before, what){
    HISTORY.push({ state: before, what: what || "the last change" });
    if(HISTORY.length > HIST_MAX) HISTORY.shift();
    PENDING = null;
    paintUndo();
  }
  function snapshot(what){
    // S-6: the boot prefill pushes NO step. `BOOTING` is true only while the initial paint hands
    // the SETUP slot to `loadDocument`, and there is no earlier state to return to — an undo
    // offered at page load would take the director back to a console he never saw.
    if(!state || BOOTING) return;
    try { pushHistory(JSON.parse(JSON.stringify(state)), what); } catch(e){}
  }
  function beginEdit(){
    if(!state){ PENDING = null; return; }
    try { PENDING = JSON.stringify(state); } catch(e){ PENDING = null; }
  }
  function commitEdit(what){
    if(PENDING === null || !state) return;
    var now;
    try { now = JSON.stringify(state); } catch(e){ PENDING = null; return; }
    if(now === PENDING){ PENDING = null; return; }   // he left the field without changing it
    pushHistory(JSON.parse(PENDING), what);
  }
  function undo(){
    if(!HISTORY.length) return;
    var step = HISTORY.pop();
    state = step.state;
    PENDING = null;
    render(); refreshCounts();
    paintUndo();
    announce("Undid " + step.what + ".");
    if(typeof renderReview === "function") renderReview();
  }
  function paintUndo(){
    var b = el("undo"); if(!b) return;
    // Disabled at the end of the history rather than sitting live and doing nothing. THE DEPTH IS
    // SILENT — the button never states a number.
    var last = HISTORY.length ? HISTORY[HISTORY.length-1] : null;
    b.disabled = !last;
    b.title = last ? ("Undo " + last.what) : "Nothing to undo yet";
    b.setAttribute("aria-label", b.title);
  }
  // ---- the three commit paths, delegated on the panel root ----
  // Delegated rather than wired per control: this panel rebuilds itself from scratch on ~20 edit
  // paths, and a listener attached to a field is thrown away with the field.
  root.addEventListener("focusin", function(ev){
    var t = ev.target;
    if(t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) beginEdit();
  });
  function fieldStep(ev){
    var t = ev.target;
    if(t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) commitEdit("your last edit");
  }
  root.addEventListener("change", fieldStep);
  root.addEventListener("focusout", fieldStep);
  // ⚠ CAPTURE PHASE, so the "before" copy is taken while the state is still the before. The push
  // itself waits a tick and happens ONLY IF THE CLICK CHANGED SOMETHING — a cancelled confirm, a
  // tab jump or a no-op button leaves no step behind.
  root.addEventListener("click", function(ev){
    var t = ev.target;
    var b = (t && t.closest) ? t.closest("button") : null;
    if(!b || b.disabled || b.getAttribute("data-el") === "undo") return;
    if(!state) return;
    var before;
    try { before = JSON.stringify(state); } catch(e){ return; }
    setTimeout(function(){
      if(!state) return;
      var now;
      try { now = JSON.stringify(state); } catch(e){ return; }
      if(now === before) return;
      pushHistory(JSON.parse(before), "that change");
    }, 0);
  }, true);

  function timeSelect(value, opts){
    opts = opts || {};
    var sel = document.createElement("select");
    var vals = [];
    if(opts.allowBlank) vals.push({v:"", t:"—"});
    // SETUP-3 (Operator ruling 8/21, option 1) — `opts.notBefore` FLOORS THE LIST.
    // MEASURED, which is why the option exists at all: the lights-on list ran from 00:00, so
    // 01:15 was two flicks from the top and the console took it in silence. On the committed 2026
    // field, ORLP with 2 lit courts from 01:15 drops from 144 matches to 26 — 118 matches quietly
    // rehoused, `ok=True`, no refusal anywhere. (The same figures at a real evening hour, 2 lit
    // from 16:00, move nothing: 144 either way.) Floored, that answer is not on the menu.
    //
    // A value already BELOW the floor still renders, labelled — the §5a rule that a prefill never
    // silently rewrites what a loaded document carries. `validate()` then refuses it in words.
    var floor = opts.notBefore ? parseHHMM(opts.notBefore) : null;
    for(var h=0; h<24; h++){ for(var m=0; m<60; m+=15){
      var hh=(h<10?"0":"")+h, mm=(m<10?"0":"")+m;
      if(floor !== null && (h*60+m) < floor) continue;
      vals.push({v:hh+":"+mm, t:hh+":"+mm});
    } }
    if(value && !vals.some(function(o){ return o.v===value; }))
      vals.push({v:value, t:value + (floor !== null && parseHHMM(value) !== null
                                       && parseHHMM(value) < floor
                                     ? " (before play starts)" : " (non-standard)")});
    vals.forEach(function(o){
      var opt=document.createElement("option"); opt.value=o.v; opt.textContent=o.t; sel.appendChild(opt);
    });
    sel.value = (value==null?"":value);
    return sel;
  }
  function bulkField(labelText, type, value){
    var w=document.createElement("div"); w.className="bfield";
    var lab=document.createElement("label"); lab.textContent=labelText;
    var inp;
    if(type==="time"){ inp=timeSelect(value, {allowBlank:true}); }
    else { inp=document.createElement("input"); inp.type=type; inp.value=(value==null?"":value);
           if(type==="number") inp.min="1"; }
    w.appendChild(lab); w.appendChild(inp);
    return { wrap:w, input:inp };
  }
  function datesInRange(fromStr, toStr){
    var out=[];
    if(!fromStr || !toStr) return out;
    var a=new Date(fromStr+"T00:00:00Z"), b=new Date(toStr+"T00:00:00Z");
    if(isNaN(a.getTime()) || isNaN(b.getTime()) || a>b) return out;
    var DAY=86400000, guard=0;
    for(var t=a.getTime(); t<=b.getTime() && guard<3700; t+=DAY, guard++){
      out.push(new Date(t).toISOString().slice(0,10));
    }
    return out;
  }
  function applyToDates(L, dates, courts, start, end, open){
    dates.forEach(function(d){
      if(!d) return;
      if(open){
        L.available[d] = { courts:(courts==null?"":String(courts)), start:(start||""), end:(end||""), mcourts:"", muntil:"" };
      } else {
        delete L.available[d];
      }
    });
  }

  // ---- SLATE-1 item 2: tournament days are DERIVED, not entered separately ----
  // ISO "YYYY-MM-DD" sorts lexicographically = chronologically, so the union is always in
  // date order however the days were entered. (This is what retires the reported ordering bug
  // where a day added later sorted below an earlier one — there is no second list to fall out
  // of step with.) A not-yet-filled day carries the "" key; it is excluded here and caught by
  // validate() instead.
  function derivedDates(){
    var seen = {}, out = [];
    state.locations.forEach(function(L){
      Object.keys(L.available).forEach(function(d){
        if(d && !seen[d]){ seen[d] = 1; out.push(d); }
      });
    });
    out.sort();
    return out;
  }
  // SETUP-2: the sentence under the derived window. Returns "" when the console was not generated
  // from draws, so a raw-opened file gains nothing to read.
  function venueLabel(id){
    var hit = null;
    state.locations.forEach(function(L){ if(L.id===id && !hit) hit = L; });
    return (hit && hit.name) ? hit.name : id;
  }
  function datesProvenanceHTML(){
    if(!DATES || !DATES.window || !DATES.window.length) return "";
    var out = "These days were read from your own draws — the tournament dates printed on every "
            + "page, and the day and club stamped on each match. <b>They are a starting point to "
            + "check, not a record of what you decided.</b>";
    // The underivable day is STATED, never silently dropped ("blank = not known"). It is named
    // ONCE — an earlier draft printed the window's last day and then the gap, which on this field
    // is the same date twice.
    var gaps = DATES.window_only_days || [];
    if(gaps.length){
      out += " No match is scheduled on "
           + gaps.map(function(d){ return "<b>"+esc(d)+"</b>"; }).join(", ")
           + ", "+(gaps.length===1?"which is":"which are")+" inside your tournament dates, so the "
           + "draws cannot show which club is open then. "
           + (gaps.length===1?"That day has":"Those days have") + " been opened at <b>"
           + esc(venueLabel(DATES.main_site)) + "</b> — change the club, or remove "
           + (gaps.length===1?"the day":"the days") + " if you are not playing.";
    }
    var odd = DATES.unmatched_stamp_dates || [];
    if(odd.length){
      out += " " + odd.length + " match date"+(odd.length===1?"":"s")+" on your draws ("
           + odd.map(function(d){ return esc(d); }).join(", ")
           + ") "+(odd.length===1?"falls":"fall")+" outside those tournament dates and "
           + (odd.length===1?"was":"were")+" left out — add "+(odd.length===1?"it":"them")
           + " by hand if "+(odd.length===1?"it is":"they are")+" right.";
    }
    return out;
  }

  // VENUE-1 / Decision 1 (Operator, 2026-08-05) — the empty-day stop, asked BEFORE the edit.
  // Which currently-open days would have no courts at all if venue `skipIndex` went away?
  // Measured why this matters: the console derives the window from the venues' open days, so a
  // removal does not produce the clean refusal already sitting in `resource_slate.py:190` — it
  // silently SHRINKS the window, and the engine then crashes deeper in with an `IndexError` when
  // a division no longer has enough days for its rounds. `skipIndex` of -1 asks the question of
  // the current list unchanged, which is how the pre-emit check uses it.
  function daysLostWithout(skipIndex){
    var lost = [];
    derivedDates().forEach(function(d){
      var stillOpen = state.locations.some(function(L, i){
        return i !== skipIndex && Object.keys(L.available).indexOf(d) !== -1;
      });
      if(!stillOpen) lost.push(d);
    });
    return lost;
  }
  // SETUP-3 §6C: `addDaysISO` / `nextDayFor` retire with the "+ Add day" button that used them.
  // A venue's days are opened from its DAY TOKENS and from the capacity matrix's dashed cells now,
  // both of which name the exact date being opened — so there is no day left to GUESS. (The rule
  // those two carried survives everywhere else in this file and is worth keeping in view: never
  // `new Date()` with no argument. A prefill that depended on today's date would make the console
  // non-reproducible, which is rule 14's problem one layer up.)
  function emptyCell(){ return { courts:"", start:"", end:"", mcourts:"", muntil:"" }; }

  // ---- SETUP-3 §6B: the masthead reads from this module ----
  // The tournament name and the date line are the same state the emit carries; they render in the
  // masthead because that is where the locked design puts them, not because a second copy exists.
  var MONTHS = ["January","February","March","April","May","June","July","August","September",
                "October","November","December"];
  function prettyDay(iso){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");
    if(!m) return iso||"";
    return MONTHS[(+m[2])-1] + " " + (+m[3]);
  }
  // "January 23 – February 1" — and just the one day when there is one. Deliberately shows only
  // what the venues' open days actually say: the city the design's mockup carries is not a field
  // this console holds, and printing a place the tool was never told would be asserting a figure.
  function dateLine(){
    var d = derivedDates();
    if(!d.length) return "No days open yet";
    if(d.length===1) return prettyDay(d[0]);
    var a=prettyDay(d[0]), b=prettyDay(d[d.length-1]);
    if(a.split(" ")[0] === b.split(" ")[0]) b = b.split(" ")[1];
    return a + " – " + b;
  }
  function refreshMasthead(){
    var t=document.getElementById("tname");
    if(t) t.textContent = (state && state.tournament) || "Untitled tournament";
    var s=document.getElementById("mastDates");
    if(s) s.textContent = state ? dateLine() : "";
  }

  // SETUP-3 §6F: the load surfaces retire into `#loadPanel` (page-level, opened from the masthead)
  // and the ERROR surface goes with them. `showErr`/`clearErr` write to the panel's one error line
  // — kept as functions rather than inlined, because six call sites below still use them for
  // refusals that have nothing to do with loading (an empty bulk range, a merged day).
  function showErr(msg){ loadErr(msg); }
  function clearErr(){ loadErr(""); }
  // SETUP-3 §6F: "Use the usual setup" and "Start empty" are RETIRED AS SCREEN SURFACES. The
  // SAMPLE prefill is still the silent initial state — it is what the console opens with and
  // exactly what "Reset and start over" returns to, so the capability the two buttons offered is
  // reachable, just not as clutter on the finishing view.

  function prefillFrom(data){
    // ⚠ S-3 §1-B: SNAPSHOT BEFORE THE WHOLE STATE IS REPLACED. "Load a saved setup" and "Reset
    // and start over" are the two most destructive actions on this console, and both come through
    // here. Guarded on `state` because the SAMPLE prefill at module init has nothing to snapshot
    // and must not open the session with a step in the history.
    if(state) snapshot(RESETTING ? "the reset" : "the setup you loaded");
    data = data || {};
    var locs = Array.isArray(data.locations) ? data.locations : [];
    state = {
      tournament: data.tournament || "",
      daily_start: data.daily_start || DEFAULTS.daily_start,
      daily_end: data.daily_end || DEFAULTS.daily_end,
      eod_buffer: (data.end_of_day_buffer_minutes!=null ? data.end_of_day_buffer_minutes : DEFAULTS.eod_buffer),
      locations: locs.map(function(L){
        var avail={};
        var av = (L && L.available) || {};
        Object.keys(av).forEach(function(d){
          var cell = av[d] || {};
          avail[d] = { courts:(cell.courts!=null?cell.courts:""), start:cell.start||"", end:cell.end||"",
                       mcourts:(cell.morning_courts!=null?cell.morning_courts:""), muntil:cell.morning_until||"" };
        });
        // SLATE-1 item 6: lit courts ride the location, not the day.
        // SETUP-3 §3.1: so does the club's physical ceiling. Read back so a document that carries
        // one round-trips rather than being silently rewritten to blank on the next emit (§5a).
        return { id:(L&&L.id)||"", name:(L&&L.name)||"", available:avail,
                 lit:((L&&L.lit_courts)!=null ? L.lit_courts : ""),
                 lights_on:((L&&L.lights_on) || ""),
                 max:((L&&L.physical_courts)!=null ? L.physical_courts : "") };
      }),
      transit:{}
    };
    // A slate whose `dates` list named a day no venue is open on cannot survive the derived
    // model; that day is dropped on load rather than silently re-adding an unopenable date.
    var tm = (data.transit_minutes && typeof data.transit_minutes==="object") ? data.transit_minutes : {};
    Object.keys(tm).forEach(function(k){
      var parts = String(k).split("|");
      if(parts.length===2) state.transit[pairKey(parts[0],parts[1])] = tm[k];
    });
    enterEditing(data.tournament || "loaded slate");
  }

  function enterEditing(infoLabel){
    setLoadedInfo(infoLabel);
    refreshMasthead();
    render();
    refreshCounts();
  }

  // ======================= SETUP-3 §6C — THE VENUES & DAYS VIEW =======================
  // The Club Ledger, as locked on 8/20. SETUP-FOLD's `.section` shells and both fold levels are
  // GONE from this view (§2): a ledger has no carets. What §2 keeps is the LESSON — the one piece
  // of UI state this view still holds (which day details are expanded) lives in a JS registry,
  // because this panel rebuilds itself from scratch on ~20 edit paths and anything held only in a
  // class would be wiped mid-edit.
  //
  // ⚠ THE REGISTRY IS INVERTED (Operator, 2026-08-24, review of the S-3 build): "Days MUST default
  // OPEN — ALL DAYS ALL VENUES." It used to record which days were OPEN, so every day at every
  // venue started collapsed and the director had to click 15 tokens before he could read his own
  // ledger. It now records only the days he has explicitly COLLAPSED. Default-open therefore holds
  // for days that do not exist yet — a venue added later, a bulk date-range apply, a split — which
  // is what "all days all venues" means and what seeding a default-closed registry at load could
  // not deliver.
  var DAY_SHUT = {};
  function dayKey(L, li, d){ return (L.id || ("#"+li)) + "/" + d; }
  function dayIsOpen(L, li, d){ return !DAY_SHUT[dayKey(L, li, d)]; }
