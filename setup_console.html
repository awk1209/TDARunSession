  function parseHHMM(v){
    if(typeof v!=="string") return null;
    var m=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(v);
    if(!m) return null;
    return (+m[1])*60 + (+m[2]);
  }
  function validate(){
    var errs=[];
    function E(msg, ref){ var o={msg:msg}; if(ref){ for(var k in ref) o[k]=ref[k]; } errs.push(o); }
    // SLATE-1 item 3: "a day open at no venue" is no longer a check — the days ARE the union of the
    // venues' open days, so that state cannot be entered. What remains is a day with no date typed.
    if(!state.locations.length) E("Add at least one venue.");
    if(state.locations.length && !derivedDates().length)
      E("No days are open yet — open at least one day at a venue.");
    if(!state.daily_start || parseHHMM(state.daily_start)===null)
      E("Day starts must be a valid 24-hour HH:MM.", {meta:"daily_start"});
    if(!state.daily_end || parseHHMM(state.daily_end)===null)
      E("\"Last match must finish by\" must be a valid 24-hour HH:MM.", {meta:"daily_end"});
    var dS=parseHHMM(state.daily_start), dE=parseHHMM(state.daily_end);
    if(dS!==null && dE!==null && dS>=dE)
      E("The day has to end after it starts.", {meta:"daily_end"});
    // The window has to leave room for one match, or nothing can be placed at all. This is the
    // arithmetic that a literal reading of the measured 08:00-16:00 envelope fell foul of.
    // WIRE-1: measured against the PICKED block, not a hardcoded 90 — a 60-minute pick genuinely
    // fits in a shorter day, and refusing it on the old constant would be a false error.
    var fitBlock = plannedBlock();
    if(dS!==null && dE!==null && isFinite(Number(state.eod_buffer)) &&
       (dE - Number(state.eod_buffer) - fitBlock) < dS)
      E("No match fits: with the wrap-up time, the last " + fitBlock + "-minute match "
        + "would have to start before the day begins. Push \"must finish by\" later or shorten the "
        + "wrap-up.", {meta:"daily_end"});
    var ids={};
    state.locations.forEach(function(L, i){
      if(!L.id){ E("Venue "+(i+1)+": id is required.", {li:i, field:"id"}); return; }
      if(ids[L.id]) E("Duplicate venue id: "+L.id+".", {li:i, field:"id"});
      ids[L.id]=1;
      // item 6: lit courts — both or neither, same shape as the morning step-up. Blank is the
      // shipped state for ORLP/WEST, so the pair must stay optional.
      var lc=L.lit, lo=L.lights_on, hasLc=(lc!=null&&lc!==""), hasLo=(lo!=null&&lo!=="");
      if(hasLc!==hasLo)
        E("Venue "+L.id+": lit courts and lights-on time must be set together (or both left blank).",
          {li:i, field:(hasLc?"lights_on":"lit")});
      if(hasLc){
        var lcn=Number(lc);
        if(!isFinite(lcn) || !Number.isInteger(lcn) || lcn<=0)
          E("Venue "+L.id+": lit courts must be a positive whole number (got "+lc+").",
            {li:i, field:"lit"});
        if(parseHHMM(lo)===null)
          E("Venue "+L.id+": lights-on \""+lo+"\" is not valid 24-hour HH:MM.", {li:i, field:"lights_on"});
        // SETUP-3 (Operator ruling 8/21, option 1) — THE BACKSTOP FOR A PASTED HOUR.
        // The picklist no longer offers an hour before play starts, so this cannot be reached by
        // clicking; a LOADED document can still carry one, and §5a forbids silently rewriting it.
        // So it is refused in words instead. Why it earns a refusal rather than a warning:
        // measured on the committed 2026 field, ORLP with 2 lit courts from 01:15 falls from 144
        // matches to 26 — 118 quietly rehoused — and the engine reports `ok=True` throughout,
        // because a lights ceiling that binds from the small hours is a legal schedule, just not
        // the one anybody asked for. Nothing downstream would ever mention it.
        else if(parseHHMM(state.daily_start)!==null && parseHHMM(lo) < parseHHMM(state.daily_start))
          E("Venue "+L.id+": lights-on is "+lo+", before play starts at "+state.daily_start
            + ". The tool would treat this club as a "+lc+"-court club all day, not just after "
            + "dark. Set the hour the lights actually come on.", {li:i, field:"lights_on"});
      }
      // SETUP-3 §3.1: the club's physical ceiling. OPTIONAL — blank is the shipped state at every
      // venue and blank must stay valid, or the byte-identity guarantee would be unreachable.
      // When it IS filled in, two things are checked, because a wrong ceiling is worse than none:
      // BUDGET-1 reads this number to tell "book more courts here" apart from "you're out of room",
      // and both answers come out wrong if the ceiling is nonsense.
      var mx=L.max;
      if(mx!=null && mx!==""){
        var mxn=Number(mx);
        if(!isFinite(mxn) || !Number.isInteger(mxn) || mxn<=0){
          E("Venue "+L.id+": max courts must be a positive whole number (got "+mx+").",
            {li:i, field:"max"});
        } else {
          // A ceiling BELOW what is already booked is a contradiction the director can see at a
          // glance on the ledger but not in a saved file — it says the club cannot provide the
          // courts he has already reserved there.
          var booked = 0;
          Object.keys(L.available).forEach(function(d){
            var n = Number(L.available[d].courts);
            if(isFinite(n) && n > booked) booked = n;
          });
          if(booked && mxn < booked)
            E("Venue "+L.id+": max courts is "+mxn+", but "+booked+" courts are already reserved "
              + "there. The most the club could ever provide cannot be less than what you have "
              + "booked.", {li:i, field:"max"});
        }
      }
      Object.keys(L.available).forEach(function(d){
        var cell = L.available[d];
        var where = "Venue "+(L.id||(i+1))+", "+(d ? d : "a day with no date");
        if(!d) E("Venue "+(L.id||(i+1))+": a day has no date set.", {li:i, date:d, field:"date"});
        var c = cell.courts;
        var n = Number(c);
        if(c==="" || c==null || !isFinite(n) || !Number.isInteger(n) || n<=0)
          E(where+": courts must be a positive whole number (got "+(c===""?"blank":c)+").", {li:i, date:d, field:"courts"});
        var start=cell.start, end=cell.end, sMin=null, eMin=null;
        if(start!=null && start!==""){
          sMin=parseHHMM(start);
          if(sMin===null) E(where+": opening time \""+start+"\" is not valid 24-hour HH:MM.", {li:i, date:d, field:"start"});
        }
        if(end!=null && end!==""){
          eMin=parseHHMM(end);
          if(eMin===null) E(where+": closing time \""+end+"\" is not valid 24-hour HH:MM.", {li:i, date:d, field:"end"});
        }
        if(sMin!==null && eMin!==null && sMin>=eMin)
          E(where+": opens \""+start+"\" must be before it closes \""+end+"\".", {li:i, date:d, field:"start"});
        // R7-3: the morning step-up. The two fields are now set and cleared together by the row
        // control, so a half-filled pair means the row was added and left empty.
        var mc=cell.mcourts, mu=cell.muntil, hasMc=(mc!=null&&mc!==""), hasMu=(mu!=null&&mu!=="");
        if(hasMc!==hasMu)
          E(where+": the morning row needs both a court count and a switch time (or use \"same all day\").",
            {li:i, date:d, field:(hasMc?"muntil":"mcourts")});
        if(hasMc){
          var mn=Number(mc);
          if(!isFinite(mn) || !Number.isInteger(mn) || mn<=0)
            E(where+": morning courts must be a positive whole number (got "+mc+").", {li:i, date:d, field:"mcourts"});
          if(parseHHMM(mu)===null)
            E(where+": the morning switch time \""+mu+"\" is not valid 24-hour HH:MM.", {li:i, date:d, field:"muntil"});
        }
      });
    });
    // ⚠ ZERO IS VALID (Operator, 2026-08-24: travel times default to 0 for all pairs).
    // This used to refuse anything `<= 0`, which meant the console opened refusing its OWN
    // defaults — three warnings on an untouched screen, driven and measured before the fix.
    // A refusal a director sees every single time he opens the tool is the noise-that-gets-
    // ignored failure, and it would have trained him past the real ones sitting beside it.
    // 0 now means what he typed it to mean: no extra gap beyond the rest between matches.
    // A NEGATIVE or non-numeric value is still refused — those are mistakes, not answers.
    Object.keys(state.transit).forEach(function(k){
      var v=state.transit[k], num=Number(v);
      if(v!=="" && v!=null && (!isFinite(num) || num<0))
        E("Travel time "+k+": \""+v+"\" isn't a number of minutes — set it on the Rules tab, "
          + "under Travel Between Venues. Use 0 for no extra gap.", {pair:k});
    });
    return errs;
  }
  function buildSlate(){
    var locations = state.locations.map(function(L){
      var available={};
      Object.keys(L.available).forEach(function(d){
        var cell=L.available[d];
        var o={ courts: Number(cell.courts) };
        if(cell.start) o.start=cell.start;
        if(cell.end) o.end=cell.end;
        if(cell.mcourts!=null && cell.mcourts!=="" && cell.muntil){ o.morning_courts=Number(cell.mcourts); o.morning_until=cell.muntil; }   // R7-3
        available[d]=o;
      });
      // VENUE-1 (2026-08-05) — `name` RIDES THE EMIT AGAIN. This is a deliberate reversal of
      // WIRE-1's deletion, not a regression: WIRE-1 removed it because no consumer read it and a
      // venue was always one of three ids baked into the code. VENUE-1 is the build that hands
      // the director the venue list, and a club he types has no other identity — the id is a
      // short code for the engine, the name is what the tournament director and his players
      // actually call the place (D-49: ORLP = Omni Rancho Las Palmas, WEST = the Westin).
      // Emitted only when he has typed one, so a nameless venue carries no key at all.
      var out = { id:L.id, available:available };
      if(L.name!=null && String(L.name).trim()!=="") out.name = String(L.name).trim();
      // SLATE-1 item 6: additive, and omitted entirely when unknown — a venue with no answer yet
      // carries no key at all rather than a null the reporter would have to special-case.
      if(L.lit!=null && L.lit!=="" && L.lights_on){
        out.lit_courts = Number(L.lit);
        out.lights_on = L.lights_on;
      }
      // ---- SETUP-3 §3.1 / §6G: the club's physical court ceiling ----
      // THE ONE CONTRACT CHANGE IN THIS WHOLE BUILD, and it is additive and optional: emitted only
      // when the director has filled it in, so a setup without it is BYTE-IDENTICAL to before
      // (asserted in the golden). Same omission discipline as `lit_courts` — no key at all rather
      // than a null every reader would have to special-case.
      //
      // NAME CONVERGED WITH BUDGET-1 IN THIS COMMIT (§3.1's requirement). `physical_courts` — the
      // working name becomes the final name. It sits in the same object as `courts` (what is
      // BOOKED, per day) and `lit_courts` (what is LIT), joins that `*_courts` family, and says
      // plainly what BUDGET-1 consumes: how many courts the club physically has. `max_courts` was
      // rejected next to `courts` — a reader could take it for a cap on the booked count, which is
      // the opposite of what it means. The SCREEN says "Max Courts" (§3.7 A2), because that is the
      // director's question; the contract says what the number is.
      //
      // NOTHING IN PLACEMENT READS IT. `resource_slate.validate_slate` ignores keys it does not
      // know, so the field rides the courier untouched until BUDGET-1's `court_budget` reads it —
      // the FMAP-1/D-32 emitted-for-a-named-future-reader pattern.
      if(L.max!=null && L.max!==""){
        out.physical_courts = Number(L.max);
      }
      return out;
    });
    // ---- S-1 §1-A: a removed venue leaves no travel time behind ----
    // A travel-time key survives only when BOTH halves name a venue that is on the slate right
    // now. `resource_slate.config_from_slate` REFUSES a key naming an unknown location id, so a
    // stale key does not degrade the run — it stops it, one step after the paste, with an
    // engine-vocabulary error naming a club the director already deleted.
    //
    // WHY THE EMIT SITE AND NOT `deleteVenue`: there are TWO doors into `state.transit`, and a
    // prune at either one leaves the other open. `deleteVenue` splices `state.locations` and never
    // touches `state.transit`; `prefillFrom` imports every key of a loaded document's
    // `transit_minutes` without checking that either half is a known venue, so a saved setup
    // carrying a stale key re-imports it verbatim. Filtering at the single emit site closes both by
    // construction and cannot be undone by a future edit path that writes `state.transit`. It is
    // also the shape `wwtc_pipeline._court_slate` already uses on the engine side.
    //
    // SILENT BY DESIGN — `validate()` gains no error for this. Travel rows render from pairs of
    // CURRENT venues, so a stale key has no row on the screen: it is not a mistake the director
    // made, it is a row he can no longer see, and a refusal pointing at an invisible field is the
    // worse answer. `revealRefusedFields` could not highlight it either — it addresses a travel
    // error as `input[data-pair="…"]`, and for a stale key that element does not exist.
    var liveIds={};
    state.locations.forEach(function(L){ if(L && L.id) liveIds[L.id]=true; });
    var transit={};
    Object.keys(state.transit).forEach(function(k){
      var halves=String(k).split("|");
      if(halves.length!==2 || !liveIds[halves[0]] || !liveIds[halves[1]]) return;
      var n=Number(state.transit[k]);
      if(isFinite(n) && n>0) transit[k]=Math.round(n);
    });
    return {
      schema: SCHEMA,
      tournament: state.tournament||"",
      dates: derivedDates(),   // SLATE-1 item 2: same shape, derived from the venues' open days
      daily_start: state.daily_start,
      daily_end: state.daily_end,
      end_of_day_buffer_minutes: Number(state.eod_buffer),
      // WIRE-1 (D-9): the decoy `min_start_to_start_minutes` is gone from the slate emit. The
      // Rules tab's copy is the single source and always won anyway; resource_slate defaults the
      // absent key to the same 180 (_DEFAULT_S2S) before apply_constraints overwrites it.
      locations: locations,
      transit_minutes: transit
    };
  }

  // ---- SLATE-1 item 5: the prefill is now the MEASURED 2026 envelope ----
  // Ruling D8, as amended by brief rulings 27 (window) and 28 (prefill-only) on 2026-07-30.
  // Ruling 28: these measured figures live HERE only — wwtc_pipeline.wwtc_slate() deliberately
  // keeps the configured 24/20/4 as the regression anchor. The divergence is intended.
  // Capacity 20 / 12 / 4 are the observed concurrency peaks; the configured 24 / 20 / 4 were never
  // reached. Measured on the real combined field, the capacity change holds 760/275/0/0 and moves
  // 310 of 760 placements (46 change day). Ruling 28 rests on that: the prefill matches what the
  // venues actually ran, and the hard invariant is unmoved.
  // DOC-03 (corrected here, WIRE-1): this comment used to justify ruling 28 with a specific
  // before/after assigned-day spill count. That figure was falsified and no figure replaces it —
  // spills are REPORTED, never asserted (ruling 12), and a printed expectation trains the reader
  // to read ordinary variance as a fault. Read the spill count off the run, not off a comment.
  // The window is 08:00-17:45, NOT the 08:00-16:00 the ruling's prose names: 16:00 was the latest
  // observed START, while daily_end is a completion deadline. 17:45 reproduces that measurement
  // exactly (latest 90-minute start = 15:30, the D1 doubles band) and is placement-identical to the
  // old 18:00; a literal 16:00 caps starts at 14:15 and leaves 19 matches unplaced.
  // All of these are a TD-editable starting point, pending club confirmation of the court counts.
  var SAMPLE = (function(){
    // SETUP-2: the window and each venue's days come from DATES when the console was generated
    // from the director's own draws, and from these literals when it was not. `vdays` is the ONE
    // place that choice is made, so the null lane is the literals unchanged, character for
    // character — which is what keeps this block byte-identical and `tests/venue1_rules.py`'s
    // field-for-field transcription of it still agreeing with the file.
    var DERIVED = (DATES && DATES.window && DATES.window.length) ? DATES : null;
    // S-1 §1-C: next January's clubs, when the run asked him for them and passed them in. `vdays`
    // is to DATES what this is to VENUES — the ONE place the choice is made, so the null lane is
    // the literals below unchanged, character for character.
    var SUPPLIED = (VENUES && VENUES.locations && VENUES.locations.length) ? VENUES : null;
    var D = DERIVED ? DERIVED.window.slice()
                    : ["2026-01-23","2026-01-24","2026-01-25","2026-01-26","2026-01-27",
                       "2026-01-28","2026-01-29","2026-01-30","2026-01-31","2026-02-01"];
    // A venue the derivation does not name keeps its own literal rather than losing its days: a
    // club that is in the slate but appears in no schedule stamp is UNKNOWN to the draws, and
    // unknown is never the same as closed ("blank = not known" is the shipped precedent).
    function vdays(id, fallback){
      return (DERIVED && DERIVED.venues && DERIVED.venues[id]) ? DERIVED.venues[id].slice() : fallback;
    }
    // WIRE-1 (D-36 / ruling 64): `win`/`av` take a CLOSING TIME. Before this every venue-day was
    // stamped with the same 17:45 as the main club, so nothing stopped a run putting a 4pm match
    // at an offsite venue. The TD: "We do not schedule matches later than 3 pm offsite, though,
    // and even then, often it's only 2 pm." A 16:30 close makes 15:00 the last 90-minute start.
    // Per-venue hours already gate the whole interval (OI-23, scheduler_multi.py:866, applied
    // :921), so this is prefill only — no engine change.
    function win(c, m, close){ var o={courts:c, start:"08:00", end:close||"17:45"}; if(m){ o.morning_courts=m[0]; o.morning_until=m[1]; } return o; }
    function av(c, dates, m, close){ var o={}; dates.forEach(function(d){ o[d]=win(c, m, close); }); return o; }
    var OFFSITE_CLOSE = "16:30";
    return {
      schema:"td-resource-slate/v1",
      tournament:"Wilson World Tennis Classic",
      dates:D.slice(),
      // ---- S-1 §1-C's venues slot now carries THE TOURNAMENT WINDOW too (2026-08-24) ----

  // whole state at once.

    paintUndo();

    // the SETUP slot to `loadDocument`, and there is no earlier state to return to — an undo
    // offered at page load would take the director back to a console he never saw.
    if(!state || BOOTING) return;

  // of them with a fabricated third team, and the six divisions' 41 stated matches became 49.
  //

  // nothing has to survive one, and `prefillAdded` fills controls instead of rendering a
  // sentence it would have to read back later.
  //
  // ⚠ `splitDivisions` ABOVE STAYS. It has three other callers — the division chips, the
  // same-day finish list and the Level-1 Mixed list — and only its added-divisions use goes.
  //
  // ⚠ HIS NUMBER IS TEAMS, NEVER PLAYERS. Fourteen teams is twenty-eight people. The unit rides
  // in the column label and the player count is echoed beside every row's figure, so the two
  // can never be confused on screen.
  var ADDED_FORMATS = [{ v:"", t:"—" },
                       { v:"single_elim", t:"Knockout" },
                       { v:"round_robin", t:"Round robin" }];
  var ADDED_LEVELS  = [{ v:"", t:"—" }, { v:"1", t:"Level 1" }, { v:"2", t:"Level 2" }];

  // Every row field is held AS TYPED, so a half-finished entry is never rewritten under his
  // hands and a loaded document's value round-trips even when this console would not have
  // produced it.
  function addedRow(d){
    d = d || {};
    function f(k){ return d[k] == null ? "" : String(d[k]); }
    return { name:f("name"), teams:f("teams"), bracket:f("bracket"),
             format:f("format"), level:f("level") };
  }

  // A number the director filled in but did not fill in VALIDLY is emitted AS HE TYPED IT, never
  // quietly dropped: `projected_field._normalise` then refuses it by name and quotes the value
  // back to him. Dropping it would turn a typo into an ABSENT OPTIONAL KEY, which the reader
  // accepts in silence — the exact class of defect this whole build exists to close.
  // Blank returns null, and the caller decides whether blank means "omit the key" (bracket) or
  // "the required answer is missing" (teams).
  function addedNum(v){
    var s = String(v == null ? "" : v).trim();
    if(s === "") return null;
    var n = Number(s);
    return (isFinite(n) && Math.floor(n) === n) ? n : s;
  }

  function addedIsDoubles(name){ return /doubles|mixed/i.test(String(name || "")); }

  // The per-row player echo. TEAMS is what he types; this says what that is in people, for the
  // doubles divisions where the two differ.
  function addedPlayersEcho(r){
    var t = addedNum(r.teams);
    if(typeof t !== "number" || t < 1) return "";
    if(!addedIsDoubles(r.name)) return t + (t === 1 ? " player" : " players");
    return (t * 2) + " players";
  }

  // THE EMIT. Three states, and they are the whole point of the toggle:
  //   no rows + toggle OFF -> null  -> `added_divisions` is ABSENT (unanswered; September refuses)
  //   toggle ON            -> []    -> answered, and the answer is none
  //   rows                 -> the list, in DOCUMENT ORDER so a saved setup round-trips
  // A blank OPTIONAL field emits NO KEY, never null — an absent key is what the reader already
  // means by "he did not say", and null is not.
  function addedDivisionsDoc(){
    if(!state) return null;
    if(state.added_none) return [];
    if(!state.added_rows.length) return null;
    return state.added_rows.map(function(r){
      var out = { name:String(r.name == null ? "" : r.name).trim(), teams:addedNum(r.teams) };
      var bk = addedNum(r.bracket);
      if(bk !== null) out.bracket = bk;
      var fm = String(r.format == null ? "" : r.format).trim();
      if(fm !== "") out.format = fm;
      var lv = String(r.level == null ? "" : r.level).trim();
      if(lv !== "") out.level = lv;
      return out;
    });
  }

  var CITY_OPEN = {};

  // CONS-1 (A7b) / ruling 8.4 option 1 — THE DIVISION PICKER. Composed from two controls the
  // director already uses; it mints nothing.
  //   * the FIND half is the Edit console's filter + native <select> (schedule_editor.html
  //     :473-474, renderDivSel :841). Two ruled semantics ride across unchanged: CUI-3 ruling 19
  //     — a filter is a way to FIND a division, never a way to hide one, so a query matching
  //     nothing narrows nothing and clearing it restores the full list — and ELIG-1's refusal of
  //     a hand-built combobox, so this stays a native <select> (on the courtside tablet that
  //     opens as a full-screen wheel). The steppers do NOT come across: they navigate between
  //     divisions being VIEWED, and here nothing is being viewed.
  //   * the HOLD half is this console's own city-chips pattern below — an Add button and a chip
  //     with a x — because both division fields are LISTS while the Edit console's control picks
  //     one.
  // The state stays the SAME comma-joined string the free-text box wrote, so `splitDivisions`
  // and the emit builder are untouched by construction: picking a division emits byte-identically
  // to typing it, and add-then-remove returns to the bare emit.
  var DIV_Q = {};   // the filter query per field. UI-only and deliberately NOT in `state` —
                    // nothing here may reach the emitted document.
  function divisionChips(b, key, label, options, emptyText){
    var chosen = splitDivisions(state[key]);
    var wrap=document.createElement("div"); wrap.className="field wide";
    var wl=document.createElement("label"); wl.textContent=label+" ("+chosen.length+")";
    wrap.appendChild(wl);
    var chips=document.createElement("div"); chips.className="chips";
    chips.setAttribute("data-field",key);
    if(!chosen.length){
      var em=document.createElement("span"); em.className="chips-empty"; em.textContent=emptyText;
      chips.appendChild(em);
    }
    chosen.forEach(function(nm){
      var chip=document.createElement("span"); chip.className="zipchip"; chip.textContent=nm+" ";
      var x=document.createElement("button"); x.type="button"; x.className="chip-x";
      x.textContent="×"; x.setAttribute("aria-label","Remove "+nm);
      x.addEventListener("click", function(){
        state[key]=chosen.filter(function(v){ return v!==nm; }).join(", ");
        render(); refreshCounts();
      });
      chip.appendChild(x); chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    var addrow=document.createElement("div"); addrow.className="addrow";
    var f=document.createElement("input"); f.type="search"; f.className="divfilter";
    f.setAttribute("data-filter", key); f.setAttribute("aria-label","Find a division");
    f.placeholder="find…"; f.autocomplete="off"; f.value=DIV_Q[key]||"";
    var sel=document.createElement("select"); sel.className="divpick";
    sel.setAttribute("data-pick", key); sel.setAttribute("aria-label", label);
    function fill(){
      var q=(DIV_Q[key]||"").trim().toLowerCase();
      var avail=options.filter(function(n){ return chosen.indexOf(n)<0; });
      var shown=avail.filter(function(n){ return !q || n.toLowerCase().indexOf(q)>-1; });
      if(!shown.length) shown=avail;      // ruling 19: a filter that finds nothing hides nothing
      var cur=sel.value;
      sel.innerHTML="";
      shown.forEach(function(n){
        var o=document.createElement("option"); o.value=n; o.textContent=n; sel.appendChild(o);
      });
      if(shown.indexOf(cur)>-1) sel.value=cur;
    }
    fill();
    // NO full re-render while typing. Re-rendering the form on each `input` steals focus — that
    // is the multi-digit-entry defect part B3 case (1) exists for. Only the options are refilled.
    f.addEventListener("input", function(){ DIV_Q[key]=f.value; fill(); });
    var addbtn=document.createElement("button"); addbtn.type="button";
    addbtn.className="btn-ghost btn-sm"; addbtn.setAttribute("data-add", key);
    addbtn.textContent="Add";
    function addDiv(){
      var n=sel.value;
      if(n && chosen.indexOf(n)<0){
        state[key]=chosen.concat([n]).join(", ");
        DIV_Q[key]=""; render(); refreshCounts();
      }
    }
    addbtn.addEventListener("click", addDiv);
    f.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); addDiv(); }
    });
    addrow.appendChild(f); addrow.appendChild(sel); addrow.appendChild(addbtn);
    wrap.appendChild(addrow);
    b.appendChild(wrap);
  }
  // The division names the generated console was built with, or [] when this file was opened
  // raw (the fallback lane — both fields stay free text, ruling 8.2).
  function drawnDivisions(){
    return (DRAWS && DRAWS.divisions && DRAWS.divisions.length) ? DRAWS.divisions : [];
  }
  function drawnMixed(){
    return drawnDivisions().filter(function(n){ return n.toLowerCase().indexOf("mixed")===0; });
  }
  // "Mixed 50 & over doubles" + "Mixed 60 & over doubles" -> "Mixed 50, 60 & over doubles".
  // Falls back to the plain list when the names do not share one shape, so an unfamiliar naming
  // year prints something TRUE rather than something tidy.
  function condenseMixed(names){
    var ages=[], tail=null, ok=names.length>0;
    names.forEach(function(n){
      var m=/^Mixed (\d+)( & over .+)$/.exec(n);
      if(!m){ ok=false; return; }
      if(tail===null) tail=m[2]; else if(tail!==m[2]) ok=false;
      ages.push(m[1]);
    });
    return (ok && tail) ? "Mixed "+ages.join(", ")+tail : names.join(", ");
  }

  function transitBody(b){

  function refreshCounts(){
    if(!state) return;
    // SETUP-FOLD (N7, ruling 2): the two writes above this line are DELETED with the two elements
    // they wrote to — the tournament-name line and the grey state line. Both were unguarded, so
    // the element and its write had to go together or the first call here kills the tab. The
    // Slate tab still owns and still shows the tournament name (its own `tname`, WIRE-1).
    refreshStatus();
  }
  function isPosInt(v){ var n=Number(v); return isFinite(n) && Math.floor(n)===n && n>0; }
  function validate(){
    var errs=[]; function E(msg, field){ errs.push({msg:msg, field:field}); }
    if(!isPosInt(state.min_start_to_start_minutes)) E("Rest between starts must be a positive whole number of minutes.","min_start_to_start_minutes");
    if(!isPosInt(state.match_minutes)) E("Match duration must be a positive whole number of minutes.","match_minutes");
    // WIRE-1: the picklist offers 60/75/90 and the engine now enforces the same set. A loaded doc
    // carrying another value KEEPS it (never silently rewritten — §5a) but is told, here, that the
    // schedule will refuse it, rather than being handed a doc that raises on arrival.
    else if(DURATIONS.indexOf(Number(state.match_minutes))<0)
      E("Match duration must be 60, 75 or 90 minutes — this setup carries "
        + state.match_minutes + ", and it will not build until that changes. Longer matches would cut a "
        + "60-and-over player's rest below the USTA minimum.","match_minutes");
    if(!isPosInt(state.matches_per_day_target)) E("Matches per day must be a positive whole number.","matches_per_day_target");
    if(!isPosInt(state.finals_per_day_singles)) E("Singles finals per day must be a positive whole number.","finals_per_day_singles");
    if(!isPosInt(state.finals_per_day_doubles)) E("Doubles finals per day must be a positive whole number.","finals_per_day_doubles");
    if(state.caps_mode==="age_based"){
      if(!isPosInt(state.cap_le55)) E("Cap (≤55) must be a positive whole number.","cap_le55");
      if(!isPosInt(state.cap_60to80)) E("Cap (60–80) must be a positive whole number.","cap_60to80");
      if(!isPosInt(state.cap_ge85)) E("Cap (85+) must be a positive whole number.","cap_ge85");
    } else {
      if(!isPosInt(state.cap_flat)) E("Limit must be a positive whole number.","cap_flat");
    }
    if(!isPosInt(state.sdf_gap)) E("Same-day finish gap must be a positive whole number of minutes.","sdf_gap");
    if(state.home_cities.some(function(c){ return String(c).trim()===""; }))
      E("Home cities must be non-empty.","home_cities");
    if(state.commuter_cities.some(function(c){ return String(c).trim()===""; }))
      E("Commuter cities must be non-empty.","commuter_cities");
    // CUI-3: a city in both tiers is ambiguous. Mirrors the validator's assertion
    // (`constraints.validate_constraints`), matched the same case-insensitive way.
    var homeSet={}; state.home_cities.forEach(function(c){ homeSet[String(c).trim().toLowerCase()]=1; });
    var dupes=state.commuter_cities.filter(function(c){ return homeSet[String(c).trim().toLowerCase()]===1; });
    if(dupes.length)
      E("A city cannot be both home and commuter — "+dupes.join(", ")+".","commuter_cities");
    if(state.avoid3_on){
      if(!isPosInt(state.avoid3_age_min)) E("Earliest-start age must be a positive whole number.","avoid3_age_min");
      if(!/^\d{1,2}:\d{2}$/.test(String(state.avoid3_earliest).trim())) E("Earliest-start time must be HH:MM.","avoid3_earliest");
    }
    // ---- S-6: the added divisions, checked PER FIELD rather than per typed line ----
    // Every one of these is a refusal `projected_field` already makes; the screen makes it
    // first, next to the control, instead of one courier step later in engine words. The one
    // that is NEW is the draw size against the team count — and it is new because until this
    // build there was no way to state a draw size at all. `_normalise` permits teams > bracket
    // and `_fabricate` then plans the smaller of the two, sizing a division down with nothing
    // said, so the screen is where that gets caught.
    // Skipped entirely when the toggle is on: the answer is "none" and the rows are not emitted.
    if(!state.added_none){
      var seenAdded = {};
      state.added_rows.forEach(function(r, i){
        var f = "added_" + i + "_", nm = String(r.name).trim();
        var who = nm ? "“" + nm + "”" : "Division " + (i + 1);
        if(nm === ""){
          E("Division " + (i + 1) + " needs a name.", f + "name");
        } else if(!/(\d+)\s*&\s*over/i.test(nm)){
          E(who + " needs an age bracket, as “55 & over”.", f + "name");
        } else {
          var key = nm.toLowerCase();
          if(seenAdded[key]) E(who + " is listed twice — a division can only be added once.",
                               f + "name");
          seenAdded[key] = 1;
        }
        var t = String(r.teams).trim();
        if(t === "" || !isPosInt(t) || Number(t) < 2){
          E(who + " needs at least 2 teams (a doubles pair is one team).", f + "teams");
        }
        var bk = String(r.bracket).trim();
        if(bk !== ""){
          if(!isPosInt(bk) || Number(bk) < 2){
            E(who + " draw size must be a whole number of at least 2.", f + "bracket");
          } else if(isPosInt(t) && Number(bk) < Number(t)){
            E(who + " has a draw size of " + bk + " but " + t + " teams — the draw cannot hold "
              + "the field, and the tool would plan the smaller number.", f + "bracket");
          }
        }
        // The two picklists cannot produce a bad value, but a LOADED document can, and a value
        // this console did not write is kept rather than silently rewritten (§5a). So it is
        // said here instead of arriving at the engine.
        var fm = String(r.format).trim();
        if(fm !== "" && fm !== "single_elim" && fm !== "round_robin"){
          E(who + " carries a format this tool does not know: " + fm + ".", f + "format");
        }
        var lv = String(r.level).trim();
        if(lv !== "" && lv !== "1" && lv !== "2"){
          E(who + " carries a level this tool does not know: " + lv + ".", f + "level");
        }
      });
    }
    return errs;
  }
  // WIRE-1 — the emitted td-constraints/v1. FIVE keys left this doc: `tournament` (the slate
  // carries it), `min_rest_minutes`, `rr_threshold`, `singles_before_doubles` and
  // `singles_day_ahead` (D-2: deleted, not wired — nothing read them). TWO joined it:
  // `matches_per_day_target` and `finals_per_day`, which FMAP-1 reads from the couriered doc.
  // `match_minutes` is unchanged in shape but is now CONSUMED — it sets the engine's block length.
  function buildConstraints(){
    return {
      schema: SCHEMA,
      min_start_to_start_minutes: Number(state.min_start_to_start_minutes),
      match_caps: {
        mode: state.caps_mode,
        age_based: { le55: Number(state.cap_le55), "60to80": Number(state.cap_60to80), ge85: Number(state.cap_ge85) },
        flat: Number(state.cap_flat)
      },
      // ENG-1 / D-41: emitted whole — the named divisions AND the gap, which the engine reads as
      // both the spacing and the width of its one rest-floor exception.
      same_day_finish: {
        divisions: splitDivisions(state.sdf_divisions),
        gap_minutes: Number(state.sdf_gap)
      },
      // DIV-1 / rule 45: which Mixed ages you sanctioned at Level 1. Blank is the normal case
      // and is NOT "none" — the tool derives the split from which draws file each division was
      // printed in and records what it read. This list, when you fill it in, wins.
      mixed_level_1: {
        divisions: splitDivisions(state.ml1_divisions)
      },
      // ENG-1: the three BAKED rules — the finals floor, the day shape and the three-event bands.
      // They are not settings and get no control, and since SETUP-STRIP they are not explained on
      // screen either. But they MUST ride in the emitted doc, because the engine maps
      // an omitted field to pre-ENG-1 behaviour (the contract's own rule, so a legacy doc stays
      // byte-identical). Leaving them out would make a console-driven run quietly differ from the
      // product default — two answers to one question, which is the defect class WIRE-1 removed.
      // Kept in step with `wwtc_pipeline.default_constraints()` or the two silently diverge.
      finals_earliest: state.finals_earliest,
      day_shape: state.day_shape,
      day_bands: state.day_bands,
      // VENUE-1: the venue rules the director stated — where the 80s play, where the semifinals
      // and finals play, where Level-1 Mixed plays, the lights cutoff, the fill order and the
      // 15:00-16:00 ceiling. Same contract as the three above: an omitted block means the engine
      // does what it did before the rule existed, so leaving it out would make a console-driven
      // run quietly differ from the product default.
      venue_rules: state.venue_rules,
      match_minutes: Number(state.match_minutes),
      matches_per_day_target: Number(state.matches_per_day_target),
      finals_per_day: {
        singles: Number(state.finals_per_day_singles),
        doubles: Number(state.finals_per_day_doubles)
      },
      placement_policy: {
        stage_multidivision_early: !!state.stage_multidivision_early,
        locals_early: !!state.locals_early
      },
      earliest_start_by_age: state.avoid3_on
        ? [{ age_min: Number(state.avoid3_age_min), earliest: String(state.avoid3_earliest).trim() }]
        : [],
      locality: {
        home_cities: state.home_cities.slice(),
        // CUI-3: DISPLAY-ONLY — the edit console's C badge. No engine path reads it.
        commuter_cities: state.commuter_cities.slice(),
        home_section: state.home_section || ""
      }
    };
  }

  // ---- §6F: what this module contributes to "What you set" ----
  // Live state, read at the moment the Review view is reached.
  // ⚠ THE WORDING AVOIDS TWO RETIRED FRAGMENTS ON PURPOSE. LANG-1 item 11's absence pin and
  // SETUP-FOLD's N7 both guard the grey state line this build's predecessor deleted, by the
  // fragments `multi-division early` and `locals early`. The two settings still have to be
  // summarised here, so they are named the way their own controls name them — "multi-division
  // players early", "local players earlier" — which says the same thing to the director and does
  // not resurrect a deleted line's wording.
  function summaryLine(){
    var on = function(v){ return v ? "<b>on</b>" : "<b>off</b>"; };
    return { caps:"Rules", lines:[
      "<b>" + esc(String(state.match_minutes)) + "-minute</b> matches · multi-division players "
      + "early " + on(state.stage_multidivision_early) + " · local players earlier "
      + on(state.locals_early) + " · <b>" + state.home_cities.length + "</b> home cities · <b>"
      + state.commuter_cities.length + "</b> commuter cities.",
      { faint:"Plus the " + lockedRuleCount() + " locked rules, which always apply." }
    ]};
  }

  // SETUP-3 §6F: this module's own paste box, its "Use these rules" button, its "Use the usual
  // rules" button and its error line all retire into `#loadPanel`. The LOADER ITSELF is untouched
  // — `prefillFrom` still migrates a legacy document key for key, and the load panel calls it.
  prefillFrom(SAMPLE);

  // S-3 §1-B: wired once, because the button lives outside the form and survives every re-render.
  (function(){
    var b = el("undo");
    if(b) b.addEventListener("click", undo);
    paintUndo();
  })();

  return { validate:validate, buildConstraints:buildConstraints,
           getMatchMinutes:function(){ return state ? state.match_minutes : null; },
           // S-2: `added_divisions` is a TOP-LEVEL key on `td-setup/v1`, not a constraint, so the
           // emit reads it from here rather than from `buildConstraints`. Returns null when the
           // director has not answered, and null keeps the key out of the bundle entirely.
           getAddedDivisions:addedDivisionsDoc,
           // ...and the matching read-back, called by `loadDocument` with the WHOLE bundle after
           // `prefill` has reset the rules. An explicitly EMPTY list comes back as the TOGGLE ON,
           // because "he answered and the answer was none" is a different fact from "he has not
           // answered" — the whole reason a September run refuses an absent key. The answer is
           // visible on screen and overwritable; the refusal is not disarmed, it is pre-satisfied.
           //
           // ⚠ S-6: THIS IS WHERE THE ROUND-TRIP LOSS USED TO HAPPEN. It rendered the list back
           // as `name x teams` text, so `bracket` and `format` were destroyed on every load and
           // `level` was re-inferred from the name on every emit. Filling FIELDS ends it at the
           // root: there is no re-parse, so there is nothing for a re-parse to lose.
           prefillAdded:function(list){
             if(!state || !Array.isArray(list)) return;
             state.added_none = list.length === 0;
             state.added_rows = list.map(function(d){
               var r = addedRow(d);
               // A loaded row that states no level gets today's inference IN THE FIELD, where he
               // can see it and change it — never silently at the emit. What is emitted after
               // Build is stated because he saw it stated.
               if(r.level === "") r.level = /^mixed/i.test(r.name) ? "1" : "2";
               return r;
             });
             render(); refreshCounts();
           },
           schema:SCHEMA,
           // S-3 review: rebuild the travel rows so they match the venues as they stand now.
           // ONE SECTION, not the tab — see `refreshTransitRows`.
           refreshTransit:refreshTransitRows,
           prefill:prefillFrom,
           // `RESETTING` is what tells `prefillFrom`'s snapshot a reset from a load.
           reset:function(){ RESETTING = true; try { prefillFrom(SAMPLE); } finally { RESETTING = false; } },
           summary:summaryLine,
           // WIRE-1: the Venues view calls this when the tournament name changes, so nothing
           // holds a stale copy of the one source.
           refreshCounts:function(){ if(state) refreshCounts(); } };
})();


// ============================================================================
// SETUP-3 §6E — THE LOCKED RULES VIEW
// ============================================================================
// Every rule the tool applies on its own, rendered from `LOCKED_RULES` and from nothing else.
// §3.2b makes this the ONE place SETUP-STRIP's prose removal is reversed, and the reversal is
// bounded to this view: no other screen gains a rule statement.
//
// SEARCH AND THE FLAG FILTER ARE FUNCTIONAL, and neither ever REORDERS. The Operator's 8/20
// ruling fixes the order (INVARIABLE -> AVOID -> NICE-TO-HAVE, alphabetical within each) and the
// two controls only decide which rows SHOW. That is also why they hide rows in place rather than
// re-rendering the table: a re-render on every keystroke would steal focus from the search box,
// which is the multi-digit-entry defect part B3 case (1) exists for.
var Locked = (function(){
  var root = document.getElementById("panel-locked");
  var host = root.querySelector('[data-el="lockedHost"]');
  var Q = "", FLAG = "ALL";
  var rows = [];

  function matches(r){
    if(FLAG !== "ALL" && r.flag !== FLAG) return false;
    if(!Q) return true;
    var q = Q.toLowerCase();
    return (r.name + " " + r.text).toLowerCase().indexOf(q) > -1;
  }
  function apply(){
    var shown = 0, last = null;
    rows.forEach(function(p){
      var on = matches(p.rule);
      p.node.classList.toggle("hide", !on);
      p.node.classList.remove("last");
      if(on){ shown++; last = p.node; }
    });
    if(last) last.classList.add("last");
    var none = host.querySelector('[data-el="lockedNone"]');
    if(none) none.style.display = shown ? "none" : "block";
    var cnt = host.querySelector('[data-el="lockedCount"]');
    if(cnt) cnt.textContent = shown + " of " + LOCKED_RULES.length + " shown";
    announce(shown + " of " + LOCKED_RULES.length + " rules shown.");
  }

  function render(){
    host.innerHTML = "";
    rows = [];
    var head=document.createElement("div"); head.className="lockhead";
    var intro=document.createElement("p"); intro.className="lockintro";
    intro.textContent="Every rule the tool applies on its own — no setting controls these.";
    head.appendChild(intro);

    var ctl=document.createElement("div"); ctl.className="lockctl";
    var sw=document.createElement("div"); sw.className="locksearch";
    sw.innerHTML='<svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">'
      + '<circle cx="6.5" cy="6.5" r="4.5" stroke="#9a9a9a" stroke-width="1.5"/>'
      + '<path d="M10 10l3 3" stroke="#9a9a9a" stroke-width="1.5" stroke-linecap="round"/></svg>';
    var si=document.createElement("input"); si.type="search"; si.placeholder="Search rules…";
    si.setAttribute("data-el","lockedSearch"); si.setAttribute("aria-label","Search rules");
    si.autocomplete="off"; si.value=Q;
    si.addEventListener("input", function(){ Q = si.value; apply(); });
    sw.appendChild(si);
    ctl.appendChild(sw);

    // The counts are COUNTED, never typed. A hand-kept number is how a screen ends up telling the
    // director there are 31 rules when the array holds 30.
    var by = {};
    LOCKED_RULES.forEach(function(r){ by[r.flag] = (by[r.flag]||0) + 1; });
    var fl=document.createElement("div"); fl.className="lockfilters";
    [["ALL","All",LOCKED_RULES.length]].concat(LOCKED_FLAGS.map(function(f){
      return [f, f.charAt(0)+f.slice(1).toLowerCase(), by[f]||0];
    })).forEach(function(spec){
      var b=document.createElement("button"); b.type="button";
      b.setAttribute("data-flag", spec[0]);
      b.textContent = spec[1] + " · " + spec[2];
      if(FLAG === spec[0]) b.className="on";
      b.addEventListener("click", function(){
        FLAG = spec[0];
        Array.prototype.forEach.call(fl.children, function(o){
          o.classList.toggle("on", o.getAttribute("data-flag") === FLAG);
        });
        apply();
      });
      fl.appendChild(b);
    });
    ctl.appendChild(fl);
    head.appendChild(ctl);
    host.appendChild(head);

    var tbl=document.createElement("div"); tbl.className="locktable";
    var hr=document.createElement("div"); hr.className="rr head";
    ["#","Rule","What it means","Flag"].forEach(function(t){
      var c=document.createElement("span"); c.className="caps"; c.textContent=t; hr.appendChild(c);
    });
    tbl.appendChild(hr);
    lockedRulesSorted().forEach(function(r){
      var row=document.createElement("div"); row.className="rr";
      row.setAttribute("data-rule-id", r.id);
      var id=document.createElement("span"); id.className="rid"; id.textContent=r.id;
      var nm=document.createElement("span"); nm.className="rn"; nm.textContent=r.name;
      var de=document.createElement("span"); de.className="rd"; de.textContent=r.text;
      var fg=document.createElement("span"); fg.className="fl "+r.flag; fg.textContent=r.flag;
      row.appendChild(id); row.appendChild(nm); row.appendChild(de); row.appendChild(fg);
      tbl.appendChild(row);
      rows.push({ rule:r, node:row });
    });
    host.appendChild(tbl);
    var none=document.createElement("p"); none.className="locknone";
    none.setAttribute("data-el","lockedNone"); none.style.display="none";
    none.textContent="No rule matches that.";
    host.appendChild(none);
    var cnt=document.createElement("p"); cnt.className="caps";
    cnt.setAttribute("data-el","lockedCount"); cnt.style.marginTop="14px";
    host.appendChild(cnt);
    apply();
  }
  render();
  return { render:render, count:function(){ return LOCKED_RULES.length; } };
})();

// ============================================================================
// EMIT — assemble the single td-setup/v1 bundle
// ============================================================================
// CUI-1: the Ingest review tab is retired — the bundle carries no per-level overrides
// (td-ingest-review-overrides/v1 retired; the ingest crash guards are the safety net).
// S-2 (Operator decision 7.2, 8/24): the divisions he is ADDING ride this same one block — the
// courier moves ONE JSON document and the section that captures them lives on this console, so a
// second document would mean one screen emitting two. The key is OPTIONAL and is omitted
// entirely when the section is untouched, which is what keeps the bare emit byte-identical
// (golden part K, both lanes) and every January run's bundle exactly what it is today.
function emitSetup(){
  var out = {
    schema: "td-setup/v1",
    slate: Slate.buildSlate(),
    constraints: Constraints.buildConstraints()
  };
  var added = Constraints.getAddedDivisions();
  if(added !== null) out.added_divisions = added;
  return out;
}
// SETUP-3 §2: `syncStickyTop` retires with the pinned band it measured. There is ONE sticky
// element now — the masthead band, which contains the header and the tabs — so there is no second
// band to offset against and no runtime measurement to keep in step.

// SETUP-3 §6H — THE ERROR REVEAL (replaces SETUP-FOLD's fold-reveal, ruling 5 of 8/13).
// A refusal must never sit on a view the director is not looking at. On a FAILED Build (and on
// nothing else) this: marks every refused field with the error style, switches to the view
// holding the FIRST refused field, and scrolls it into position. The warnbar still names every
// error, exactly as today — the same validate() functions, the same messages.
//
// Errors that name no field ("Add at least one venue.") have nothing to reveal and stay the
// warnbar's to say. So do errors on a HIDDEN section's fields (§3.9-2's three, §3.3, §3.4-5):
// their field has no screen, so the warnbar text is the whole working surface.
function clearRefusedFields(){
  Array.prototype.forEach.call(document.querySelectorAll(".field-error"),
    function(n){ n.classList.remove("field-error"); });
}
// A field has NO SCREEN when something between it and its view is display:none — a §3.9-2 hidden
// section, §3.3's Level-1 Mixed, §3.4-5's same-day finish. Asked of the ancestors only, never of
// the view panel itself: exactly one view is showing at any moment, so "is my panel active" would
// call every field on the other three viewless and there would be nowhere to send him.
function hasScreen(node){
  var n = node;
  while(n && n !== document.body && !(n.classList && n.classList.contains("panel-tab"))){
    if(getComputedStyle(n).display === "none") return false;
    n = n.parentElement;
  }
  return true;
}
function revealRefusedFields(){
  clearRefusedFields();
  var nodes = [];
  function push(sel, view){
    var n = sel && document.querySelector(sel);
    if(n) nodes.push([n, view]);
  }
  try {
    (Slate.validate() || []).forEach(function(e){
      if(e.meta) push('#panel-slate [data-el="'+ (e.meta==="daily_start" ? "dayStart" : "dayEnd") +'"]', "slate");
      // ⚠ THE TRAVEL CONTROL IS ON THE RULES TAB (Operator, 2026-08-24) — the error still comes
      // from Slate, because Slate still owns the data, but the field to mark and the view to
      // send him to are the Constraints panel's. Pointing this at `#panel-slate` left a refused
      // travel value unmarked and switched him to a tab that no longer holds the box.
      else if(e.pair) push('#panel-constraints input[data-pair="'+e.pair+'"]', "constraints");
      else if(e.li != null){
        // the venue's own fields are addressed by index; the day cells carry their date too
        var q = '#panel-slate [data-loc-index="'+e.li+'"][data-field="'+e.field+'"]';
        if(e.date != null) q += '[data-date="'+e.date+'"]';
        push(q, "slate");
      }
    });
  } catch(err){}
  try {
    (Constraints.validate() || []).forEach(function(e){
      if(e.field) push('#panel-constraints [data-field="'+e.field+'"]', "constraints");
    });
  } catch(err){}
    var shown = null;
  nodes.forEach(function(p){
    var n = p[0];
    // Marked whatever the control IS. Most refused fields are an <input> or a <select>, but §6D's
    // duration control is a segmented radiogroup carrying the `data-field` name, and a director
    // handed a refusal has to be able to SEE which control it names.
    n.classList.add("field-error");
    if(!shown && hasScreen(n)) shown = p;
  });
  if(shown){
    VIEWS.show(shown[1]);
    try { shown[0].scrollIntoView({block:"center"}); } catch(e){}
  }
  return !!shown;
}

// SETUP-3 §6F: Build lives in the masthead and its OUTPUT lives on the Review & Build view, so a
// successful Build takes the director there — the block he came to copy is on screen, under the
// summary of what he set. `revealRefusedFields` runs first and wins the view when it has a field
// to show: a refusal outranks the finish line. Emit is NOT gated on validation, by design (§1) —
// the block is produced either way, exactly as before.
document.getElementById("emitBtn").addEventListener("click", function(){
  var setup = emitSetup();
  document.getElementById("outPre").textContent = JSON.stringify(setup, null, 2);
  document.getElementById("emitOut").classList.add("show");
  document.getElementById("gate").textContent =
    "Your setup is ready. Press Copy, then paste it back into the chat.";
  showToggle(true);
  // A refusal OUTRANKS the finish line: if there is a refused field with a screen, the console
  // goes there instead. Only a build with nothing to show lands on Review & Build.
  if(!revealRefusedFields()) VIEWS.show("review");
  announce("Setup ready.");
  buildTimeNotices(setup);
});

// ============================================================================
// BUILD-TIME NOTICES — caught on the screen, not one step later in engine words
// ============================================================================
// ⚠ A NOTICE, NEVER A REFUSAL, AND THE DISTINCTION IS THE WHOLE DESIGN (Operator, 2026-08-24).
// The case this exists for: a setup with the added-divisions question unanswered builds cleanly,
// copies cleanly, and is then REFUSED by a September run — `projected_field.read_added_divisions`
// raises, correctly and loudly, because it cannot tell "he is adding none" from "the answer was
// lost in transit". The director learns at the courier step, in engine vocabulary, about a box on
// a tab he has already left.
//
// ⚠ IT CANNOT BE A REFUSAL, AND IT MUST NEVER BE AUTO-FILLED:
//   · a JANUARY run does not need the answer at all, so refusing every build would block the
//     lane that is right to leave it blank;
//   · writing an empty list on his behalf would destroy the exact distinction the engine's
//     refusal exists to protect — "he answered none" and "nobody answered" would become one
//     document, and the loud stop would be traded for a silently-wrong September field.
// So it says the thing, names where to fix it, and lets the build stand.
//
// A REFUSAL OUTRANKS IT. When `validate()` has anything to say, that already owns the bar and
// `revealRefusedFields` has already carried him to the field; a notice stacked on top would bury
// it. The bar is CLEARED on a clean build with nothing to note, which is why the empty-list call
// below is deliberate rather than a guard.
function buildTimeNotices(setup){
  var refused = 0;
  try {
    refused = ((Slate && Slate.validate()) || []).length
            + ((Constraints && Constraints.validate()) || []).length;
  } catch(e){ refused = 0; }
  if(refused) return;
  var notes = [];
  if(!setup || setup.added_divisions === undefined){
    // S-6: the fix this names moved with the control. There is no box to type `none` into any
    // more — the answer "none" is the section's own toggle, and this has to send him to the
    // thing that is actually on screen.
    notes.push("The divisions you are adding have not been answered, so a September planning run "
             + "will refuse this setup — it cannot tell “adding none” from an answer lost "
             + "on the way. Answer it on the Rules tab under Divisions You Are Adding: add the "
             + "divisions, or tick “I am adding no divisions next year”. A January run does not "
             + "need it.");
  }
  showWarnBar("Built — check this before you send it", notes, false);
}

// ============================================================================
// SETUP-3 §6F — THE LOAD PANEL: one entry point, one paste box
// ============================================================================
// Three load surfaces on two views (the Venues intake, its file picker, the Rules reuse chip)
// become one control in the masthead. It takes THE WHOLE `td-setup/v1` BLOCK the console emits,
// which until now could not be pasted back at all: its two halves had to be split by hand into
// two boxes on two screens, so the console's own output was not its own input. A bare
// `td-resource-slate/v1` or `td-constraints/v1` document still loads on its own, which is what
// keeps every saved half from before this build working.
function loadDocument(data){
  if(!data || typeof data !== "object"){ loadErr("That isn't a setup block."); return false; }
  var did = [];
  if(data.schema === "td-setup/v1" || (data.slate && data.constraints)){
    if(data.slate){ Slate.prefill(data.slate); did.push("venues and days"); }
    if(data.constraints){ Constraints.prefill(data.constraints); did.push("rules"); }
    // S-2: the added divisions ride the bundle's TOP level, so they are handed over here rather
    // than inside the rules block. AFTER `prefill`, which resets the rules to their defaults and
    // would otherwise blank this straight back out. A bundle carrying no such key leaves the
    // section blank, which is exactly what a January bundle should do.
    if(data.added_divisions !== undefined){
      Constraints.prefillAdded(data.added_divisions);
      did.push("divisions you are adding");
    }
  } else if(data.schema === Constraints.schema){
    Constraints.prefill(data); did.push("rules");
  } else if(Array.isArray(data.locations) || data.schema === "td-resource-slate/v1"){
    Slate.prefill(data); did.push("venues and days");
  } else {
    loadErr("That block isn't a saved setup, a set of venues or a set of rules.");
    return false;
  }
  if(!did.length){ loadErr("That block carried nothing to load."); return false; }
  loadErr("");
  refreshStatus();
  if(typeof renderReview === "function") renderReview();
  // S-6: SILENT AT BOOT. A page-load "Loaded venues and days and rules and divisions you are
  // adding" read aloud is noise — nothing happened that he did, and there is nothing for him to
  // react to. Every other call to this function is a paste he just made, and those still speak.
  if(!BOOTING) announce("Loaded " + did.join(" and ") + ".");
  return true;
}
document.getElementById("loadOpen").addEventListener("click", function(){
  if(document.getElementById("loadPanel").hidden) openLoadPanel(); else closeLoadPanel();
});
document.getElementById("loadClose").addEventListener("click", closeLoadPanel);
document.getElementById("loadAnother").addEventListener("click", function(){
  openLoadPanel();
  var t = document.getElementById("loadPaste");
  t.value = ""; loadErr(""); t.focus();
});
document.getElementById("loadUse").addEventListener("click", function(){
  var raw = document.getElementById("loadPaste").value.trim();
  if(!raw){ loadErr("Paste a saved setup first."); return; }
  var data;
  try { data = JSON.parse(raw); }
  catch(e){ loadErr("That isn't valid JSON. Check for a missing brace or trailing comma."); return; }
  if(loadDocument(data)) closeLoadPanel();
});
document.getElementById("loadFile").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(String(reader.result)); }
    catch(e){ loadErr("That file isn't valid JSON."); return; }
    document.getElementById("loadPaste").value = JSON.stringify(data, null, 2);
    if(loadDocument(data)) closeLoadPanel();
  };
  reader.onerror = function(){ loadErr("Could not read that file."); };
  reader.readAsText(f);
  ev.target.value = "";
});

// ============================================================================
// SETUP-3 §6F — REVIEW & BUILD: "What you set", from live state
// ============================================================================
// NEVER HAND-MAINTAINED. Every group below is rebuilt from `Slate` and `Constraints` each time
// this view is reached (`VIEWS.show` calls it), so a summary cannot describe a setup the director
// has since changed — which is the one way a review screen can do real harm.
function renderReview(){
  var host = document.querySelector('#panel-review [data-el="summaryHost"]');
  if(!host) return;
  host.innerHTML = "";
  var groups = [];
  try { groups = groups.concat(Slate.summary()); } catch(e){}
  try { groups.push(Constraints.summary()); } catch(e){}
  groups.forEach(function(g){
    var box = document.createElement("div"); box.className="sumgrp";
    var c = document.createElement("span"); c.className="caps"; c.textContent = g.caps;
    box.appendChild(c);
    g.lines.forEach(function(line){
      var p = document.createElement("p");
      if(typeof line === "string"){ p.innerHTML = line; }
      else { p.className = "faint"; p.textContent = line.faint; }
      box.appendChild(p);
    });
    host.appendChild(box);
  });
  // §6F: the emitted block is the LIVE EMIT, not a snapshot — it is re-read here, so arriving on
  // this view always shows what Build would produce right now.
  var pre = document.getElementById("outPre");
  if(pre && pre.style.display !== "none") pre.textContent = JSON.stringify(emitSetup(), null, 2);
  document.getElementById("emitOut").classList.add("show");
}

// §6F: "Reset and start over" — destructive-styled, behind a confirm, and it returns the console
// to THE PREFILLED DEFAULTS, not to blank (Engineer proposal, settled at build sign-off). Blank
// would hand the director an empty week and make him retype a venue list the tool already knows;
// the prefill is the state the console opens in, so Reset means "as if I had just opened it".
// ============================================================================
// S-3 review — THE VENUES PIN SITS UNDER THE MASTHEAD, MEASURED NEVER GUESSED
// ============================================================================
// The masthead band is itself `position:sticky; top:0`, so the pin below it needs an offset equal
// to the masthead's rendered height. That height is not a constant — it wraps at narrow widths and
// grows when the tournament name is long — so a hardcoded number would tuck the grid underneath
// the masthead on exactly the setups where the director most needs to see it. Measured on load
// and on resize instead, and written to the one custom property `.slatepin` reads.
(function(){
  var band = document.getElementById("mastBand");
  if(!band) return;
  function syncPinTop(){
    var h = Math.round(band.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--pin-top", h + "px");
  }
  syncPinTop();
  window.addEventListener("resize", syncPinTop);

  // ---- THE PIN VERIFIES ITSELF, AND FALLS BACK IF IT IS NOT ACTUALLY PINNING ----
  // ⚠ THIS EXISTS BECAUSE THE FEATURE FAILED SILENTLY ONCE (Operator, 2026-08-24). The root cause
  // was `body{overflow-x:hidden}` and is fixed above, but "sticky quietly does nothing" has more
  // than one cause — an ancestor gaining `overflow`, `contain`, or a `transform` all do it, and
  // any of those can arrive with a future edit. A pin that stops pinning looks EXACTLY like a pin
  // that was never built, which is how this reached the Operator rather than a test.
  // So it is MEASURED at runtime rather than assumed: once the page has scrolled far enough to
  // tell, compare where the pin actually is against where `top` says it should be. If it has
  // ridden away with the content, switch to a fixed pin whose left/width track a zero-height slot
  // left in the flow. One-shot — it stops measuring after the first verdict either way.
  var pin = document.querySelector(".slatepin");
  if(pin){
    var slot = document.createElement("div");
    slot.className = "pinslot";
    pin.parentNode.insertBefore(slot, pin);
    var verdict = false;
    function syncFixed(){
      if(!document.body.classList.contains("pin-fixed")) return;
      var r = slot.getBoundingClientRect();
      pin.style.left = Math.round(r.left) + "px";
      pin.style.width = Math.round(r.width) + "px";
      slot.style.height = pin.offsetHeight + "px";
    }
    function verify(){
      if(verdict) return;
      // Below this there is not enough travel to tell a pinned element from a scrolling one.
      if((window.scrollY || document.documentElement.scrollTop || 0) < 80) return;
      verdict = true;
      window.removeEventListener("scroll", verify);
      var want = parseFloat(getComputedStyle(pin).top) || 0;
      if(pin.getBoundingClientRect().top < want - 4){
        document.body.classList.add("pin-fixed");
        syncFixed();
        window.addEventListener("resize", syncFixed);
        // The pin's height changes when the grid folds, and the slot has to follow it or the
        // page jumps. The grid is rebuilt on every render, so watch it rather than hooking render.
        if(typeof ResizeObserver === "function"){
          try { new ResizeObserver(syncFixed).observe(pin); } catch(e){}
        }
      }
    }
    window.addEventListener("scroll", verify, {passive:true});
  }
  // The masthead reflows when the tournament name is typed or a setup is loaded, and neither
  // fires `resize`. ResizeObserver is the only thing that catches those; where it is unavailable
  // the load-time measurement still holds, which is the common case.
  if(typeof ResizeObserver === "function"){
    try { new ResizeObserver(syncPinTop).observe(band); } catch(e){}
  }
})();

document.getElementById("resetBtn").addEventListener("click", function(){
  if(!confirm("Start over?\n\nEverything you have set on Venues & Days and on Rules goes back to "
              + "the setup this console opens with. Anything you have typed is lost.\n\n"
              + "Your copied block, if you already pasted it into the chat, is not affected."))
    return;
  clearRefusedFields();
  Slate.reset();
  Constraints.reset();
  document.getElementById("gate").textContent = "";
  showToggle(true);
  renderReview();
  refreshStatus();
  announce("Setup reset to the usual starting point.");
});

// CUI-2 patch: fold the block away once copied, so it stops occupying the screen. It opens
// EXPANDED — you emit in order to copy, and hiding it at that moment fights the task.
function showToggle(open){
  var t=document.getElementById("outToggle"); if(!t) return;
  t.hidden=false; t.textContent=open?"Hide this block":"Show the block";
  t.setAttribute("aria-expanded", open?"true":"false");
}
document.getElementById("outToggle").addEventListener("click", function(){
  var pre=document.getElementById("outPre");
  var open=pre.style.display!=="none";
  pre.style.display=open?"none":"";
  showToggle(!open);
  announce(open?"Block hidden.":"Block shown.");
});

// ---------------------------------------------------------------------------
// CUI-2 — copy that tells the truth.
// The old handler reported "Copied" from the clipboard-rejection path and
// swallowed execCommand's exception, so in a sandboxed artifact frame (where
// navigator.clipboard is unavailable and execCommand is blocked) the button
// claimed success while the clipboard stayed empty. Both programmatic paths are
// now checked, and when they fail we select the text on the page so the reader
// can copy it with the keyboard — the one path that always works.
// ---------------------------------------------------------------------------
function legacyCopy(txt){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.setAttribute("readonly","");
  ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  return ok===true;
}
function selectOutput(){
  var pre=document.getElementById("outPre");
  try{
    var r=document.createRange(); r.selectNodeContents(pre);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    pre.classList.add("selected");
    return true;
  }catch(e){ return false; }
}
function copyKey(){
  return (navigator.platform||"").indexOf("Mac")>-1 ? "⌘ C" : "Ctrl + C";
}
document.getElementById("copyBtn").addEventListener("click", function(){
  var pre=document.getElementById("outPre");
  var txt=pre.textContent;
  if(!txt){
    txt=JSON.stringify(emitSetup(),null,2);
    pre.textContent=txt;
    document.getElementById("emitOut").classList.add("show");
  }
  var btn=this, gate=document.getElementById("gate");
  function done(){
    btn.textContent="Copied";
    gate.textContent="Copied. Paste it back into the chat.";
    announce("Copied to the clipboard.");
    setTimeout(function(){ btn.textContent="Copy"; },1600);
  }
  function manual(){
    var picked=selectOutput();
    gate.textContent = picked
      ? "Press "+copyKey()+" to copy — the setup is selected below."
      : "Select the setup below and copy it.";
    announce(gate.textContent);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){
      if(legacyCopy(txt)) done(); else manual();
    });
  } else if(legacyCopy(txt)){ done(); } else { manual(); }
});

// ---- S-6 §1-B: THE SEED, LOADED BEFORE THE FIRST PAINT ----
// A non-null `SETUP` slot goes through `loadDocument()` — the function the paste-back panel
// already calls, which handles exactly this shape in the documented order (slate, then rules,
// then the divisions he is adding, the last AFTER the rules prefill that would otherwise blank
// it back out). So the seed needs no loader of its own.
//
// ⚠ IT RUNS BEFORE `refreshStatus()` AND `renderReview()`, not after: those two paint what the
// console holds, and painting them twice — once empty, once seeded — is a visible flash of a
// tournament that is not his.
//
// ⚠ `BOOTING` MAKES IT SILENT AND UNDO-FREE. The announce is suppressed (nothing happened that
// he did) and no undo step is pushed (there is no earlier state to return to — both histories
// start empty after boot, exactly as on a console opened raw). A failure here must never take
// the whole console down with it: a seed that will not load leaves him the console he would
// have had anyway, which is the same fallback the runbook's Step 1 takes.
//
// A null slot does nothing at all, and that is the byte-identity lane (`setup_console_golden`
// part K drives both lanes bare).
if(SETUP){
  BOOTING = true;
  try { loadDocument(SETUP); }
  catch(e){ try { console.error("the seeded setup did not load", e); } catch(_){} }
  finally { BOOTING = false; }
}

// initial paint
refreshStatus();
renderReview();
})();
</script>
