  function hairline(){ var h=document.createElement("hr"); h.className="hair"; return h; }

  function render(){
    // S-3 review: the grid renders into the STICKY PIN, not into the scrolling form, so it stays
    // on screen while the director works down his venue list. It is refilled here rather than
    // left alone because every figure in it is derived from the state this render is redrawing.
    var pin = el("matrixHost");
    if(pin){ pin.innerHTML = ""; pin.appendChild(matrixSection()); paintFold(); }
    var host = el("form");
    host.innerHTML = "";
    host.appendChild(dayBand());
    host.appendChild(hairline());
    host.appendChild(venuesSection());
    host.appendChild(hairline());
    host.appendChild(footerBand());
  }

  // §6A: the underline input. `labelText` is the caps label above it — LANG-1 reads this label set
  // exactly, so the words here are the ruled words.
  function winField(labelText, value, type, onInput, opts){
    opts = opts || {};
    var f = document.createElement("div"); f.className = "win" + (type==="number" ? " num" : "");
    var id = "f_"+Math.abs(hashStr(labelText+"_"+(value||"")))+"_"+FIELD_SEQ++;
    var inp;
    if(type==="time"){
      inp = timeSelect(value, {allowBlank:!!opts.allowBlank});
      inp.addEventListener("change", function(){ onInput(inp.value); });
    } else {
      inp = document.createElement("input");
      inp.type = type||"text"; inp.value = (value==null?"":value);
      if(type==="number") inp.min = "0";
      inp.addEventListener("input", function(){ onInput(inp.value); });
    }
    inp.id = id;
    if(opts.el) inp.setAttribute("data-el", opts.el);
    var lab = document.createElement("label"); lab.setAttribute("for", id); lab.textContent = labelText;
    f.appendChild(lab); f.appendChild(inp);
    return f;
  }
  var FIELD_SEQ = 0;
  function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return h; }

  // ---- the playing-day band (§6C) ----
  // Three underline inputs and the derived sentence. The tournament NAME is not here: §6B gives it
  // the masthead, and WIRE-1's one-home rule means it cannot also live on this view.
  //
  // ⚠ The time fields are <select>s: one `change` per edit, so a re-render is safe. The NUMBER
  // field is not — it fires `input` per keystroke, and re-rendering there rebuilds the panel and
  // steals focus, so typing "60" used to register only "6". It updates the derived sentence in
  // place and re-renders on commit (change/blur) instead.
  function dayBand(){
    var band = document.createElement("div"); band.className="dayband";
    band.appendChild(winField("Day starts", state.daily_start, "time",
      function(v){ state.daily_start=v; render(); refreshCounts(); }, {el:"dayStart"}));
    band.appendChild(winField("Last match ends by", state.daily_end, "time",
      function(v){ state.daily_end=v; render(); refreshCounts(); }, {el:"dayEnd"}));
    var bufF = winField("Wrap-up minutes", state.eod_buffer, "number",
      function(v){ state.eod_buffer=v; refreshDerived(); });
    bufF.querySelector("input").addEventListener("change", function(){ render(); refreshCounts(); });
    bufF.querySelector("input").addEventListener("blur", function(){ render(); refreshCounts(); });
    band.appendChild(bufF);
    var sp=document.createElement("div"); sp.className="spacer"; band.appendChild(sp);
    var lat=document.createElement("p"); lat.className="derived";
    lat.setAttribute("data-el","latestStart");
    lat.innerHTML = latestStartHTML();
    band.appendChild(lat);
    return band;
  }
  // The engine admits a slot only while start + block <= daily_end - eod_buffer
  // (scheduler_multi.py:427-430). Since WIRE-1 `block` IS the Rules view's pick — the same number
  // the engine places on — so this figure is the one the TD actually gets.
  function latestStartLabel(block){
    var e=parseHHMM(state.daily_end), b=Number(state.eod_buffer);
    if(e===null || !isFinite(b)) return "—";
    var t=e-b-(block||DEFAULT_BLOCK_MINUTES);
    if(t < 0) return "not until the day is longer";
    return ("0"+Math.floor(t/60)).slice(-2)+":"+("0"+(t%60)).slice(-2);
  }
  // §6C's sentence. THE FIGURE STAYS ON THE 24-HOUR CLOCK the rest of this console runs on — every
  // time input on the view is an HH:MM <select>, and one 12-hour figure among them would be the
  // only place the TD has to convert. (The locked mockup renders "3:30 PM"; this is the one place
  // the transcription departs from it, and it is a one-word change if the Operator wants 12-hour.)
  function latestStartHTML(){
    var lab = latestStartLabel(plannedBlock());
    if(lab === "—") return "The latest a match can begin needs a valid day window.";
    if(lab === "not until the day is longer")
      return "No match fits in the day as set — the wrap-up leaves no room to start one.";
    return "The latest a match can begin is <b>" + esc(lab) + "</b>.";
  }
  // Refresh only the derived text, leaving focus and the DOM alone (see the number-field note).
  function refreshDerived(){
    var lat = root.querySelector('[data-el="latestStart"]');
    if(lat) lat.innerHTML = latestStartHTML();
    refreshCounts();
  }

  // ---- the Venues header + the bulk range lane + the ledger sections (§6C) ----
  function venuesSection(){
    var wrap = document.createElement("div");
    var head = document.createElement("div"); head.className="venhead";
    var hl = document.createElement("div"); hl.className="hleft";
    var t=document.createElement("span"); t.className="htitle"; t.textContent="Venues";
    hl.appendChild(t);
    // CONS-1 (N2) / §6C: venue order IS the fill order and the rank-1 venue IS the main site
    // (rule 43/8). The stake is stated once, where it can be read before anything is clicked.
    var c=document.createElement("span"); c.className="caps";
    c.textContent="The order is the fill order — the top club is the main site";
    hl.appendChild(c);
    head.appendChild(hl);
    var add = document.createElement("button"); add.className="btn-ghost"; add.textContent="+ Add a venue";
    add.setAttribute("data-el","addVenue");
    add.addEventListener("click", function(){
      state.locations.push({id:"",name:"",available:{},lit:"",lights_on:"",max:""});
      render(); refreshCounts();
    });
    head.appendChild(add);
    wrap.appendChild(head);

    if(notice){
      var nb=document.createElement("p"); nb.className="hint inert"; nb.setAttribute("role","status");
      nb.textContent=notice; wrap.appendChild(nb);
      notice = "";   // one-shot: consumed by this render
    }
    if(!state.locations.length){
      var em=document.createElement("p"); em.className="hint"; em.textContent="No venues yet — add at least one.";
      wrap.appendChild(em);
    }
    // SLATE-1 item 2 / §6C: the bulk range lane rides the token row. One date range opened across
    // every venue at once — the only place a range is entered now the global Dates panel is gone.
    if(state.locations.length){
      var allb=document.createElement("div"); allb.className="bulk";
      var at=document.createElement("span"); at.className="btitle";
      at.textContent="Open a range of days at every venue";
      allb.appendChild(at);
      var fromF=bulkField("from","date",""), toF=bulkField("to","date","");
      var cF=bulkField("courts","number",""), sF=bulkField("opens","time",""), eF=bulkField("closes","time","");
      [fromF,toF,cF,sF,eF].forEach(function(f){ allb.appendChild(f.wrap); });
      var applyAll=document.createElement("button"); applyAll.className="btn-ghost btn-sm";
      applyAll.textContent="Open these days";
      applyAll.addEventListener("click", function(){
        var gen=datesInRange(fromF.input.value, toF.input.value);
        if(!gen.length){ showErr("Give a from-date and a to-date to open a range."); return; }
        clearErr();
        state.locations.forEach(function(L){
          applyToDates(L, gen, cF.input.value, sF.input.value, eF.input.value, true);
        });
        render(); refreshCounts();
      });
      allb.appendChild(applyAll);
      wrap.appendChild(allb);
      if(!derivedDates().length){
        var dh=document.createElement("p"); dh.className="hint";
        dh.innerHTML = "No days open yet. Open a range above, or click a day on a venue.";
        wrap.appendChild(dh);
      }
      // SETUP-2: where these days came from. Rule 8's wording — READ and CHECK, never "your dates
      // are": the derivation is measured to disagree with the director's own record on 2 of 3
      // venues, so a screen that asserted it would hand him someone else's decision in his own
      // voice. Rendered only on a generated console.
      var prov = datesProvenanceHTML();
      if(prov){
        var ph=document.createElement("p"); ph.className="hint"; ph.setAttribute("data-el","datesFrom");
        ph.innerHTML = prov;
        wrap.appendChild(ph);
      }
    }
    var locGrid=document.createElement("div"); locGrid.className="loc-grid";
    state.locations.forEach(function(L, li){ locGrid.appendChild(locationBlock(L, li)); });
    wrap.appendChild(locGrid);
    return wrap;
  }

  // ======= SETUP-3 defect fix (Operator review, 8/21) — ONE summary, three readers =======
  // The stat row, the day detail and the Review & Build summary all describe THE SAME per-day
  // values, and each used to work them out for itself. The stat row's answer was `Math.max`, which
  // is not a summary of ten days — it is one of them. So a club whose Tuesday dropped to 12
  // announced "24" in 44px numerals with the grid showing 12 directly underneath, and never moved
  // until every day was lowered. Three readers, ONE derivation, from here on.
  //
  // The rule these two functions enforce: a single figure is printed ONLY when every open day
  // agrees. When they disagree the screen says so — a range for courts, "varies" for the morning
  // step-up — because there is no one number, and printing one anyway is the defect.
  function courtsSummary(L){
    var vals = Object.keys(L.available).map(function(d){ return Number(L.available[d].courts); })
                     .filter(function(n){ return isFinite(n) && n > 0; });
    if(!vals.length) return { text:null, lo:null, hi:null, uniform:true };
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    return { text:(lo === hi ? String(hi) : lo + "–" + hi), lo:lo, hi:hi, uniform:(lo === hi) };
  }
  function morningSummary(L){
    var counts = {}, untils = {};
    Object.keys(L.available).forEach(function(d){
      var c = L.available[d];
      if(c.mcourts != null && c.mcourts !== "" && c.muntil){ counts[c.mcourts]=1; untils[c.muntil]=1; }
    });
    var ck = Object.keys(counts), uk = Object.keys(untils);
    if(!ck.length) return { text:null, qual:"", uniform:true };
    if(ck.length === 1 && uk.length === 1)
      return { text:ck[0], qual:"until "+uk[0], uniform:true };
    return { text:"varies", qual:"by day", uniform:false };
  }

  // §6C: one ledger section per venue, hairline-separated, carrying the FULL control set (§3.6 —
  // a venue's presentation never reduces what can be set on it).
  function locationBlock(L, li){
    var loc = document.createElement("div"); loc.className="loc";
    // §6H: the error reveal addresses a venue by list position, not by DOM order — the two part
    // company the moment a venue is reordered or split.
    loc.dataset.locIndex = li;

    // ---- header row: club name + rank tag · code · days open · reorder · delete ----
    var head = document.createElement("div"); head.className="vhead";
    var hl = document.createElement("div"); hl.className="hleft";
    var nameWrap = document.createElement("span"); nameWrap.className="vname";
    var nameInp = document.createElement("input"); nameInp.type="text";
    nameInp.value = L.name || ""; nameInp.placeholder = "Name this club";
    nameInp.setAttribute("aria-label", "Club name");
    nameInp.dataset.locIndex = li; nameInp.dataset.field = "name";
    nameInp.addEventListener("input", function(){ L.name=nameInp.value; });
    nameInp.addEventListener("blur", function(){ render(); refreshCounts(); });
    nameWrap.appendChild(nameInp);
    hl.appendChild(nameWrap);
    // §3.7 A4: the third venue's tag is "Overflow №3" — "· last resort" is deleted.
    if(li === 0){
      var chip=document.createElement("span"); chip.className="chip-main";
      chip.textContent="Main site · fills first";
      hl.appendChild(chip);
    } else {
      var ov=document.createElement("span"); ov.className="caps";
      ov.textContent="Overflow №"+(li+1);
      hl.appendChild(ov);
    }
    head.appendChild(hl);

    var hr = document.createElement("div"); hr.className="hright";
    hr.appendChild(winField("Code", L.id, "text", function(v){ L.id=v; }, {}));
    var codeInp = hr.querySelector("input");
    codeInp.dataset.locIndex = li; codeInp.dataset.field = "id";
    codeInp.style.width = "84px";
    codeInp.addEventListener("blur", function(){ render(); refreshCounts(); });
    var nOpen = Object.keys(L.available).filter(function(d){ return d; }).length;
    var days=document.createElement("span"); days.className="caps"; days.style.paddingBottom="6px";
    days.textContent = nOpen + (nOpen===1 ? " day open" : " days open");
    hr.appendChild(days);
    // ---- VENUE-1 (rule 43) / §3.9-6: the reorder control. The fill order IS this list's order —
    // `resource_slate._court_layout` lays the court ranges out in this array's order and
    // `scheduler_multi._scan_locations` filters that order without ever re-sorting it. Moving a
    // venue up IS ranking it, and the top venue is the "main site" every venue rule is written
    // against. Deliberately NOT a rank number typed into a box: two venues could then claim rank 1.
    // Reordering re-derives the Main site / Overflow №n tags, because render() rebuilds them.
    var rb = document.createElement("div"); rb.className="rbtns";
    var mvUp = document.createElement("button"); mvUp.className="rbtn"; mvUp.innerHTML="&#9650;";
    mvUp.setAttribute("aria-label","Move "+(L.id||"this venue")+" up");
    mvUp.title = "Move up. Venues fill in this order. Top = main site.";
    mvUp.disabled = (li === 0);
    mvUp.addEventListener("click", function(){
      if(li === 0) return;
      var moved = state.locations.splice(li, 1)[0];
      state.locations.splice(li - 1, 0, moved);
      setNotice("Moved " + (moved.id || "that venue") + " up. Venues fill in this order, and the "
        + "one at the top is the main site.");
      render(); refreshCounts();
    });
    rb.appendChild(mvUp);
    var mvDn = document.createElement("button"); mvDn.className="rbtn"; mvDn.innerHTML="&#9660;";
    mvDn.setAttribute("aria-label","Move "+(L.id||"this venue")+" down");
    mvDn.title = "Move down. Venues fill in this order. Top = main site.";
    mvDn.disabled = (li === state.locations.length - 1);
    mvDn.addEventListener("click", function(){
      if(li >= state.locations.length - 1) return;
      var moved = state.locations.splice(li, 1)[0];
      state.locations.splice(li + 1, 0, moved);
      setNotice("Moved " + (moved.id || "that venue") + " down. Venues fill in this order, and the "
        + "one at the top is the main site.");
      render(); refreshCounts();
    });
    rb.appendChild(mvDn);
    hr.appendChild(rb);
    // Review item (routed into SLATE-1): duplicate-and-rename, for splitting court loading across
    // two records of the SAME physical club. It SPLITS the courts rather than copying them
    // (Operator, 2026-07-30): copying the 20-court main club told the engine there were 40 courts
    // and it would then book a club into courts that do not exist.
    var dup = document.createElement("button"); dup.className="vdel"; dup.style.color="#5f5f5f";
    dup.textContent="Split";
    dup.setAttribute("data-el","splitVenue");   // stable name across the §6C re-skin
    dup.title = "Split into two sites. Courts divide between them.";
    dup.addEventListener("click", function(){ splitVenue(L, li); });
    hr.appendChild(dup);
    var rm = document.createElement("button"); rm.className="vdel"; rm.textContent="Delete venue";
    rm.setAttribute("data-el","deleteVenue");
    rm.addEventListener("click", function(){ deleteVenue(L, li); });
    hr.appendChild(rm);
    head.appendChild(hr);
    loc.appendChild(head);

    // ---- the stat row: oversized numerals + the day tokens ----
    loc.appendChild(statRow(L, li));

    // ---- S-1 §1-D: this venue's courts and hours, across this venue's own days ----
    // 2026-08-24: paired with the morning step-up, side by side — the two bulk controls are the
    // same kind of thing and now read as one row rather than two stacked ones.
    // ⚠ THE MORNING STEP-UP ROW IS OFF THE SCREEN (Operator, 2026-08-24), so the courts-and-hours
    // block takes the whole width again and the `.bulkpair` wrapper goes with its second child.
    // `venueMorningBulk` is KEPT AND UNCALLED — the deprecate-not-delete pattern this file
    // already uses for `#subPanel` and `match_caps` — because whether it returns is an OPEN
    // OPERATOR DECISION, not a settled removal: it was taken off after the tie-out defect it
    // exposed (a court count applied across days leaves an existing morning hold-back stale, and
    // a hold-back larger than its day is refused by nothing and reaches the engine as extra
    // courts). Re-enabling it is this one line; deleting the builder is not this session's call.
    loc.appendChild(venueBulk(L, li));

    // ---- the day details, one per open day, expanded from a token (§6C) ----
    var wrap=document.createElement("div"); wrap.className="days";
    Object.keys(L.available).sort().forEach(function(d){ wrap.appendChild(dayBlock(L, li, d)); });
    loc.appendChild(wrap);
    return loc;
  }

  // ---- S-1 §1-D — APPLY A VENUE'S COURTS AND HOURS ACROSS ITS OWN OPEN DAYS ----
  // The shipped bulk lane ("Open a range of days at every venue") walks EVERY venue with the SAME
  // courts and the SAME hours. That is the right tool for one club and the wrong one for five on
  // different court counts, which is the September case: measured, the per-venue controls were
  // only the move arrows, Split, Delete venue, the day tokens and the per-day fields, so filling
  // a five-club slate meant typing every day of every club by hand.
  //
  // THE GLOBAL LANE IS LEFT EXACTLY AS IT IS. This sits with the venue's own controls, inside the
  // venue's card, and never reaches another club's days.
  //
  // IT WRITES ONLY THE FIELDS THE DIRECTOR FILLED IN, and only onto days this venue already has
  // open — it opens nothing and closes nothing. A blank box means "leave that alone", so applying
  // courts does not silently wipe hours, and neither touches the morning step-up (`mcourts` /
  // `muntil`) the way `applyToDates` does when it rebuilds a cell from scratch. A slate this
  // control was not used on emits byte-identically, by construction: it mutates nothing until the
  // button is pressed.
  //
  // NO STATE IN THE DOM. The console re-renders on ~20 edit paths and every open/closed state
  // lives in the JS registry; this control deliberately has no open/closed state to lose — it is
  // always visible on the card, and its three boxes are transient exactly like the global lane's.
  //
  // NO NEW COLOUR AND NO OFF-LEDGER SPACING: it reuses `.bulk`, `bulkField` and
  // `btn-ghost btn-sm`, all already on the record, so `brand1_design_lock` parts C/E/G stay green
  // without the record being widened.
  // ---- THE MORNING TIE-OUT GUARD (Operator, 2026-08-24, option 2 of three put to him) ----
  // ⚠ THE DEFECT IT REFUSES, measured end to end before the fix: applying a COURT COUNT across a
  // venue's days left an existing morning hold-back untouched, so a day reached "8 courts, 9 held
  // back in the morning" — a hold-back larger than the day it sits in. NOTHING caught it: not this
  // console's `validate()`, not `resource_slate.validate_slate` (which checks the pair is
  // both-or-neither and positive, never that the hold-back is smaller). And
  // `scheduler_multi._cap_for_slot` RETURNS the morning figure rather than capping with it, so
  // such a day is scheduled at NINE concurrent matches on a club booked for EIGHT — courts that do
  // not exist, silently, before the switch time.
  //
  // ⚠ OPTION 2 REFUSES AND WRITES NOTHING — the Operator's ruling over the Engineer's
  // recommendation (option 1 auto-cleared the invalidated hold-backs and reported which days).
  // The trade he took: the tool never silently edits a second field he did not name, and the cost
  // is that he fixes the conflicting days himself before the apply will run. Recorded so a future
  // session does not "improve" this into a silent auto-correct.
  //
  // ⚠ IT IS ALL-OR-NOTHING BY DESIGN. A partial apply — some days written, the conflicting ones
  // skipped — is the worst of both: the screen would then hold two different court counts for one
  // venue and no refusal explains why.
  //
  // ⚠ THIS BUTTON IS THE ONLY ROUTE GUARDED, AND THAT IS RULED, NOT AN OVERSIGHT.
  // Operator, 2026-08-24, option 3 of three: the wider guard is NOT built. Two routes into the
  // same contradiction stay open and are ACCEPTED:
  //   · typing a morning hold-back on a single day that is >= that day's own court count;
  //   · loading a saved setup that already carries such a day.
  // Neither is refused by this console's `validate()` nor by `resource_slate.validate_slate`, and
  // `scheduler_multi._cap_for_slot` RETURNS the morning figure rather than capping with it — so a
  // day that reaches that state is scheduled at the morning number on a club booked for fewer.
  // The consequence is silent: the schedule looks ordinary and quietly assumes courts that do not
  // exist before the switch time.
  // MEASURED when the guard was costed: it would have rejected NOTHING that exists today — 0 of
  // the 10 venue-days carrying a hold-back, across the committed 2026 field and the 2027 seed.
  // ⚠ DO NOT ADD IT BACK AS A TIDY. Re-opening this is an Operator decision, not a drafting one.
  function morningConflicts(locs, courts){
    var out=[];
    if(courts==="" || courts==null) return out;          // not setting courts: cannot conflict
    var n=Number(courts);
    if(!isFinite(n)) return out;                          // a bad number is refused elsewhere
    locs.forEach(function(V){
      Object.keys(V.available).filter(function(d){ return d; }).sort().forEach(function(d){
        var cell=V.available[d];
        if(!cell || cell.mcourts==null || cell.mcourts==="") return;
        var m=Number(cell.mcourts);
        if(!isFinite(m)) return;
        if(!(m < n)) out.push((V.id||V.name||"this venue")+" "+d+" (holds back "+cell.mcourts+")");
      });
    });
    return out;
  }
  // The refusal surface is the TOP WARNING BAR, not `showErr`. ⚠ `showErr` routes to the LOAD
  // PANEL's error line and OPENS THAT PANEL to show it — so an apply refusal would pop the
  // "Load a saved setup" drawer over the screen, which is a different action entirely. The two
  // pre-existing refusals in these handlers are moved onto the bar with this one rather than left
  // pointing somewhere the message does not belong.
  function applyRefused(items){
    showWarnBar("Nothing was applied", items, true);
    try { announce(items[0]); } catch(e){}
  }

  function venueBulk(L, li){
    var b=document.createElement("div"); b.className="bulk";
    b.setAttribute("data-el","venueApply");
    var t=document.createElement("span"); t.className="btitle";
    t.textContent="Set courts and hours on this venue's open days";
    b.appendChild(t);
    var cF=bulkField("courts","number",""), sF=bulkField("opens","time",""), eF=bulkField("closes","time","");
    [cF,sF,eF].forEach(function(f){ b.appendChild(f.wrap); });
    var go=document.createElement("button"); go.className="btn-ghost btn-sm";
    go.textContent="Apply to this venue";
    go.setAttribute("data-el","applyVenueDays");
    go.addEventListener("click", function(){
      var days=Object.keys(L.available).filter(function(d){ return d; }).sort();
      var who=L.id||L.name||"this venue";
      if(!days.length){
        applyRefused(["There are no days open at "+who+" yet — click a day, or open a range above, first."]);
        return;
      }
      var c=cF.input.value, s=sF.input.value, e=eF.input.value;
      if(c==="" && s==="" && e===""){
        applyRefused(["Fill in courts, opening time or closing time to apply them across "+who+"'s days."]);
        return;
      }
      var clash=morningConflicts([L], c);
      if(clash.length){
        applyRefused([c+" courts is not more than the morning hold-back on "+clash.length
          +(clash.length===1?" day":" days")+" at "+who+". A morning hold-back has to be FEWER "
          +"courts than the day it sits in, so nothing was changed. Lower those days' morning "
          +"counts, or press “same all day” on them, then apply again."].concat(clash));
        return;
      }
      showWarnBar("", [], false);
      days.forEach(function(d){
        var cell=L.available[d];
        if(!cell) return;
        if(c!=="") cell.courts=String(c);
        if(s!=="") cell.start=s;
        if(e!=="") cell.end=e;
      });
      var what=[];
      if(c!=="") what.push(c+" courts");
      if(s!=="") what.push("opening at "+s);
      if(e!=="") what.push("closing at "+e);
      setNotice("Set "+what.join(", ")+" on all "+days.length+" of "+who+"'s open days. "
        +"Nothing at your other venues changed.");
      render(); refreshCounts();
    });
    b.appendChild(go);
    // ---- "Apply to all venues" (Operator, 2026-08-24) ----
    // The same write, across every club's open days. It follows the per-venue button's rules
    // exactly: only the fields he filled in, only onto days already open, nothing opened or
    // closed, and the morning step-up untouched. The notice states BOTH denominators — how many
    // days and how many clubs — because "applied everywhere" with no number is the kind of
    // reassurance a director cannot check.
    var allv=document.createElement("button"); allv.className="btn-ghost btn-sm";
    allv.textContent="Apply to all venues";
    allv.setAttribute("data-el","applyAllVenueDays");
    allv.addEventListener("click", function(){
      var c=cF.input.value, s2=sF.input.value, e2=eF.input.value;
      if(c==="" && s2==="" && e2===""){
        applyRefused(["Fill in courts, opening time or closing time to apply them across every venue."]);
        return;
      }
      var clashAll=morningConflicts(state.locations, c);
      if(clashAll.length){
        applyRefused([c+" courts is not more than the morning hold-back on "+clashAll.length
          +(clashAll.length===1?" day":" days")+" across your venues. A morning hold-back has to "
          +"be FEWER courts than the day it sits in, so nothing was changed at ANY venue. Lower "
          +"those days' morning counts, or press “same all day” on them, then apply again."]
          .concat(clashAll));
        return;
      }
      var tot=0, clubs=0;
      state.locations.forEach(function(V){
        var ds=Object.keys(V.available).filter(function(d){ return d; });
        if(!ds.length) return;
        clubs++;
        ds.forEach(function(d){
          var cell=V.available[d]; if(!cell) return;
          if(c!=="") cell.courts=String(c);
          if(s2!=="") cell.start=s2;
          if(e2!=="") cell.end=e2;
          tot++;
        });
      });
      if(!tot){ applyRefused(["No venue has any days open yet — open a range of days first."]); return; }
      showWarnBar("", [], false);
      var what=[];
      if(c!=="") what.push(c+" courts");
      if(s2!=="") what.push("opening at "+s2);
      if(e2!=="") what.push("closing at "+e2);
      setNotice("Set "+what.join(", ")+" on "+tot+" open days across all "+clubs
                +(clubs===1?" venue.":" venues."));
      render(); refreshCounts();
    });
    b.appendChild(allv);
    return b;
  }

  // ---- the morning step-up, across this venue's own days ----
  // ⚠ BUILT, THEN TAKEN OFF THE SCREEN THE SAME DAY (Operator, 2026-08-24), AND KEPT UNCALLED.
  // It was asked for — "the morning open hours needs an 'apply to this venue' option so user
  // doesn't need same info to input every day" — and it works: ten days at one club is two
  // entries rather than twenty, driven.
  // It came off after the defect it exposed, which is NOT in this function: applying a COURT
  // COUNT across a venue's days leaves an existing morning hold-back untouched, so a day can end
  // up reading "8 courts, 10 held back in the morning". Nothing refuses that — not this console's
  // `validate()`, not `resource_slate.validate_slate` — and `scheduler_multi._cap_for_slot`
  // RETURNS the morning figure rather than capping with it, so such a day is scheduled at TEN
  // concurrent matches on eight courts. Measured, not argued.
  // WHETHER THIS RETURNS IS AN OPEN OPERATOR DECISION. Deprecate-not-delete, the pattern this
  // file already uses for `#subPanel` and `match_caps`: re-enabling is one line in `locBlock`.
  // ⚠ THE UNDERLYING DEFECT IS STILL LIVE WITHOUT THIS ROW — the courts apply is what breaks the
  // pair, and that button is still on the screen. Taking this row off did not fix it.
  //
  // ⚠ BOTH BOXES OR NEITHER. A morning count with no switch-over time — or a time with no count —
  // is the half-filled pair `validate()` already refuses and the per-day row is built to prevent.
  // It is refused HERE, in words, rather than written and caught later.
  //
  // ⚠ A DAY IT CANNOT SENSIBLY TAKE IS SKIPPED, NOT FORCED, AND THE SKIP IS REPORTED. A morning
  // hold-back has to be FEWER courts than the day already has, or it is not a step-up; a day with
  // no court count yet has nothing to step down from. Refusing the whole apply over one such day
  // would make the control useless on a mixed slate, and writing it anyway would produce exactly
  // the "fewer courts that reduce nothing" defect the 2026-07-30 review found in the per-day seed.
  function venueMorningBulk(L, li){
    var b=document.createElement("div"); b.className="bulk";
    b.setAttribute("data-el","venueMorningApply");
    var t=document.createElement("span"); t.className="btitle";
    t.textContent="Set a morning step-up on this venue's open days";
    b.appendChild(t);
    var mF=bulkField("morning courts","number",""), uF=bulkField("switches at","time","");
    [mF,uF].forEach(function(f){ b.appendChild(f.wrap); });
    var go=document.createElement("button"); go.className="btn-ghost btn-sm";
    go.textContent="Apply to this venue";
    go.setAttribute("data-el","applyVenueMorning");
    go.addEventListener("click", function(){
      var days=Object.keys(L.available).filter(function(d){ return d; }).sort();
      var who=L.id||L.name||"this venue";
      if(!days.length){
        showErr("There are no days open at "+who+" yet — click a day, or open a range above, first.");
        return;
      }
      var m=mF.input.value, u=uF.input.value;
      if(m==="" && u===""){
        showErr("Fill in the morning court count and the time it switches, to set them across "
          +who+"'s days.");
        return;
      }
      if(m==="" || u===""){
        showErr("A morning step-up needs BOTH the morning court count and the time it switches — "
          +"one without the other is not a setting the tool can use.");
        return;
      }
      var mn=Number(m);
      if(!isFinite(mn) || !Number.isInteger(mn) || mn<=0){
        showErr("Morning courts must be a whole number above zero (got "+m+").");
        return;
      }
      var set=0, skipped=[];
      clearErr();
      days.forEach(function(d){
        var cell=L.available[d]; if(!cell) return;
        var full=Number(cell.courts);
        if(!isFinite(full) || !full){ skipped.push(d); return; }
        if(!(mn<full)){ skipped.push(d); return; }
        cell.mcourts=String(m); cell.muntil=u; set++;
      });
      var msg="Set "+m+" courts until "+u+" on "+set+" of "+who+"'s "+days.length+" open days.";
      if(skipped.length)
        msg += " Left "+skipped.length+" alone ("+skipped.slice(0,3).join(", ")
             + (skipped.length>3 ? ", …" : "") + ") — a morning hold-back has to be FEWER courts "
             + "than the day already has.";
      setNotice(msg);
      render(); refreshCounts();
    });
    b.appendChild(go);
    return b;
  }

  // The numerals. Courts Reserved and Mornings are DERIVED and read-only here — their inputs are
  // the capacity-matrix cells and the day detail respectively, so no value gets two homes
  // (WIRE-1's rule). Lit and lights-on ARE inputs: §3.6 requires the full control set per venue,
  // and rule 48 makes both figures a hard placement ceiling.
  // ---- SETUP-3 (Operator, 8/21): THE HEADLINE ROW IS REMOVED ----
  // The band of 44px numerals under each club is gone. What it carried, and where each piece went:
  //
  //   Courts Reserved · Mornings — DELETED OUTRIGHT. Both were DISPLAY of values owned elsewhere
  //     (the capacity matrix; the day detail), which is exactly why they could be deleted with
  //     nothing lost — and exactly why they were the surfaces that drifted out of step in the
  //     first place (8/21 review). Two fewer readers of the same numbers is two fewer things that
  //     can disagree.
  //   The round day tokens — KEPT, on instruction, now on their own row.
  //   Max Courts · Lit · Lights on — KEPT AS CONTROLS, moved into the compact settings line
  //     beside the tokens. ⚠ THESE THREE ARE INPUTS, NOT DISPLAY, and this line is their ONLY
  //     home: deleting it takes `physical_courts` (§3.1, the field BUDGET-1 is waiting on),
  //     `lit_courts` and `lights_on` (rule 48's hard placement ceiling) off the screen with it, and
  //     §3.6 requires the full control set on every venue. They are stated in ordinary type
  //     instead of oversized numerals, which is what "remove the headline row" asks for without
  //     un-building three settable fields.
  function statRow(L, li){
    var row=document.createElement("div"); row.className="statrow";
    row.appendChild(tokenRow(L, li));
    var sp=document.createElement("div"); sp.className="spacer"; row.appendChild(sp);
    row.appendChild(venueSettings(L, li));
    return row;
  }

  function venueSettings(L, li){
    var wrap=document.createElement("div"); wrap.className="vset";

    // §3.1 / §3.7 A2 — Max Courts, "New"-badged. The most courts the club could ever provide,
    // above what is booked. Blank at every club on a fresh console, and blank is a valid answer.
    var mg=document.createElement("span"); mg.className="vsetfield";
    var mlab=document.createElement("label"); mlab.className="caps";
    mlab.appendChild(document.createTextNode("Max Courts "));
    var nb=document.createElement("span"); nb.className="newbadge"; nb.textContent="New";
    mlab.appendChild(nb);
    var mi=document.createElement("input"); mi.type="number"; mi.min="1";
    mi.value=(L.max==null?"":L.max); mi.placeholder="—";
    mi.setAttribute("aria-label","Max courts");
    mi.dataset.locIndex=li; mi.dataset.field="max";
    mi.id = "vmax_"+li;
    mlab.setAttribute("for", mi.id);
    mi.addEventListener("input", function(){ L.max=mi.value; });
    mi.addEventListener("blur", function(){ render(); refreshCounts(); });
    mg.appendChild(mlab); mg.appendChild(mi);
    wrap.appendChild(mg);

    // ---- SLATE-1 item 6 / LIGHTS-1 (2026-08-08) / rule 48 ----
    // BOTH FIELDS ARE SCHEDULED BEHAVIOUR. They were once "emitted for the reporter, read by no
    // engine path" — true when written, false the moment rule 48 shipped. The COUNT is a hard
    // ceiling: after the lights-on time a venue holds no more concurrent matches than it has
    // lighted courts. So they are inputs, and the BLANK hint below is load-bearing: blank still
    // means no ceiling, and a director who leaves it blank has to know that is an ANSWER rather
    // than an omission. (The filled-in hint that once sat beside it — "reference only, not
    // enforced" — was REMOVED on Operator instruction at LIGHTS-1 because it said the opposite of
    // what the tool does; `setup_console_golden` item 10 is inverted to guard its return.)
    // ONE LABEL OVER TWO BOXES WAS THE DEFECT (Operator, 8/21): they read as a single setting,
    // and the reader had no way to tell which number was courts and which was a clock time.
    // Two fields, two names.
    var lg=document.createElement("span"); lg.className="vsetfield";
    var llab=document.createElement("label"); llab.className="caps"; llab.textContent="Lit courts";
    var li1=document.createElement("input"); li1.type="number"; li1.min="1";
    li1.value=(L.lit==null?"":L.lit); li1.placeholder="—";
    li1.setAttribute("aria-label","Lit courts");
    li1.dataset.locIndex=li; li1.dataset.field="lit";
    li1.id = "vlit_"+li;
    llab.setAttribute("for", li1.id);
    li1.addEventListener("input", function(){ L.lit=li1.value; });
    li1.addEventListener("blur", function(){ render(); refreshCounts(); });
    lg.appendChild(llab); lg.appendChild(li1);
    wrap.appendChild(lg);

    var og=document.createElement("span"); og.className="vsetfield";
    var olab=document.createElement("label"); olab.className="caps"; olab.textContent="Lights on";
    // The list starts at the hour play begins, so an hour in the small hours is not on the menu.
    var lo=timeSelect(L.lights_on, {allowBlank:true, notBefore:state.daily_start});
    lo.setAttribute("aria-label","Lights on"); lo.dataset.locIndex=li; lo.dataset.field="lights_on";
    lo.id = "vlon_"+li;
    olab.setAttribute("for", lo.id);
    lo.addEventListener("change", function(){ L.lights_on=lo.value; render(); refreshCounts(); });
    og.appendChild(olab); og.appendChild(lo);
    wrap.appendChild(og);

    // ⚠ THE LIT/LIGHTS HELPER SENTENCE IS DELETED — Operator, 2026-08-24 ("remove the helper text
    // 'how many of this clubs...'"). It was added under the 8/21 ruling and read: "How many of
    // this club's courts have lights, and when they come on. From that hour the club can only run
    // as many matches at once as it has lit courts." — plus a "Both blank = not known. Affects
    // nothing." tail on a club with neither box filled.
    //
    // DELETED IN FULL, ELEMENT AND ALL: nothing writes to `[data-el="litHint"]` at runtime, so
    // unlike `#gate` (SETUP-FOLD N7) the node can go with its text rather than being emptied —
    // verified by search, not assumed. `setup_console_golden` part U's assertion is INVERTED
    // rather than dropped, on the items 5 · 9 · 10 precedent: a deleted check stops grading, and
    // what is being guarded now is that the sentence does not quietly grow back.
    //
    // ⚠ WHAT THE DIRECTOR LOSES, STATED PLAINLY RATHER THAN LEFT IMPLICIT. These two boxes are
    // SCHEDULED BEHAVIOUR, not a note: after the lights-on hour a club runs no more concurrent
    // matches than it has lit courts (rule 48). The screen no longer says so anywhere, and
    // "both blank = not known" no longer tells him blank is an ANSWER rather than an omission.
    // The rule itself is unchanged and still stated on the Locked Rules view.
    return wrap;
  }

  // §6C: one token per tournament day. Red filled = this venue is open, dashed = closed. Clicking
  // a CLOSED token opens the day; clicking an OPEN one expands that day's detail, which is where
  // "close this day" lives — the two halves of the toggle, on one control.
  //
  // The expand path deliberately does NOT re-render: it paints two classes. A full render here
  // would rebuild the panel under a director who has only asked to look at a day, and would
  // invalidate any element a caller is holding.
  function tokenRow(L, li){
    var row=document.createElement("div"); row.className="toks";
    var all=derivedDates();
    // ---- the master bubble (Operator, 2026-08-24) — hide or show EVERY day at this venue ----
    // First in the row, on the brand sun yellow, so it reads as the row's control rather than as
    // an eleventh day. It is the same gesture the day tokens already carry, applied to all of
    // them at once: a ten-day club collapses from ~2,000px to ~340px in one click.
    // ⚠ IT WRITES `DAY_SHUT` AND NOTHING ELSE — no day is opened, closed, or altered. Which days
    // exist at this venue is data; whether their detail is expanded is UI state, and the two must
    // not be confused (the registry lives outside `state` for exactly this reason).
    var mine=all.filter(function(d){ return L.available[d]!==undefined; });
    var anyOpen=mine.some(function(d){ return dayIsOpen(L,li,d); });
    var ma=document.createElement("button"); ma.className="tok tok-all";
    ma.textContent = anyOpen ? "▾" : "▸";
    ma.title = anyOpen ? "Hide every day at this venue" : "Show every day at this venue";
    ma.setAttribute("aria-label", ma.title);
    ma.setAttribute("aria-expanded", anyOpen ? "true" : "false");
    ma.addEventListener("click", function(){
      mine.forEach(function(d){
        if(anyOpen) DAY_SHUT[dayKey(L,li,d)]=true; else delete DAY_SHUT[dayKey(L,li,d)];
      });
      render(); refreshCounts();
    });
    row.appendChild(ma);
    all.forEach(function(d){
      var open = L.available[d] !== undefined;
      var t=document.createElement("button");
      t.className = "tok " + (open ? "tok-on" : "tok-off");
      t.dataset.locIndex=li; t.dataset.date=d;
      t.textContent = d.slice(8).replace(/^0/, "");
      t.setAttribute("aria-label", (open ? "Open" : "Closed") + " at " + (L.id||"this venue") + " on " + d);
      if(open && dayIsOpen(L, li, d)) t.classList.add("tok-open");
      t.addEventListener("click", function(){
        if(L.available[d] === undefined){
          L.available[d] = emptyCell();
          delete DAY_SHUT[dayKey(L, li, d)];
          render(); refreshCounts();
          return;
        }
        var on = !dayIsOpen(L, li, d);
        if(on) delete DAY_SHUT[dayKey(L, li, d)]; else DAY_SHUT[dayKey(L, li, d)] = true;
        t.classList.toggle("tok-open", on);
        var det = root.querySelector('.loc[data-loc-index="'+li+'"] .day[data-date="'+d+'"]');
        if(det) det.classList.toggle("open", on);
      });
      row.appendChild(t);
    });
    return row;
  }

  function splitVenue(L, li){
    var taken={}; state.locations.forEach(function(o){ taken[o.id]=1; });
    var base=(L.id||"VENUE"), cand=base+"-2", n=2;
    while(taken[cand]){ n++; cand=base+"-"+n; }
    // Halve a count, giving the copy the smaller share; "" when it cannot be divided, so the TD
    // is prompted for a number instead of being handed a silent 0.
    function halve(v){
      var x=Number(v);
      if(v==="" || v==null || !isFinite(x) || !Number.isInteger(x) || x<2) return ["", ""];
      var copy=Math.floor(x/2);
      return [String(x-copy), String(copy)];
    }
    var avail={}, indivisible=0;
    Object.keys(L.available).forEach(function(d){
      var c=L.available[d];
      var cs=halve(c.courts), ms=halve(c.mcourts);
      if(cs[1]===""){ indivisible++; }
      else { c.courts=cs[0]; }
      // The morning step-up splits with the day it belongs to; an indivisible morning count drops
      // the row on the copy rather than leaving a half-filled pair.
      if(ms[1]!==""){ c.mcourts=ms[0]; }
      avail[d]={ courts:(cs[1]===""?"":cs[1]), start:c.start, end:c.end,
                 mcourts:(ms[1]===""?"":ms[1]), muntil:(ms[1]===""?"":c.muntil) };
    });
    var ls=halve(L.lit), copyLit=ls[1], copyOn=L.lights_on;
    if(copyLit!==""){ L.lit=ls[0]; } else { copyOn=""; }
    // SETUP-3 §3.1: the ceiling splits with everything else. Two records of ONE physical club
    // must not add up to more courts than the club has — that is the whole reason the split
    // divides the booked counts rather than copying them.
    var ms=halve(L.max), copyMax=ms[1];
    if(copyMax!==""){ L.max=ms[0]; }
    state.locations.splice(li+1, 0,
      {id:cand, name:L.name, available:avail, lit:copyLit, lights_on:copyOn, max:copyMax});
    setNotice("Split " + (L.id||"that venue") + " into two entries — its courts were divided "
      + "between them, so the total is unchanged. Adjust the split by typing new court counts."
      + (indivisible ? " " + indivisible + " day(s) had too few courts to divide: set the new "
          + "entry's court count yourself." : ""));
    render(); refreshCounts();
  }

  function deleteVenue(L, li){
    // VENUE-1 / Decision 1 (Operator, 2026-08-05): stop him at the MOMENT of the edit, not at
    // build time. Removing a venue can leave a tournament day with no courts on it at all, and
    // because the window is derived from the venues' open days that day simply disappears —
    // today that surfaces as a Python traceback he cannot interpret, several steps later.
    var doomed = daysLostWithout(li);
    if(doomed.length){
      var L2 = state.locations[li];
      if(!confirm(
          "Removing " + (L2.id || "this venue") + " leaves "
          + doomed.length + (doomed.length===1 ? " day" : " days")
          + " with no courts open at all:\n\n    " + doomed.join("\n    ")
          + "\n\nThose days drop out of the tournament, which becomes "
          + (derivedDates().length - doomed.length) + " days long instead of "
          + derivedDates().length + ".\n\nIf the tournament really is shorter, that is fine — "
          + "click OK.\nIf it is not, click Cancel and open another venue on "
          + (doomed.length===1 ? "that day" : "those days") + " first."))
        return;
      setNotice("Removed " + (L2.id || "that venue") + " — the tournament is now "
        + (derivedDates().length - doomed.length) + " days long. Open another venue on "
        + doomed.join(", ") + " to get " + (doomed.length===1 ? "that day" : "those days")
        + " back.");
    }
    state.locations.splice(li,1); render(); refreshCounts();
  }

  // ---- SLATE-1 item 1, as re-cut by §6C: the day detail ----
  //   "Morning: N courts until HH:MM"   (present only when the step-up is set)
  //   "Hours: from HH:MM to HH:MM"      + "+ fewer courts first thing"
  // Exactly the R7-3 fields, in English: the morning row IS morning_courts + morning_until, and
  // adding or removing the row is how the step-up is set or cleared. The row controls always set
  // and clear the pair together, so the UI does not produce a half-filled pair — but validate()
  // still checks for one, because a pasted/loaded slate can carry it.
  //
  // ⚠ S-3 §1-A (Operator, 2026-08-24) MOVES THE COURT COUNT BACK INTO THIS BLOCK. §6C had put it
  // in the capacity matrix cell on 8/20; the matrix is now a read-only mirror, so this block
  // holds the value's ONE input. One value, one input — in both directions: the swap must never
  // leave two boxes holding one number, and must never leave zero. Everything the count gates
  // (the step-up button's enabled state, the split's arithmetic) reads `cell.courts`, not a
  // field, so nothing else moves.
  function dayBlock(L, li, d){
    var cell = L.available[d];
    var box = document.createElement("div"); box.className="day";
    box.dataset.date = d;
    if(dayIsOpen(L, li, d)) box.classList.add("open");

    var head = document.createElement("div"); head.className="day-head";
    var inp = document.createElement("input"); inp.type="date"; inp.value=d;
    inp.setAttribute("aria-label", "Date this venue is open");
    inp.dataset.locIndex=li; inp.dataset.date=d; inp.dataset.field="date";
    // Re-keying a day merges onto any day already entered at this venue (item 3), rather than
    // producing two rows for one date. The edited row's values win.
    var commit = function(){
      var nv = inp.value;
      if(nv === d) return;
      // Refuse to blank an existing date: it used to write an undated row, which sailed through
      // every check and made the day disappear from the tournament without a word.
      if(!nv && d){
        setNotice("A day needs a date. Use “close this day” to drop it instead.");
        render(); refreshCounts(); return;
      }
      if(nv && L.available[nv] !== undefined && nv !== d){
        setNotice(nv + " was already open at this venue — the two entries were merged.");
      }
      delete L.available[d];
      L.available[nv] = cell;
      // Re-keying carries the day's collapsed/expanded state onto its new date rather than
      // resetting it — the director re-dated one day, he did not ask to have it re-opened.
      if(DAY_SHUT[dayKey(L, li, d)]) DAY_SHUT[dayKey(L, li, nv)] = true;
      delete DAY_SHUT[dayKey(L, li, d)];
      render(); refreshCounts();
    };
    inp.addEventListener("change", commit);
    inp.addEventListener("blur", commit);
    head.appendChild(inp);
    var rm = document.createElement("button"); rm.className="btn-link grow"; rm.textContent="close this day";
    rm.title = "This venue isn't available this day";
    rm.addEventListener("click", function(){
      delete L.available[d];
      delete DAY_SHUT[dayKey(L, li, d)];
      render(); refreshCounts();
    });
    head.appendChild(rm);
    box.appendChild(head);

    var hasMorning = (cell.mcourts!=null && cell.mcourts!=="") || !!cell.muntil;

    // ---- THE DAY'S OWN COURT COUNT, AND ITS ONE INPUT ----
    // The 8/21 review caught this block listing a figure labelled "courts" that was the MORNING
    // hold-back (9), sitting under a grid cell reading the day's actual count (24) — two boxes,
    // one word, two different numbers for one day. §6C answered it by moving the count's one
    // input INTO the capacity matrix and leaving a read-only figure here.
    //
    // ⚠ S-3 §1-A (Operator, 2026-08-24) REVERSES THAT HALF: "the courts by day table ... must not
    // be editable". The input comes back here and the matrix mirrors it. One value, one input, in
    // both directions — so the read-only figure and its "change it in Courts by day, below" tail
    // are DELETED with the matrix input they pointed at, not left beside a second box.
    //
    // The label is `all day`, never bare `courts`: it pairs with `morning courts` one line below,
    // and those two are DIFFERENT numbers that must not share a word (part T case 4).
    var crow=document.createElement("div"); crow.className="caprow courts";
    var clead=document.createElement("span"); clead.className="lead"; clead.textContent="Courts";
    crow.appendChild(clead);
    var cfield=cellField("all day","number",cell.courts,function(v){
      cell.courts=v;
      // ⚠ NEVER render() HERE. This is the `input` event: a full re-render mid-typing steals
      // focus (the warnings at the wrap-up box and at `divisionChips`, and S-2's `added` echo,
      // are all the same lesson). §1-A.3's live mirror repaints THREE NODES and nothing else.
      paintCourtMirror(li, d);
      refreshCounts();
    },{li:li,date:d,field:"courts"});
    var cinp=cfield.querySelector("input");
    if(cinp){
      cinp.setAttribute("data-el","dayCourts");
      cinp.setAttribute("aria-label","Courts at "+(L.id||"this venue")+" on "+d);
      // On COMMIT the panel re-renders, because the step-up button's disabled state and the
      // derived figures below were decided at the last render and go stale otherwise. This is
      // the shape the matrix cell used to carry, moved with the input.
      var ccommit=function(){ render(); refreshCounts(); };
      cinp.addEventListener("change", ccommit);
      cinp.addEventListener("blur", ccommit);
    }
    crow.appendChild(cfield);
    box.appendChild(crow);

    if(hasMorning){
      var mrow=document.createElement("div"); mrow.className="caprow morning";
      var ml=document.createElement("span"); ml.className="lead"; ml.textContent="Morning";
      mrow.appendChild(ml);
      // Labelled `morning courts`, never `courts`: this is a DIFFERENT number from the day's, and
      // the two used to wear the same word one line apart.
      mrow.appendChild(cellField("morning courts","number",cell.mcourts,function(v){ cell.mcourts=v; },
        {li:li,date:d,field:"mcourts"}));
      var mu=document.createElement("span"); mu.className="tail"; mu.textContent="until";
      mrow.appendChild(mu);
      mrow.appendChild(cellField("switches at","time",cell.muntil,function(v){ cell.muntil=v; },
        {li:li,date:d,field:"muntil"}));
      var drop=document.createElement("button"); drop.className="btn-link"; drop.textContent="same all day";
      drop.title="Drop the morning row — one court count for the whole day";
      drop.addEventListener("click", function(){
        cell.mcourts=""; cell.muntil=""; render(); refreshCounts();
      });
      mrow.appendChild(drop);
      box.appendChild(mrow);
    }

    var row=document.createElement("div"); row.className="caprow";
    var lead=document.createElement("span"); lead.className="lead";
    // ALWAYS "Hours", never "Rest of day" (Operator review, 8/21). These two times are the whole
    // day's opening window — the morning step-up happens INSIDE them — so labelling the row "Rest
    // of day" whenever a step-up existed said the window started at the switch time. It does not.
    lead.textContent = "Hours";
    row.appendChild(lead);
    var from=document.createElement("span"); from.className="tail"; from.textContent="from";
    row.appendChild(from);
    row.appendChild(cellField("opens","time",cell.start,function(v){ cell.start=v; },
      {li:li,date:d,field:"start"}));
    var to=document.createElement("span"); to.className="tail"; to.textContent="to";
    row.appendChild(to);
    row.appendChild(cellField("closes","time",cell.end,function(v){ cell.end=v; },
      {li:li,date:d,field:"end"}));
    if(!hasMorning){
      // Two defects fixed here (2026-07-30 review):
      //  · it seeded the morning count from `cell.courts` unguarded, so on a day with no court
      //    count it set only the switch time — producing exactly the half-filled pair this rework
      //    claims is unreachable. The button is disabled until the day has a valid court count.
      //  · it seeded the morning count to the day's FULL count, so "fewer courts" reduced nothing
      //    and validated clean. It seeds to half (rounded down, min 1) — genuinely fewer.
      var n = Number(cell.courts);
      var canStep = cell.courts !== "" && cell.courts != null && isFinite(n)
                    && Number.isInteger(n) && n >= 2;
      var addM=document.createElement("button"); addM.className="btn-link";
      addM.textContent="+ fewer courts first thing";
      if(!canStep){
        addM.disabled = true;
        addM.title = (cell.courts === "" || cell.courts == null)
          ? "Set this day's court count first"
          : "Needs at least 2 courts to hold back some of them";
      } else {
        addM.title="Hold back some courts until later in the morning";
        addM.addEventListener("click", function(){
          // Re-read at click time rather than trusting the value this row was rendered with: the
          // count can have been cleared since, and a stale read is how a half-filled pair got made.
          var live = Number(cell.courts);
          if(cell.courts === "" || cell.courts == null || !isFinite(live)
             || !Number.isInteger(live) || live < 2){
            setNotice("Set this day's court count first — then some of them can be held back.");
            render(); refreshCounts(); return;
          }
          cell.mcourts = String(Math.max(1, Math.floor(live/2)));
          cell.muntil = "11:00";
          render(); refreshCounts();
        });
      }
      addM.setAttribute("data-el","stepUp");
      crow.appendChild(addM);          // it holds back COURTS — it belongs on the courts row
    }
    box.appendChild(row);
    if(!cell.start && !cell.end){
      var inh=document.createElement("p"); inh.className="hint";
      inh.style.margin="4px 2px 0";
      inh.textContent = "Hours blank — this day uses the tournament window ("
        + state.daily_start + " onward).";
      box.appendChild(inh);
    }
    return box;
  }
  function cellField(labelText, type, value, onInput, meta){
    var w=document.createElement("span"); w.className="cell-field";
    var lab=document.createElement("label"); lab.textContent=labelText;
    var inp;
    if(type==="time"){
      inp=timeSelect(value, {allowBlank:true});
      inp.addEventListener("change", function(){ onInput(inp.value); });
    } else {
      inp=document.createElement("input"); inp.type=type; inp.value=(value==null?"":value);
      if(type==="number") inp.min="1";
      inp.addEventListener("input", function(){ onInput(inp.value); });
    }
    if(meta){ inp.dataset.locIndex=meta.li; inp.dataset.date=meta.date; inp.dataset.field=meta.field; }
    w.appendChild(lab); w.appendChild(inp);
    return w;
  }

  // ---- the courts-by-day capacity matrix (Concept A) ----
  // Venue rows x day columns.
  //
  // ⚠ S-3 §1-A (Operator, 2026-08-24), REVERSING §6C: THE CELLS ARE READ-ONLY FIGURES — "it is a
  // visual representation of the venue information entered in the panes above. It must not be
  // editable and it must update in real time as the TD enters court information." The R7-3
  // `courts` value's one input lives in the day detail again; every figure here is derived from
  // it, in the shape the Total row already used.
  //
  // The `data-loc-index` / `data-date` hooks moved from the deleted input onto the figure cell
  // itself, because `paintCourtMirror` addresses them. `data-field` did NOT move with them:
  // `revealRefusedFields` uses `[data-loc-index][data-field][data-date]` to find the control a
  // refusal names, and that has to resolve to the input, not to a figure of it.
  //
  // A dashed cell is a day that venue is closed on; clicking it opens the day at that venue.
  var TINTS = ["var(--w-cell-1)", "var(--w-cell-2)", "var(--w-cell-3)"];
  var WD = ["S","M","T","W","T","F","S"];
  function weekdayLetter(iso){
    var t = new Date(iso+"T00:00:00Z");
    return isNaN(t.getTime()) ? "" : WD[t.getUTCDay()];
  }
  // ---- S-3 §1-A.3 — THE LIVE MIRROR, AND IT IS THREE NODES, NEVER A render() ----
  // Measured before this build: the count wrote state on `input` but only `refreshCounts()` ran,
  // which refreshes the masthead and the status line and repaints neither the Total row nor the
  // figure. A full `render()` ran on `change`/`blur`. So editing a day from 24 to 30 left the
  // Total row and the day detail both reading 24 until the field was left — "the numbers he is
  // reading go stale the moment he starts typing and catch up only when he leaves the field."
  //
  // The fix is NOT to render on `input`. That steals focus mid-typing, which is the defect the
  // wrap-up box and `divisionChips` both carry warnings about and the one S-2's `added` echo
  // solved by repainting a single node off the `input` event it already had. This repaints the
  // AFFECTED CELL, ITS COLUMN TOTAL AND THE PEAK SENTENCE, and nothing else.
  function cellFigure(cell){
    return (cell && cell.courts !== "" && cell.courts != null) ? String(cell.courts) : "—";
  }
  function columnTotal(d){
    var t=0;
    state.locations.forEach(function(L){
      var c=L.available[d]; if(!c) return;
      var n=Number(c.courts); if(isFinite(n) && n>0) t+=n;
    });
    return t;
  }
  // The footer's one derived sentence, read by `footerBand` when it builds and by the mirror when
  // it repaints — one derivation, so the two can never state different peaks.
  function capSummaryText(){
    var dates=derivedDates(), nv=state.locations.length, peak=0;
    dates.forEach(function(d){ var t=columnTotal(d); if(t>peak) peak=t; });
    return nv+(nv===1?" club":" clubs")+" · "+dates.length+(dates.length===1?" day":" days")
         + (peak ? " · "+peak+" courts at the widest point." : ".");
  }
  // ⚠ SCOPED TO THE PANEL ROOT, NOT TO THE FORM. The grid moved into the sticky pin at the S-3
  // review, which is a SIBLING of `[data-el="form"]`; the peak sentence is still inside the form.
  // Searching the form alone would silently stop repainting the two grid nodes — the live mirror
  // would look built and do nothing.
  function paintCourtMirror(li, d){
    if(!state || !root) return;
    var L=state.locations[li]; if(!L) return;
    var fig=root.querySelector('[data-el="matCell"][data-loc-index="'+li+'"][data-date="'+d+'"]');
    if(fig) fig.textContent = cellFigure(L.available[d]);
    var tot=root.querySelector('[data-el="matTotal"][data-date="'+d+'"]');
    if(tot){ var t=columnTotal(d); tot.textContent = t ? String(t) : "—"; }
    var sum=root.querySelector('[data-el="capSum"]');
    if(sum) sum.textContent = capSummaryText();
  }

  // ---- the pinned grid's fold (Operator, 2026-08-24) ----
  // ⚠ DEFAULT COLLAPSED, and that is the ruling, not a preference: "add a caret and default to
  // collapsed on open". Folded, the grid keeps the day headings and the Total row and drops the
  // per-club rows — 173px against 309px, driven, which with the smaller masthead takes the fixed
  // band from 557px to 321px and gives an 800px laptop ~479px of workable page against ~243px.
  //
  // The state is a MODULE REGISTRY, exactly like `DAY_SHUT` and `CITY_OPEN` and for the file's
  // own stated reason: this panel rebuilds itself from scratch on ~20 edit paths, so anything
  // held only in a class is wiped mid-edit. It therefore survives every re-render and every tab
  // switch within a session, and a fresh page load opens folded again — which IS the ruled
  // default, not a lapse.
  //
  // ⚠ IT LIVES OUTSIDE `state`, like the other two, so an Undo cannot fold or unfold his grid.
  var CAP_FOLDED = true;
  function paintFold(){
    var pin = el("slatepin"); if(!pin) return;
    pin.classList.toggle("folded", CAP_FOLDED);
    var c = pin.querySelector(".capcaret");
    if(!c) return;
    // ▸ closed / ▾ open. The two glyphs already ship on this console as the venue rank arrows.
    c.textContent = CAP_FOLDED ? "▸" : "▾";
    c.setAttribute("aria-expanded", CAP_FOLDED ? "false" : "true");
    c.title = CAP_FOLDED ? "Show every club" : "Show the day totals only";
    c.setAttribute("aria-label", c.title);
  }
  function matrixSection(){
    var sec=document.createElement("div"); sec.className="matsec";
    var head=document.createElement("div"); head.className="mathead";
    var t=document.createElement("span"); t.className="htitle";
    var caret=document.createElement("button"); caret.type="button"; caret.className="capcaret";
    caret.addEventListener("click", function(){ CAP_FOLDED = !CAP_FOLDED; paintFold(); });
    t.appendChild(caret);
    t.appendChild(document.createTextNode("Courts by day"));
    head.appendChild(t);
    var c=document.createElement("span"); c.className="caps";
    c.textContent="Reserved capacity · every open instant";
    head.appendChild(c);
    sec.appendChild(head);

    var dates=derivedDates();
    if(!dates.length || !state.locations.length){
      var em=document.createElement("p"); em.className="hint";
      em.textContent="Open a day at a venue and the capacity by day appears here.";
      sec.appendChild(em);
      return sec;
    }
    var scroll=document.createElement("div"); scroll.className="matwrap";
    var g=document.createElement("div"); g.className="matrix";
    g.style.gridTemplateColumns = "80px repeat("+dates.length+", minmax(52px,1fr))";
    g.appendChild(document.createElement("span"));
    dates.forEach(function(d){
      var h=document.createElement("span"); h.className="colhead";
      h.textContent = weekdayLetter(d)+" "+d.slice(8).replace(/^0/, "");
      g.appendChild(h);
    });
    var totals={};
    state.locations.forEach(function(L, li){
      var lab=document.createElement("span");
      lab.className="rowlab"+(li===0?" rank1":"");
      lab.textContent = L.id || ("Venue "+(li+1));
      g.appendChild(lab);
      dates.forEach(function(d){
        var cell=L.available[d];
        if(cell === undefined){
          var shut=document.createElement("button"); shut.className="mcell shut"; shut.textContent="—";
          shut.setAttribute("aria-label","Open "+(L.id||"this venue")+" on "+d);
          shut.addEventListener("click", function(){
            L.available[d]=emptyCell(); render(); refreshCounts();
          });
          g.appendChild(shut);
          return;
        }
        var n=Number(cell.courts);
        if(isFinite(n) && n>0) totals[d]=(totals[d]||0)+n;
        var box=document.createElement("div"); box.className="mcell";
        box.style.background = TINTS[Math.min(li, TINTS.length-1)];
        box.setAttribute("data-el","matCell");
        box.dataset.locIndex=li; box.dataset.date=d;
        box.textContent = cellFigure(cell);
        g.appendChild(box);
      });
    });
    var tl=document.createElement("span"); tl.className="rowlab total"; tl.textContent="Total";
    g.appendChild(tl);
    dates.forEach(function(d){

      g.appendChild(tc);
    });
    scroll.appendChild(g);
    sec.appendChild(scroll);
    return sec;
  }

  // ---- the footer band: the summary sentence + the travel pairs (§6C) ----

  // LANG-1 item 4 pins "Travel between venues" as a rendered label and it stays the ruled name —

  // of drift LANG-1 exists to stop.
  function footerBand(){

    // carries a stable hook and reads its text from the one derivation `paintCourtMirror` uses.

    // validated here and still emitted inside the slate block as `transit_minutes`, so
    // `td-resource-slate/v1` does not move and a saved setup round-trips exactly as before. The
    // Rules tab reaches it through `transitPairs` / `setTransit` below — the same one-home
    // discipline the masthead's tournament name already follows (WIRE-1).
    return band;

  // ---- S-3 review: the travel pairs, read and written from the Rules tab ----
  // The pair list is DERIVED from the venue codes on this tab, so it cannot drift from the venues
  // it describes. `value` is a STRING so the Rules tab can put it straight in an input.
  //
  // ⚠ DEFAULT 0 (Operator, 2026-08-24): "Set travel times to default 0 for all." An unset pair
  // reads 0 rather than blank, so the screen states the answer instead of leaving it to silence.
  // MEASURED before the change, on the director's own approved 2026 field: zeroing every travel
  // time leaves the schedule BYTE-IDENTICAL — 760/275/0/0, same (event, day, start, venue, id) for
  // all 760 rows. The 3-hour start-to-start rest already forces bigger gaps than any drive: 20 of
  // 1,041 player-days span two venues at all, and the TIGHTEST cross-venue gap actually used is
  // 90 minutes against a 35-minute longest drive. The rule is not retired — `_humans_ok` still
  // enforces whatever this carries — it simply has nothing to refuse at 0 on this field.
  function transitPairs(){
    if(!state) return [];
    var ids = state.locations.map(function(L){ return L.id; }).filter(function(x){ return x; });
    var seen={}, uids=[];
    ids.forEach(function(x){ if(!seen[x]){ seen[x]=1; uids.push(x); } });
    var out=[];
    for(var i=0;i<uids.length;i++){
      for(var j=i+1;j<uids.length;j++){
        var key=pairKey(uids[i],uids[j]);
        out.push({ key:key, label:key.replace("|"," ⇄ "),
                   value:(state.transit[key]!=null ? String(state.transit[key]) : "0") });
      }
    }
    return out;
  }
  function setTransit(key, v){

    // not a positive number, so a blank and a 0 reach the engine the same way.
    if(v==="") delete state.transit[key]; else state.transit[key]=v;
  }
  // ---- §6F: what this module contributes to "What you set" ----
  // RENDERED FROM LIVE STATE, never hand-maintained: every figure below is read out of `state` at
  // the moment the Review view is reached, so the summary cannot describe a setup the director has
  // since changed. Returns groups of {caps, lines} for the Review renderer to lay out.
  function summaryGroups(){
    var dates = derivedDates(), out = [];
    out.push({ caps:"Playing day", lines:[
      "Starts <b>" + esc(state.daily_start) + "</b> · last match ends by <b>"
      + esc(state.daily_end) + "</b> · <b>" + esc(String(state.eod_buffer))
      + "-minute</b> wrap-up — latest start <b>" + esc(latestStartLabel(plannedBlock())) + "</b>."
    ]});
    var vlines = state.locations.map(function(L, li){
      var bits = [];
      // THE SAME derivation the stat row reads (8/21 review fix) — this line used to compute its
      // own `Math.max`, so the review screen could disagree with the ledger it summarises.
      var cs = courtsSummary(L);
      if(cs.text){
        bits.push(L.max !== "" && L.max != null
          ? cs.text + " reserved of " + esc(String(L.max)) + " max"
          : cs.text + " reserved");
      }
      if(L.lit !== "" && L.lit != null && L.lights_on)
        bits.push(esc(String(L.lit)) + " lit at " + esc(L.lights_on));
      var mo = morningSummary(L);
      if(mo.text) bits.push(mo.uniform ? (mo.text + " courts " + esc(mo.qual))
                                       : "a morning step-up that varies by day");
      var open = Object.keys(L.available).filter(function(d){ return d; }).length;
      bits.push(open === dates.length && dates.length
        ? "all " + dates.length + " days"
        : open + " of " + dates.length + " days");
      return "<b>" + esc(L.name || L.id || ("Venue " + (li+1))) + "</b>"
           + (li === 0 ? " (main site)" : "") + " — " + bits.join(" · ") + ".";
    });
    out.push({ caps:"Venues · " + state.locations.length,
               lines: vlines.length ? vlines : ["No venues yet — add at least one."] });
    var pairs = Object.keys(state.transit).filter(function(k){ return state.transit[k] !== ""; });
    if(pairs.length){
      out.push({ caps:"Travel between venues", lines:[
        pairs.sort().map(function(k){
          return esc(k.replace("|", " ⇄ ")) + " <b>" + esc(String(state.transit[k])) + " min</b>";
        }).join(" · ") + "."
      ]});
    }
    return out;
  }

  function refreshCounts(){
    // SETUP-3 §3.4-8: the grey counts line is gone with every other sub-heading. Its numbers were
    // never lost — the days and venues are stated on the Venues header and the derived latest
    // start is a full sentence in the playing-day band (§6C).
    refreshMasthead();
    refreshStatus();
