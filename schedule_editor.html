  //
  // SWAP-1: `skipId` is the optional swap-partner exclusion (see `wouldOverCap`) — additive,
  // default `undefined`, existing call sites unchanged.
  function conflictsAt(m, start, day, skipId){
    var out=[], s=hhmm2min(start), e=s+(m.duration||DEF_DUR);
    st.matches.forEach(function(x){
      if(x.id===m.id || x.id===skipId || x.day!==day) return;
      var shared=m.players.filter(function(p){ return isReal(p) && x.players.indexOf(p)>-1; });
      if(!shared.length) return;
      var xs=hhmm2min(x.start), cross=x.div!==m.div;
      if(overlap(s,e,xs,endMin(x))) out.push({kind:"dbl", who:shared.join(", "), other:x, cross:cross});
      else if(Math.abs(xs-s)<MIN_S2S) out.push({kind:"rest", who:shared.join(", "), other:x, cross:cross});
    });
    return out;
  }
  // conflicts for m at its current slot (against ALL divisions, same day): returns list of badges
  function conflictsFor(m){ return conflictsAt(m, m.start, m.day); }

  // ---- CUI-3 (OI-37 a6-i): the two rules the advisories have been blind to ----------------
  // Both are already couriered and already enforced by the engine; the console simply could not
  // see them. Neither is a NEW rule, so there is nothing for `validate_multi` to mirror.
  //
  // The venue's own window for a day. `hours_by_day` has been emitted by `editor_plan._resources`
  // since the projection shipped and read by nothing; BOTH emit branches carry it (the per-location
  // layout and the single-pool "All courts" fallback), so a one-location run keeps its hours.
  // No window -> the global day, which is what every guard used before this build.
  function hoursOf(loc, day){
    for(var i=0;i<COLS.length;i++){ if(COLS[i].id===loc){
      var w=(COLS[i].hours||{})[day];
      if(w && w.length===2){
        var o=hhmm2min(w[0]), c=hhmm2min(w[1]);
        if(o!=null && c!=null) return [o,c];
      }
    } }
    return [DAY_START, DAY_END];
  }
  // The division's resolved earliest start, READ from the plan — never re-derived from the age in
  // the division name. A second copy of that mapping in JavaScript is the mirror hazard, and the
  // engine already resolved it (`constraints.py:288-295` -> `ev.earliest_start`).
  // RR divisions run as "<parent> — Group N"; keyed-by-division-name always needs that fallback.
  function floorOf(div){
    var f=FLOORS[div];
    if(f==null) f=FLOORS[String(div||"").replace(/\s+[—-]\s*Group\s*\d+\s*$/,"").trim()];
    return f!=null ? hhmm2min(f) : null;
  }
  // ---- SWAP-1 · feeder (round) lineage, derived client-side from the id alone ---------------
  // The engine builds an elimination tree by pure id arithmetic: round r's match m is fed by
  // round r-1's matches 2m-1 and 2m (`scheduler_multi.py:189-190`, `:263-264` — the mid is
  // `{prefix}-R{r}-M{m+1}` over 0-based `m`, so in printed 1-based terms M{k} is fed by M{2k-1}
  // and M{2k}). Running the SAME arithmetic here is what makes the console's test the ENGINE's
  // test rather than a second rule that can drift from it (ruling 85 decision 2).
  //
  // ROUND-ROBIN IS EXCLUDED BY CONSTRUCTION, and that is the point of doing it this way: an RR
  // id is `{prefix}-M{i}-{a}v{b}` (`:306`) and carries no `-R` segment at all, so it never
  // matches here. RR "round" numbers are pairing indices, not lineage — the engine's own output
  // runs them out of clock order — and a check that read them would flag the tool's own legal
  // work.
  var ELIM_ID=/^(.+)-R(\d+)-M(\d+)$/;
  function feedersOf(id){
    var g=ELIM_ID.exec(String(id||"")); if(!g) return [];
    var r=+g[2], k=+g[3];
    if(r<2) return [];                                   // round 1 is fed by the draw, not by a match
    return [g[1]+"-R"+(r-1)+"-M"+(2*k-1), g[1]+"-R"+(r-1)+"-M"+(2*k)];
  }
  function dependentOf(id){
    var g=ELIM_ID.exec(String(id||"")); if(!g) return null;
    return g[1]+"-R"+((+g[2])+1)+"-M"+Math.ceil((+g[3])/2);
  }
  function placedById(id, skipId){
    if(!id || id===skipId) return null;
    return st.matches.filter(function(x){ return x.id===id && x.location && x.start; })[0] || null;
  }
  // THE reusable slot guard. Everything that refuses a slot for a reason other than a player
  // clash or a full court lives here, so the drop guards and SLOT-SUGGEST all ask exactly one
  // question and can never disagree. Empty array = nothing here refuses it.
  //
  // DRAW-1 (OI-37 a6-ii): transit and the per-division daily cap join the chain as two more
  // kinds — carrying `soft:true`, the severity that keeps the Hybrid ruling intact. `hours` and
  // `early` are engine-ENFORCED and stay hard blocks in moveMatch/placeUnplaced; the two soft
  // kinds warn there and never block. cleanSlots keeps the FULL chain (a slot that would warn is
  // not offered), so every guard added here is a guard SLOT-SUGGEST — and SWAP-1's sweep after
  // it — runs automatically.
  //
  // SWAP-1 (ruling 85 decisions 2 + 3): `feeder` joins the chain and carries NO `soft:true` — it
  // is a HARD kind, in the engine-enforced class with `hours` and `early`. The engine refuses to
  // BUILD a board that breaks it (`_feeders_done`, `scheduler_multi.py:914`) and `validate_multi`
  // reports the breach as `DEPENDENCY` (`:1780-1786`), so a drag that breaks it produces a
  // schedule the courier round-trip bounces — the director should meet that refusal at his
  // fingertip, not at the end of the lane. A held feeder lifts the rule (it is no longer placed),
  // which is the always-available legal path through.
  //
  // `skipId` is SWAP-1's partner exclusion, applied to every kind alike (see `wouldOverCap`):
  // "excluded from the board" means excluded from all of them, uniformly.
  function slotBlocks(m, loc, start, day, skipId){
    var out=[], s=hhmm2min(start), e=s+(m.duration||DEF_DUR), h=hoursOf(loc, day);
    if(s<h[0] || e>h[1])
      out.push({kind:"hours", note:loc+" is open "+min2hhmm(h[0])+"–"+min2hhmm(h[1])+" on "+day});
    var fl=floorOf(m.div);
    if(fl!=null && s<fl)
      out.push({kind:"early", note:m.div+" cannot start before "+min2hhmm(fl)});
    // transit (soft): a shared player's consecutive matches at DIFFERENT venues must clear the
    // trip end-to-start — the same test the engine enforces (_humans_ok) and mirrors
    // (validate_multi's TRANSIT line). `pair` keys the symmetric duplicate for dedup.
    st.matches.forEach(function(x){
      if(x.id===m.id || x.id===skipId || x.day!==day || !x.location || !x.start || x.location===loc) return;
      var shared=(m.players||[]).filter(function(p){ return isReal(p) && x.players.indexOf(p)>-1; });
      if(!shared.length) return;
      var tmin=TRANSIT[[loc,x.location].sort().join("|")]||0;
      if(!tmin) return;
      var xs=hhmm2min(x.start), xe=endMin(x);
      if(!(e+tmin<=xs || xe+tmin<=s))
        out.push({kind:"transit", soft:true, pair:[m.id,x.id].sort().join("|"),
                  note:shared.join(", ")+" cannot clear the "+tmin+"m trip between "+
                       x.location+" and "+loc+" ("+x.id+" at "+x.start+")"});
    });
    // daily cap (soft): more matches in one division on one day than the division's per-player
    // cap. Keyed by division with the RR "<parent> — Group N" fallback FLOORS already needs.
    var cap=DAILY_CAPS[m.div];
    if(cap==null) cap=DAILY_CAPS[String(m.div||"").replace(/\s+[—-]\s*Group\s*\d+\s*$/,"").trim()];
    if(cap!=null){
      (m.players||[]).filter(isReal).forEach(function(p){
        var n=1+st.matches.filter(function(x){ return x.id!==m.id && x.id!==skipId && x.div===m.div &&
          x.day===day && (x.players||[]).indexOf(p)>-1; }).length;
        if(n>cap)
          out.push({kind:"dailycap", soft:true, pair:m.div+"|"+p+"|"+day,
                    note:p+" would have "+n+" "+m.div+" matches on "+day+" (cap "+cap+")"});
      });
    }
    // SWAP-1 · feeder (round) ordering — HARD. The relation is `dependent.start < feeder.end`,
    // which is exactly `validate_multi`'s DEPENDENCY grading; it is read from BOTH ends of the
    // edge because this function is asked about ONE card at a time and either end can be the card
    // that moves. Dropping a semifinal ahead of its quarterfinal and dragging that quarterfinal
    // out past its semifinal are the same broken edge, and the pair sweep's "never offers a
    // breach" property needs whichever end moves to be the end that is checked.
    //
    // Same day only: the console edits within a day and `start` carries no date, so a cross-day
    // edge is not this surface's question. PLACED feeders only, mirroring `:1782` — a HELD feeder
    // is silent there and silent here, and an id that is not on the board at all is a bye
    // walkover, which `_feeders_done` treats as done the moment it exists (`:1650-1652`).
    // `pair` keys the edge symmetrically — SAME key from either end — so the two readings of
    // one broken edge dedup to one line on the Issues panel, the way transit and the daily cap
    // already do.
    feedersOf(m.id).forEach(function(fid){
      var f=placedById(fid, skipId);
      if(!f || f.day!==day) return;
      if(endMin(f) > s)
        out.push({kind:"feeder", pair:fid+"|"+m.id,
                  note:m.id+" cannot start before "+fid+" ends at "+min2hhmm(endMin(f))});
    });
    var dep=placedById(dependentOf(m.id), skipId);
    if(dep && dep.day===day && hhmm2min(dep.start) < e)
      out.push({kind:"feeder", pair:m.id+"|"+dep.id,
                note:dep.id+" cannot start before "+m.id+" ends at "+min2hhmm(e)});
    return out;
  }
  // ---- CONSOLE-2 · the day-order PREVIEW (8/8 item 5, ruled: warn at the drop, with the count)
  //
  // ⚠ THIS IS NOT A GUARD. It is deliberately NOT a `slotBlocks` kind and NOT a `conflictsAt`
  // kind: it cannot block a move, cannot excuse one, and nothing downstream reads it. It counts,
  // and the count is displayed. That is the whole of its authority.
  //
  // THE MIRROR HAZARD, and where the line is drawn. The rule's one authoritative copy stays
  // `scheduler_multi.day_shape_violations` — the engine remains the grader, the pre-publication
  // report reproduces the engine's record verbatim, and `tests/console2_batch.py` part B pins
  // this preview's number against BOTH on the same one-move fixture. `floorOf`'s comment refuses
  // a second copy of a mapping that DECIDES; a preview that COUNTS is display, and the identity
  // assertion is what stops it drifting into a second opinion.
  //
  // Why the count and not a verdict (the ruling's own reason): "this puts 25 other matches out
  // of the day's order" is a decision the TD can make; "this breaks the day's order" is noise he
  // will learn to click through. And the bystander effect is the reason he cannot see it for
  // himself — moving one mixed match late makes every earlier gender-doubles match on that day
  // retroactively out of shape, and 100% of them are matches he never touched.
  //
  // The day's kinds, mirroring `scheduler_multi._event_kind` (itself a mirror of
  // `master_schedule._etype`). The RR "— Group N" suffix cannot change the answer, which is why
  // the group divisions need no unwrapping here.
  function dayKind(div){
    var s=String(div||"").toLowerCase();
    if(s.indexOf("mixed")>-1) return "mixed";
    if(s.indexOf("doubles")>-1) return "doubles";
    return "singles";
  }
  // One day's out-of-shape set, from rows of {id, div, start}. A LINE-FOR-LINE mirror of
  // `day_shape_violations` for a single day (days are independent there, so one day is the whole
  // computation): out of shape == a later-kind match starting before an earlier-kind match of
  // that same day starts, measured against the LATEST start of each earlier kind. NEAR-1 A1: a
  // spill sets no precedent in either direction — excluded from the windows and judged
  // symmetrically against the clean ones.
  function dayShapeOut(rows){
    var latest={}, earliest={}, out={};
    rows.forEach(function(r){
      var k=DAY_ORDER[dayKind(r.div)]; if(k==null) return;
      if(DS_NOPREC[r.id]) return;
      if(latest[k]==null || r.start>latest[k]) latest[k]=r.start;
      if(earliest[k]==null || r.start<earliest[k]) earliest[k]=r.start;
    });
    rows.forEach(function(r){
      var k=DAY_ORDER[dayKind(r.div)]; if(k==null) return;
      var hit=false;
      Object.keys(latest).forEach(function(er){ if((+er)<k && r.start<latest[er]) hit=true; });
      if(!hit && DS_NOPREC[r.id])
        Object.keys(earliest).forEach(function(lr){ if((+lr)>k && earliest[lr]<r.start) hit=true; });
      if(hit) out[r.id]=1;
    });
    return out;
  }
  // EVAL-1: "ahead of that day's singles and mixed" — the clause LANG-1 ruled in place of the
  // banned "before an earlier-kind match of that day is under way".
  //
  // A LINE-FOR-LINE mirror of `scheduler_multi._c_earlier_kinds`, which is what makes the badge,
  // the Issues row and the engine's own conflict sentence the SAME sentence about the same match
  // (`tests/eval1_preview.py` part B asserts this clause INSIDE the engine's own sentence for
  // the same match, on every one of them). Like the engine's, it names
  // every kind the day runs EARLIER in the ruled order — not only the ones this match happens to
  // have overtaken — because the rule is about the day's order, not about one race.
  function aheadPhrase(div){
    var rank=DAY_ORDER[dayKind(div)];
    var earlier=(rank==null) ? [] : Object.keys(DAY_ORDER)
      .filter(function(k){ return DAY_ORDER[k]<rank; })
      .sort(function(a,b){ return DAY_ORDER[a]-DAY_ORDER[b]; });
    if(!earlier.length) return "ahead of that day's earlier matches";
    var last=earlier.pop();
    return "ahead of that day's "+(earlier.length ? earlier.join(", ")+" and "+last : last);
  }
  // How many OTHER matches this drop puts out of the day's running order. "Other" is the ruling's
  // word and it is load-bearing: the card being moved is excluded, because the TD knows he moved
  // it — the number he cannot see is the bystanders'.
  //
  // A match already out of shape before the drop is not counted again, and a match carrying the
  // engine's own RECORDED escape is excused exactly as the engine's mirror excuses it (keyed on
  // id · day · start, `validate_multi`'s `_slot`) — otherwise the preview would announce the
  // engine's legal fallbacks as if the TD had caused them.
  // EVAL-1 (the keystone) — the same delta, NAMED. `others` is the bystander set the shipped
  // count counted; `self` is the moved card's OWN would-be break, which nothing said before.
  //
  // §0.2 step 3 is why `self` exists: on 8/15 the TD placed E32 back at 11:00, that gesture made
  // his own card the 8th break in the engine's record, and the bar was empty — because "other" is
  // the ruled word for the bystander count and this fact is a different fact. Both are read the
  // same way, `after && !before`: a match already out of shape before the gesture is not this
  // gesture's consequence, in either half.
  function dayShapePreview(m, start, day){
    if(!Object.keys(DAY_ORDER).length) return {others:[], self:null};
    var others=[];
    st.matches.forEach(function(x){
      if(x.id===m.id || x.day!==day || !x.start) return;
      others.push({id:x.id, div:x.div, start:x.start});
    });
    var onBoard=st.matches.some(function(x){ return x.id===m.id; });
    var here=(onBoard && m.day===day && m.start) ? [{id:m.id, div:m.div, start:m.start}] : [];
    var before=dayShapeOut(others.concat(here)),
        after =dayShapeOut(others.concat([{id:m.id, div:m.div, start:start}]));
    var hit=[];
    others.forEach(function(r){
      if(after[r.id] && !before[r.id] && !DS_EXC[r.id+"|"+day+"|"+r.start])
        hit.push({id:r.id, div:r.div, start:r.start});
    });
    var self=!!(after[m.id] && !before[m.id] && !DS_EXC[m.id+"|"+day+"|"+start]);
    return {others:hit, self:self};
  }
  // How many OTHER matches this drop puts out of the day's running order — the shipped number,
  // now read off the named set so the count and the list can never disagree.
  function dayShapeCount(m, start, day){
    return dayShapePreview(m, start, day).others.length;
  }
  // The sentence, or "" when the drop changes nothing about the day's order. Fires only on a
  // non-zero consequence — a warning that fires on normal behaviour is worse than none.
  //
  // The count keeps its shipped words and gains a ROUTE: the names live in the Issues panel,
  // which persists, rather than in a bar sentence that would be 8 divisions long and gone one
  // gesture later. The moved card's own break is a second sentence, never folded into the count.
  function dayShapeNote(m, start, day){
    var p=dayShapePreview(m, start, day), n=p.others.length, out="";
    if(n) out = "Day order · this puts "+n+" other match"+(n===1?"":"es")+
                " out of the day's running order on "+fmtDay(day)+". See which in Issues.";
    // "This" and not "This move": the same sentence has to be true on the dock's Place path,
    // where nothing has moved — a card is coming back onto the board.
    if(p.self) out += (out?" ":"")+"This also puts this match "+aheadPhrase(m.div)+".";
    return out;
  }
  // ---- EVAL-1 · PERSISTENCE (absorbing the CONSOLE-2 board-badge / check-count OPEN half) ----
  //
  // §0.3, measured on the committed console: with 8 day-order breaks live on the board, the bar
  // was cleared by the next gesture, the counter strip read `Conflicts 0`, a badge sweep of the
  // two most-broken divisions found 0 marked cards, and the Issues panel read "Nothing clashing
  // here. ✓". The tool said "7 other matches" once, transiently, and every surface that persists
  // said clean. These three surfaces are that half.
  //
  // ONE client record, read by all three (and by the bar above): the day's out-of-shape set with
  // the ENGINE'S OWN recorded escapes excused, exactly as the preview excuses them — otherwise
  // the board would badge the 38 matches the engine itself had to place out of order and the
  // count would open at 38 on an untouched board.
  //
  // Memoised PER RENDER and cleared at the top of `render()`: the badge renderer asks once per
  // card and `warnItems` asks once per day, so an unmemoised read would sweep the board 760
  // times. It can never describe a stale board — every edit path ends in `render()`.
  var DS_STATE=null;
  function dayShapeState(day){
    if(!DS_STATE) DS_STATE={};
    if(DS_STATE[day]) return DS_STATE[day];
    var rows=[];
    st.matches.forEach(function(x){ if(x.day!==day || !x.start) return;
      rows.push({id:x.id, div:x.div, start:x.start}); });
    var hits=dayShapeOut(rows), out={};
    rows.forEach(function(r){
      if(hits[r.id] && !DS_EXC[r.id+"|"+day+"|"+r.start]) out[r.id]=1;
    });
    DS_STATE[day]=out; return out;
  }
  // The whole board's live day-order set, as {day: {id: 1}}. The check count reads this and
  // NOT the current scope: §0.3's failure was a strip reading zero in one division while 8 breaks
  // sat in four others, and a scoped count reproduces it exactly (CUI-2's own reason for making
  // the warning bar global).
  function dayShapeBoard(){
    var out={};
    (PLAN.days||[]).forEach(function(d){
      var s=dayShapeState(d);
      if(Object.keys(s).length) out[d]=s;
    });
    return out;
  }
  function dayShapeTotal(){
    var n=0, b=dayShapeBoard();
    Object.keys(b).forEach(function(d){ n+=Object.keys(b[d]).length; });
    return n;
  }
  // A match named the way LANG-1 ruling 3 names one — division, round, players — because no
  // internal id reaches any screen. `roundLine` and `whoText` are the card's own renderers, so a
  // day-order line reads exactly like the card it is about.
  function matchName(m){
    if(!m) return "";
    var rl=roundLine(m), who=whoText(m);
    return m.div+(rl? ", "+rl : "")+" — "+(who || "players not yet decided");
  }

  // ---- EVAL-1 half (a) · the day lock, SAID -------------------------------------------------
  //
  // ⚠ NOTHING HERE CHANGES WHAT IS ALLOWED. The lock has held by construction since CONSOLE-2:
  // every loaded placement carries `mustDay` (`:775`), a hold snaps the card's day back to it,
  // `placeUnplaced` FORCES it, and `moveMatch` has no day parameter at all — driven across the
  // whole 8/15 replay, no gesture on any tab emits a cross-day move. What shipped was silence:
  // hold a Jan-29 card, switch the view to Jan 30, tap a cell there, and the card is placed on
  // Jan 29, off the board the TD is looking at, with an empty bar. The rule held; nothing said
  // the rule exists; the card left the screen. This is the telling, and only the telling.
  //
  // It fires on the By-day view alone, and that is the honest reading of "a day that is not the
  // card's": the By Venue grid spans days and hides the day tabs entirely, so there is no day the
  // TD is looking at for the placement to contradict. On the day view there is exactly one.
  function isFinalMatch(m){
    var D=(PLAN.divisions||[]).filter(function(x){ return x.name===(m||{}).div; })[0];
    if(!D || !D.rounds) return false;
    return D.rounds.some(function(R){
      return R.name==="Final" && (R.ids||[]).indexOf(m.id)>-1;
    });
  }
  // ⚠ `QUIET` silences both messages below for the same reason SWAP-1 mutes the three rungs'
  // announcements: a swap is ONE gesture driving hold -> move -> place, and a sentence about one
  // of its internal steps would describe something the TD never did. The swap's own refusal
  // reader (`lastBlock`) reads the bar, so a message left there by an internal step could also be
  // reported back as the cause of a failure it had nothing to do with.
  function dayLockNote(m, day){
    if(QUIET || st.view!=="day" || !day || day===st.day) return "";
    return isFinalMatch(m)
      ? "This match stays on "+fmtDay(day)+" — your finals map puts this division's rounds "+
        "there. To change the day, change the finals map."
      : "This match stays on "+fmtDay(day)+" — that is its day on the schedule. To change a "+
        "division's days, change the finals map.";
  }
  // The hold-on-a-final message (ruled 8/15) — a MESSAGE, never a refusal. HOLDVIS-1's
  // decision-not-discovery posture: the TD may hold a final, and he should hear what he just did
  // to the day his finals map promised, at the moment he does it.
  //
  // The promised day comes from `finals_day` (§5.2) — the TD's CONFIRMED map. With the key absent
  // the sentence names the card's own delivered day instead: degraded wording, never a missing
  // message, so a plan built without a map behaves and reads consistently.
  function holdFinalNote(m){
    if(QUIET || !isFinalMatch(m)) return "";
    var promised=FINALS_DAY[m.div], day=promised || m.mustDay || m.day;
    if(!day) return "";
    return "Holding this takes the Final off "+fmtDay(day)+" — "+
      (promised ? "the day your finals map promised." : "its day on the schedule.")+
      " It prints as held unless you place it back.";
  }

  // ---- CUI-3 · SLOT-SUGGEST (ruling 55 / D-30, amended by ruling 56) ----------------------
  // "Where can this go?" on the SELECTED card, and nothing else moves. Client-side advisory: the
  // sweep offers slots, `moveMatch` still decides, and accepting emits the SAME `move` op a drag
  // emits — `schedule-edits/v1` is untouched by this build.
  //
  // BUILT REUSABLE ON PURPOSE. SWAP-1 (A4b) inherits `boardWindows`, `cleanSlots`, `rankSlots` and
  // the rail renderer; a two-card swap is this sweep run twice with a different acceptance step.
  //
  // The board's row set, shared with `renderTable` so a suggested cell is always a cell that is
  // actually on screen. CUI-3 §15 decision 3: the skeleton is a fixed 90-minute display grid,
  // decoupled from `match_minutes`.
  var GRID_STEP=90;
  function boardWindows(mine){
    var wins={};
    for(var wt=DAY_START; wt+GRID_STEP<=DAY_END-EOD_BUF; wt+=GRID_STEP) wins[min2hhmm(wt)]=1;
    (mine||[]).forEach(function(m){ if(m.start) wins[m.start]=1; });
    return Object.keys(wins).sort();
  }
  // The ranking, specified in the brief because no ruling supplies one. SWAP-1's ruled order
  // (ruling 57) is `no new warnings -> fewest humans affected -> smallest time displacement, same
  // venue preferred`. Its first two terms are redundant here — clean-only means no candidate
  // carries a warning, and a single-card move affects exactly the humans already on the card — so
  // the remainder is adopted verbatim rather than a new rule being invented. Total order, so the
  // same board and the same card always produce the same list.
  function rankSlots(m){
    var cur=m.start!=null ? hhmm2min(m.start) : null, curLoc=m.location||null;
    return function(a,b){
      if(cur!=null){
        var da=Math.abs(hhmm2min(a.start)-cur), db=Math.abs(hhmm2min(b.start)-cur);
        if(da!==db) return da-db;                            // smallest time displacement
      }
      var sa=(a.loc===curLoc)?0:1, sb=(b.loc===curLoc)?0:1;
      if(sa!==sb) return sa-sb;                              // same venue preferred
      var ta=hhmm2min(a.start), tb=hhmm2min(b.start);
      if(ta!==tb) return ta-tb;                              // earliest start — deterministic
      return a.loc<b.loc ? -1 : (a.loc>b.loc ? 1 : 0);
    };
  }
  // Sweep the visible day's cells through the FULL guard chain and keep only what survives it.
  //
  // S36 — CLOSED at SWAP-1. Checked here, all of it through the one chain: player double-book,
  // the rest interval, per-cell court capacity, per-venue hours, the division's resolved earliest
  // start, inter-venue TRANSIT time and the per-division DAILY CAP (DRAW-1's two), and FEEDER
  // (round) ORDERING (SWAP-1's — a round-2 card can no longer be offered a slot ahead of the
  // round-1 matches feeding it). The trio S36 named is complete; the sweep's coverage grew on its
  // own as each build wired its rule, because every guard the chain gains is a guard this sweep
  // runs. Ruling 56: none of this is stated on the surface — the record lives in the brief and
  // here.
  //
  // CLEAN ONLY. A slot that fits but would warn is not offered, so nothing becomes placeable
  // without notice; a manual drag onto that same slot still warns exactly as it did before.
  function cleanSlots(m){
    if(!m) return [];
    var day=m.day||st.day, dur=m.duration||DEF_DUR, out=[];
    boardWindows(scopeMatches()).forEach(function(w){
      var s=hhmm2min(w);
      if(s==null || s<DAY_START || s+dur>DAY_END-EOD_BUF) return;
      COLS.forEach(function(c){
        if(m.location===c.id && m.start===w) return;         // where the card already sits
        if(conflictsAt(m, w, day).length) return;            // ANY conflict, hard or soft
        if(wouldOverCap(m, c.id, w, day)) return;
        if(slotBlocks(m, c.id, w, day).length) return;
        out.push({loc:c.id, start:w, day:day});
      });
    });
    out.sort(rankSlots(m));
    return out;
  }
  // ---- SWAP-1 · the pair sweep (ruling 57, whole; ruling 85 decisions 1-4) -------------------
  // "Who can it swap with?" — the second half of the question SLOT-SUGGEST answers. For the
  // SELECTED, PLACED card A, every other PLACED card B on the same day (all venues) is a
  // candidate, and the pair is offered only if BOTH directions survive the FULL guard chain with
  // the partner excluded from the board. Same rule as `cleanSlots:981` — ANY conflict, hard or
  // soft, refuses — so a swap is never the way a warning enters the board unnoticed; a manual
  // drag onto either slot still warns exactly as it did before.
  //
  // Unplaced dock cards get no swap list: SLOT-SUGGEST already owns their question.
  //
  // Cost: the selected card against at most a few hundred same-day partners, two directions,
  // three guard calls each — the same order of work the slot sweep already does per render, and
  // the engine is never invoked.
  function cleanInto(m, loc, start, day, skipId){
    var s=hhmm2min(start), dur=m.duration||DEF_DUR;
    if(s==null || s<DAY_START || s+dur>DAY_END-EOD_BUF) return false;
    if(conflictsAt(m, start, day, skipId).length) return false;
    if(wouldOverCap(m, loc, start, day, skipId)) return false;
    if(slotBlocks(m, loc, start, day, skipId).length) return false;
    return true;
  }
  // A pair on the SAME lineage edge is never offered. Each direction is swept with the partner
  // excluded from the board, so neither direction can see the other card's DESTINATION — which is
  // the one case where "excluded" hides a real breach rather than a stale occupancy: swapping a
  // semifinal with its own quarterfinal moves each card to where the other's absence made the
  // check silent. Ruling 85 decision 3 states the sweep never offers a breach; this is what keeps
  // that true. Refusing more is always safe under clean-only.
  function lineagePair(a, b){
    return feedersOf(a.id).indexOf(b.id)>-1 || feedersOf(b.id).indexOf(a.id)>-1;
  }
  // Ruling 57's ranking order, made TOTAL — as at CUI-3, what the ruling leaves open is specified
  // rather than a new rule being invented:
  //   1. "no new warnings" — satisfied identically by every candidate under clean-only, so it is
  //      RECORDED as redundant here the way `rankSlots`' comment records its own two. (Unlike the
  //      single-card case the SECOND term is NOT redundant: the partner card varies.)
  //   2. fewest humans affected = |humans(A) u humans(B)| — 2 (singles<->singles) to 8
  //      (doubles<->doubles). A is fixed, so this ranks small partner cards first.
  //   3. smallest time displacement = |start(A) - start(B)| — one figure, not a sum: each card
  //      moves the same distance.
  //   4. same venue preferred.
  //   5. deterministic tail — earlier B.start, then B.location, then B.id.
  function rankSwaps(){
    return function(x, y){
      if(x.humans!==y.humans) return x.humans-y.humans;
      if(x.disp!==y.disp) return x.disp-y.disp;
      if(x.sameVenue!==y.sameVenue) return x.sameVenue-y.sameVenue;   // 0 = same venue, ranks first
      if(x.bStart!==y.bStart) return x.bStart-y.bStart;
      if(x.b.location!==y.b.location) return x.b.location<y.b.location ? -1 : 1;
      return x.b.id<y.b.id ? -1 : (x.b.id>y.b.id ? 1 : 0);
    };
  }
  function swapPairs(a){
    if(!a || !a.location || !a.start) return [];
    var day=a.day, aStart=hhmm2min(a.start);
    var aHumans=(a.players||[]).filter(isReal), out=[];
    st.matches.forEach(function(b){
      if(b.id===a.id || b.day!==day || !b.location || !b.start) return;
      if(b.location===a.location && b.start===a.start) return;      // same cell — the exchange is a no-op
      if(lineagePair(a, b)) return;
      if(!cleanInto(a, b.location, b.start, day, b.id)) return;
      if(!cleanInto(b, a.location, a.start, day, a.id)) return;
      var union={}; aHumans.forEach(function(p){ union[p]=1; });
      (b.players||[]).filter(isReal).forEach(function(p){ union[p]=1; });
      out.push({ b:b, humans:Object.keys(union).length,
                 disp:Math.abs(hhmm2min(b.start)-aStart),
                 sameVenue:(b.location===a.location)?0:1,
                 bStart:hhmm2min(b.start) });
    });
    out.sort(rankSwaps());
    return out;
  }
  // The diversity rule (ruling 57), applied AT DISPLAY: every feasible pair is scored before any
  // is called "best" — the count is display truncation, the ruling's own words. Walking the
  // ranked list, a candidate whose (division, start) is already represented among the picked rows
  // is skipped, so four answers are four KINDS of trade, not one trade four ways.
  var SWAP_SHOW=4;
  function swapRows(cands){
    var seen={}, out=[];
    (cands||[]).forEach(function(c){
      if(out.length>=SWAP_SHOW) return;
      var key=c.b.div+"|"+c.b.start;
      if(seen[key]) return;
      seen[key]=1; out.push(c);
    });
    return out;
  }
  // The one-line "why" — the ranking facts themselves, and nothing this build does not measure.
  function swapWhy(a, c){
    var bits=[], d=hhmm2min(c.b.start)-hhmm2min(a.start);
    bits.push(c.sameVenue===0 ? "same venue" : a.location+" → "+c.b.location);
    bits.push(d===0 ? "same time" : fmtDur(Math.abs(d))+(d<0 ? " earlier" : " later"));
    bits.push(c.humans+(c.humans===1 ? " person" : " people"));
    return bits.join(" · ");
  }
  function selectedMatch(){
    if(!st.selMatch) return null;
    var m=st.matches.filter(function(x){return x.id===st.selMatch;})[0];
    return m || st.unplaced.filter(function(x){return x.id===st.selMatch;})[0] || null;
  }
  // human reason for a blocked move/placement
  function blockMsg(c){
    return (c.kind==="dbl" ? "Double-book" : "Rest <"+fmtDur(MIN_S2S))
      + " · " + c.who + (c.cross ? " (also in "+c.other.div+")" : " (same division)")
      + " at " + c.other.start;
  }

  function renderTable(){
    var opening=isOpening();
    var host=el("tableWrap"); host.innerHTML="";
    var D=curDivObj(); if(!D){ host.innerHTML='<div class="empty-note">No division selected.</div>'; return; }
    var mine=scopeMatches();
    if(!mine.length){
      host.innerHTML = opening
        ? '<div class="empty-note">No opening matches for '+esc(st.div)+'.</div>'
        : '<div class="empty-note">Nothing scheduled for '+esc(st.div)+' on '+esc(st.day)+'. Try another day, or check the panel on the right.</div>';
      return;
    }
    // #3-fix: show every standard day window as a row (not just the ones THIS division uses),
    // so the venue's full-day capacity is visible and per-division clustering reads as what it is.
    // CUI-3 (§15 decision 3, RULED): the skeleton is DECOUPLED from `match_minutes`. It steps on a
    // fixed 90-minute display grid, whatever duration the TD picked in Setup.
    //
    // The row set is a READING AID, not a placement rule — the engine places on a 15-minute lattice
    // and always has. Welded to `match_minutes`, the frame of reference itself changed shape when a
    // Setup value changed: the same division on the same day read differently for a reason that had
    // nothing to do with the schedule. It does NOT stop the board growing — measured, decoupling
    // removes 2 rows at 75 minutes and none at 60; the board grows because a shorter match spreads
    // the schedule out (14 distinct starts at 75 against 6 at 90) and no display rule can undo that.
    // What it buys is a grid that HOLDS STILL, which is what makes the 143 of 192 division-day views
    // with a single start time readable at all.
    var windows=boardWindows(mine);   // skeleton + any start it does not carry
    // F3 responsive: on narrow screens show one venue column (selected via venue tabs); wide = all venues side-by-side.
    var cols = narrowScreen() ? COLS.filter(function(c){ return c.id===st.venue; }) : COLS;
    if(!cols.length) cols = COLS.slice(0,1);

    var tbl=document.createElement("table"); tbl.className="sched";
    // CUI-2 patch: a venue this division never uses was taking an equal share of the board
    // under fixed layout — a quarter of the width for an empty column. Empty venues shrink
    // to a slim lane. They stay on the board (and stay drop targets), just narrow.
    var usedLoc={}; mine.forEach(function(m){ usedLoc[m.location]=1; });
    var nUsed = cols.filter(function(c){ return usedLoc[c.id]; }).length || cols.length;
    var cg=document.createElement("colgroup");
    cg.innerHTML='<col class="cwin">'+cols.map(function(c){
      return usedLoc[c.id] ? '<col style="width:'+(92/nUsed)+'%">' : '<col class="cempty">';
    }).join("");
    tbl.appendChild(cg);
    var thead=document.createElement("thead"); var htr=document.createElement("tr");
    htr.innerHTML='<th class="thwin">Time</th>';
    cols.forEach(function(c){ var th=document.createElement("th");
      if(!usedLoc[c.id]) th.className="empty";
      // In opening mode a column spans multiple days, so a single day's court count would be misleading — show the venue only.
      th.innerHTML=esc(c.id)+(opening? '' : ' <span class="cap">'+esc(capLabel(c.id,st.day))+'</span>'); htr.appendChild(th); });
    thead.appendChild(htr); tbl.appendChild(thead);

    var tb=document.createElement("tbody");
    windows.forEach(function(win){
      var s=hhmm2min(win);
      var tr=document.createElement("tr");
      var wtd=document.createElement("td"); wtd.className="win"; wtd.textContent=win; tr.appendChild(wtd);
      cols.forEach(function(c){
        var td=document.createElement("td"); td.className="cell";
        (function(loc, win2){                                   // EC-1: cell is a drop target
          td.addEventListener("dragover", function(e){ if(st.dragId){ e.preventDefault(); e.dataTransfer.dropEffect="move"; td.classList.add("drop-ok"); } });
          td.addEventListener("dragleave", function(){ td.classList.remove("drop-ok"); });
          td.addEventListener("drop", function(e){ e.preventDefault(); td.classList.remove("drop-ok"); dropInto(loc, win2); });
          // F2.6 PRIMARY gesture: with a card selected, tapping an empty slot moves it there (same guards as drag).
          td.addEventListener("click", function(){ placeSelected(loc, win2); });
        })(c.id, win);
        // CUI-3 · SLOT-SUGGEST: a candidate cell wears the shipped `drop-ok` dashed outline plus
        // its rank, so the board and the rail list read as one thing rather than two.
        var rank=suggestRank(c.id, win);
        if(rank){
          td.classList.add("drop-ok","suggested");
          var chip=document.createElement("div"); chip.className="sugchip"; chip.textContent=rank;
          td.appendChild(chip);
        }
        var here=mine.filter(function(m){ return m.start===win && m.location===c.id; });
        if(opening){
          // Cards can come from any day; flag over-capacity if ANY day represented here exceeds that day's cap.
          var days={}; here.forEach(function(m){ days[m.day]=1; });
          var over=false; Object.keys(days).forEach(function(dd){ if(usedAt(c.id,dd,s) > capAt(c.id,dd,s)) over=true; });
          if(over){ var cc=document.createElement("div"); cc.className="cellcap over"; cc.textContent="over capacity at "+win; td.appendChild(cc); td.classList.add("overcap"); }
        } else {
          var used=usedAt(c.id, st.day, s), cap=capAt(c.id,st.day,s), overd=used>cap;
          if(here.length || used>0){
            var cc2=document.createElement("div"); cc2.className="cellcap"+(overd?" over":""); cc2.textContent=used+" / "+cap+" courts"; td.appendChild(cc2);
            if(overd) td.classList.add("overcap");
          }
        }
        here.forEach(function(m){ td.appendChild(matchCard(m, opening, win)); });
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); host.appendChild(tbl);
  }

  // CONSOLE-2 · 8/8 item 6b: the round and the match number, on every card of both kinds.
  // The Operator asked for doubles cards to show what singles cards show; the premise was
  // corrected at the notes — NO card of either type showed it. The `— awaits winner, Round 1
  // match 2` line is `awaitingLabel` and says what a card is WAITING FOR, not what it is, and
  // it disappears the moment both teams are known.
  //
  // The round NAME is looked up in the plan (`divisions[].rounds[].name`), never computed here.
  // The match NUMBER is the one thing the id legitimately carries: `-M<n>` in both the
  // elimination (`E12-R1-M12`) and the round-robin (`E48-M1-<usta>+<usta>v…`) spellings, which
  // is why one expression reads both. The id itself stays unrendered.
  // RR-FRIENDLY (2026-08-13, call 3 option 1 — Operator ruling): a round-robin group has no
  // rounds. No RR division carries a `rounds` block, so the name fell to the SYNTHETIC
  // "Round N" — and that number is the match number repeated (measured on all 45 of the 2026
  // field's RR matches: `Round 1 · Match 1` … `Round 6 · Match 6`, while a four-team group
  // really plays three rounds and spreads them over three or four days). The card was asserting
  // a structure the group does not have, so the synthetic half goes on RR cards: they read
  // `Match N`. ELIMINATION CARDS ARE UNTOUCHED — their names come from the plan and are real —
  // and a plan that ever DID name a round-robin round still gets that name printed, because
  // only the fallback is branched.
  function roundLine(m){
    var name=ROUND_NAME[m.div+"|"+m.round] ||
             (m.fmt!=="rr" && m.round!=null ? "Round "+m.round : "");
    var num=/-M(\d+)/.exec(m.id||"");
    if(!name && !num) return "";
    return name + (name && num ? " · " : "") + (num ? "Match "+num[1] : "");
  }

  function matchCard(m, showDay, win){
    var confs=conflictsFor(m); var hard=confs.some(function(c){return c.kind==="dbl";});
    var card=document.createElement("div"); card.className="mcard "+(m.fmt||"elim")+(m.id===st.selMatch?" sel":"")+(hard?" hard":"");
    card.setAttribute("data-mid", m.id);
    var whoHtml = whoLine(m, esc(m.label));   // CARD-1: side-aware for doubles, unchanged for singles
    // F3: opening-matches span days, so each card carries its own day/date; day-scoped cards show time only.
    var dayHtml = showDay ? '<span class="mday" title="'+esc(m.day)+'">'+esc(fmtDay(m.day))+'</span>' : '<span class="mid">'+esc(m.id)+'</span>';
    // DRAW-1 (ruling 56): the SUB tag — hover names who came in for whom. Hover-ONLY, no click
    // handler, so it cannot trip the in-card control trap; no clearable state.
    var subTag=st.subTags[m.id]
      ? '<span class="subtag" title="'+esc(st.subTags[m.id]["in"])+' in for '+esc(st.subTags[m.id].out)+'">SUB</span> '
      : '';
    // The row already names its window, so repeating the start time on every card is noise.
    // It IS shown when the match sits off its row (e.g. placed at 08:15 from the tray) — there the time is
    // the whole point, and it reads as an exception rather than as wallpaper.
    var offGrid = !win || m.start !== win;
    var timeHtml = offGrid ? '<span class="mtime">'+esc(m.start)+'</span>' : '';
    var rl=roundLine(m);
    card.innerHTML='<div class="mtop">'+subTag+timeHtml+dayHtml+'</div>'+
      (showDay? '<div class="mid">'+esc(m.id)+'</div>' : '')+
      '<div class="mwho">'+whoHtml+'</div>'+
      (rl? '<div class="mround">'+esc(rl)+'</div>' : '');
    // EC-1: drag the card between (time × venue) cells or onto the Unplaced dock.
    card.draggable=true;
    card.addEventListener("dragstart", function(e){ st.dragId=m.id; card.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", m.id); }catch(_){} });
    card.addEventListener("dragend", function(){ st.dragId=null; card.classList.remove("dragging"); clearDropHints(); });
    // EC-2 (the ±15 fine-tune) is RETIRED — Operator ruling 2026-08-02, at CUI-3's touch-up.
    // Two reasons, both measured. (1) It was refused two times in three on the real field: 70 of
    // 108 buttons disabled across day 1's 51 divisions, almost all on capacity — a 90-minute match
    // shifted 15 minutes overlaps the next wave and busts the court count. (2) When it WAS allowed
    // it did not work, and it wrote a false edit: the click ran `nudge` -> `moveMatch` (which sets
    // `st.selMatch`), then bubbled to the cell, whose F2.6 `placeSelected` moved the now-selected
    // card straight back to that row's own time — leaving a no-op `move` op in the emit and the
    // console announcing a change that never happened. Pre-existing; CUI-3 did not cause it.
    //
    // THE CAPABILITY IS NOT LOST: an off-cadence start is still reachable through Hold (off schedule)
    // -> the tray's Place control, whose time list steps by 15 across the whole day (`timeOptions`)
    // and runs the same guard chain via `placeUnplaced`. Drag covers on-grid moves; SLOT-SUGGEST
    // answers "where can this go".
    var ed=document.createElement("div"); ed.className="medit";
    var tip=document.createElement("span"); tip.className="ntip"; tip.textContent="drag to move";
    ed.appendChild(tip); card.appendChild(ed);
    // conflict badges
    confs.forEach(function(cf){
      var bd=document.createElement("div"); bd.className="mbadge "+(cf.kind==="dbl"?"dbl":"rest");
      bd.innerHTML=(cf.kind==="dbl"?"⛔ <b>Double-booked</b>: ":"⚠ <b>Rest &lt;"+fmtDur(MIN_S2S)+"</b>: ")+esc(cf.who)+
        (cf.cross?' <span class="xdiv">also in '+esc(cf.other.div)+'</span>':' (same div)')+" — "+esc(cf.other.start);
      card.appendChild(bd);
    });
    // DRAW-1 (a6-ii): the chain's soft kinds at the card's OWN slot — transit and the daily
    // cap — render as warning badges. Advisory: the card is never marked hard by them.
    if(m.location && m.start){
      slotBlocks(m, m.location, m.start, m.day).forEach(function(b){
        if(!b.soft) return;
        var bd=document.createElement("div"); bd.className="mbadge rest";
        bd.innerHTML="⚠ <b>"+(b.kind==="transit"?"Transit":"Daily cap")+"</b>: "+esc(b.note);
        card.appendChild(bd);
      });
    }
    // EVAL-1 §2.3 — the day-order badge, in the same visual family as the advisory badges above
    // and never the hard one: a match out of the day's order of play is a schedule the TD can
    // look at and accept (report-never-refuse, ruling 8/7), not an unplayable one. The engine's
    // own recorded exceptions are already excused inside `dayShapeState`, so this marks what the
    // BOARD did and never what the engine had to do.
    if(m.day && m.start){
      if(dayShapeState(m.day)[m.id]){
        var dbd=document.createElement("div"); dbd.className="mbadge rest dayorder";
        dbd.innerHTML="⚠ <b>Day order</b>: "+esc(aheadPhrase(m.div));
        card.appendChild(dbd);
      }
    }
    // hold
    var hd=document.createElement("div"); hd.className="hold";
    // CONSOLE-2 (8/7 note 4, reproduced live): the click STOPS HERE. Without it the button's
    // click reached the card handler below — which early-returns on BUTTON and does not stop
    // propagation — and then the cell's own handler (`:1319`), whose `placeSelected` put the
    // just-held card straight back on the board and minted a no-op `move` in the emit at the
    // card's own slot. That is the exact mechanism recorded at the ±15 nudge's retirement, and
    // the reason DRAW-1/SWAP-1 adopted the in-card-control rule. The rule is applied HERE, on
    // the control, rather than by widening the card's early-return: a control that owns its
    // click says so at the site that owns it, and every other in-card control keeps the
    // behaviour it was built with. (The prior art this clause used to cite — the bracket
    // view's own move/hold buttons — was deleted at EDIT-VIEWONLY when that tab became view
    // only. The rule stands on its own; this guard is untouched by that removal.)
    var hb=document.createElement("button"); hb.type="button"; hb.textContent="Hold (off schedule)"; hb.addEventListener("click", function(ev){ ev.stopPropagation(); holdMatch(m); });
    hd.appendChild(hb);
    // SCORE-1: the undo, on the card that carries the change, in the row that already owns this
    // card's controls and under the same in-card-control rule (`stopPropagation` inside
    // `undoButton`, so the click cannot reach the cell and be answered by `placeSelected`).
    // A card whose entry is SEEDED shows nothing here, and the absence is the statement: under
    // D1 a prior round's change is the delivered schedule, and there is nothing on the document
    // to put the card back to.
    if(touchedThisSitting(m.id)) hd.appendChild(undoButton(m.id));
    card.appendChild(hd);
    card.addEventListener("click", function(ev){
      if(ev.target.tagName==="SELECT" || ev.target.tagName==="BUTTON") return;   // let controls handle their own clicks
      ev.stopPropagation();                                                      // don't let the cell treat this as a place-tap
      st.selMatch = (st.selMatch===m.id) ? null : m.id;                          // toggle selection
      render();
    });
    return card;
  }

  function moveMatch(m, loc, start){
    // guard (EC-5): a double-book or over-capacity is a HARD block; (EC-4) a rest gap is a SOFT warning.
    var bad=conflictsAt(m, start, m.day);
    var hard=bad.filter(function(c){return c.kind==="dbl";});
    if(hard.length){ flashBlock("Move blocked · "+blockMsg(hard[0])+". Card left in place — resolve the conflict first."); render(); return; }
    var ob=capBreach(m, loc, start, m.day);
    if(ob){ flashBlock("Move blocked · "+capBlockMsg(loc, m.day, ob)+". Card left in place."); render(); return; }
    // CUI-3: venue hours and the division's earliest start — the same HARD class as a double-book,
    // because the engine enforces both and a schedule that breaks them is not buildable.
    // DRAW-1 (a6-ii): the chain's soft kinds (transit, daily cap) WARN here and never block —
    // the Hybrid ruling. Only the hard kinds reach flashBlock.
    var sb=slotBlocks(m, loc, start, m.day), sbHard=sb.filter(function(b){return !b.soft;}),
        sbSoft=sb.filter(function(b){return b.soft;});
    if(sbHard.length){ flashBlock("Move blocked · "+sbHard[0].note+". Card left in place."); render(); return; }
    // CONSOLE-2 (8/8 item 5): the day-order count, read AFTER every hard gate has passed and
    // BEFORE the card moves — so it describes the drop that is about to happen. It is appended
    // to whatever the existing chain already says rather than replacing it: the rest and
    // transit/cap sentences are untouched, and this one never suppresses them or is suppressed
    // by them, because they are different facts about the same drop. It cannot reach flashBlock.
    var dsNote=dayShapeNote(m, start, m.day);
    if(bad.length){ flashWarn("Rest warning · "+blockMsg(bad[0])+". Move allowed — review before finalizing."+(dsNote?" "+dsNote:"")); }
    else if(sbSoft.length){ flashWarn("Heads-up · "+sbSoft[0].note+". Move allowed — review before finalizing."+(dsNote?" "+dsNote:"")); }
    else if(dsNote){ flashWarn(dsNote+" Move allowed — review before finalizing."); }
    else { clearBlock(); }
    m.location=loc; m.start=start;
    st.edits[m.id]={op:"move", to:{day:m.day, start:start, location:loc}}; st.selMatch=m.id;
    announce(m.id+" → "+loc+" "+start); render();
  }
  function holdMatch(m){
    // CONSOLE-2 (8/7 note 4, the second defect): a hold SUCCEEDS, so it clears the bar the way
    // every other successful action does (`moveMatch` `:1437`, `placeUnplaced` `:1466`). Without
    // this the red message minted by a refused move sat there verbatim over a board that had
    // since done exactly what was asked — the Operator's own report ("I selected 'hold off
    // schedule', got this error, and it didn't go away").
    clearBlock();
    // EVAL-1 §2.4 — read BEFORE the card is stripped: `holdFinalNote` names the day, and the
    // three lines below delete `m.start`/`m.location` and rewrite `m.day`. The REKEY-1 and
    // HOLDVIS-1 comments in `apply_schedule_edits` record the engine-side twin of this trap.
    var fin=holdFinalNote(m);
    st.matches=st.matches.filter(function(x){return x.id!==m.id;});
    delete m.location; delete m.start; m.day=m.mustDay||m.day;
    if(!st.unplaced.some(function(x){return x.id===m.id;})) st.unplaced.push(m);
    st.edits[m.id]={op:"hold"};
    // Fires only on a final, so an ordinary hold stays exactly as silent as it shipped
    // (CONSOLE-2's "a hold clears the bar" is untouched — `clearBlock` already ran above).
    if(fin) flashWarn(fin);
    announce(m.id+" held"); render();
  }
  function placeUnplaced(m, loc, start){
    var day=m.mustDay||st.day;
    // guard (EC-5): double-book / over-capacity HARD block; (EC-4) rest gap SOFT warning.
    var bad=conflictsAt(m, start, day);
    var hard=bad.filter(function(c){return c.kind==="dbl";});
    if(hard.length){ flashBlock("Placement blocked · "+blockMsg(hard[0])+". Card stays in the Unplaced dock — pick a clear slot."); render(); return; }
    var obu=capBreach(m, loc, start, day);
    if(obu){ flashBlock("Placement blocked · "+capBlockMsg(loc, day, obu)+". Card stays in the Unplaced dock."); render(); return; }
    // CUI-3: venue hours + earliest start stay HARD; DRAW-1's soft kinds warn, never block.
    var sbu=slotBlocks(m, loc, start, day), sbuHard=sbu.filter(function(b){return !b.soft;}),
        sbuSoft=sbu.filter(function(b){return b.soft;});
    if(sbuHard.length){ flashBlock("Placement blocked · "+sbuHard[0].note+". Card stays in the Unplaced dock."); render(); return; }
    // CONSOLE-2 (8/8 item 5): the same advisory on the dock's own placement path — a card
    // returning to the board from Hold puts bystanders out of shape exactly as a move does.
    var dsuNote=dayShapeNote(m, start, day);
    // EVAL-1 half (a): the day lock, said at the gesture that asks for another day. It is
    // APPENDED to whatever the chain already says rather than replacing it — the rest, transit
    // and day-order sentences are different facts about the same placement — and it never
    // reaches `flashBlock`, because nothing here is refused that was not refused before.
    var lockNote=dayLockNote(m, day);
    var tail=(dsuNote?" "+dsuNote:"")+(lockNote?" "+lockNote:"");
    if(bad.length){ flashWarn("Rest warning · "+blockMsg(bad[0])+". Placed anyway — review before finalizing."+tail); }
    else if(sbuSoft.length){ flashWarn("Heads-up · "+sbuSoft[0].note+". Placed anyway — review before finalizing."+tail); }
    else if(dsuNote){ flashWarn(dsuNote+" Placed anyway — review before finalizing."+(lockNote?" "+lockNote:"")); }
    else if(lockNote){ flashWarn(lockNote); }
    else { clearBlock(); }
    st.unplaced=st.unplaced.filter(function(x){return x.id!==m.id;});
    m.location=loc; m.start=start; m.day=day; st.matches.push(m);
    st.edits[m.id]={op:"move", to:{day:m.day, start:start, location:loc}}; st.selMatch=m.id;
    announce(m.id+" placed at "+loc+" "+start); render();
  }
  // Resolve the dragged card (placed or unplaced) and drop it into (loc, start).
  function dropInto(loc, start){
    var id=st.dragId; if(!id) return;
    var m=st.matches.filter(function(x){return x.id===id;})[0];
    if(m){ moveMatch(m, loc, start); return; }
    var u=st.unplaced.filter(function(x){return x.id===id;})[0];
    if(u){ placeUnplaced(u, loc, start); }
  }
  // F2.6 PRIMARY gesture: move/place the SELECTED card into (loc,start) via the same guarded paths as a drop.
  function placeSelected(loc, start){
    var id=st.selMatch; if(!id) return;
    var m=st.matches.filter(function(x){return x.id===id;})[0];
    if(m){ if(m.location===loc && m.start===start) return; moveMatch(m, loc, start); return; }   // no-op if already there
    var u=st.unplaced.filter(function(x){return x.id===id;})[0];
    if(u){ placeUnplaced(u, loc, start); }
  }
  function clearDropHints(){
    var ns=document.querySelectorAll(".cell.drop-ok, #tray.drop-ok");
    for(var i=0;i<ns.length;i++) ns[i].classList.remove("drop-ok");
  }

  // ---- ISSUES-1 (Operator's issue 4, 8/17) — a way back from a jump ----------------------
  // The console has TWO jumps and neither recorded where it came from: an issue card's click
  // handler and `jumpToGrid`. Measured over the field, 1,313 of 1,330 issue-card clicks from
  // By day move the TD into a division he was not reading, and from By Venue half of them move
  // the view as well — so "restore the division only" would strand him on a screen he never
  // chose with a stranger's card selected. The complete return is division · view · selection.
  //
  // ⚠ ONE WRITER, TWO CALL SITES. Both jumps record through this function and nothing else
  // builds the record, so the origin cannot know which jump made it — and there is no second
  // builder to keep in step, which is the trap CARD-1 recorded. The GO is unchanged: issue 4
  // adds a return, it does not touch either jump's behaviour.
  function recordJumpOrigin(){
    st.jumpFrom={div:st.div, view:st.view, sel:st.selMatch};
  }
  // Any other navigation drops the record, so the button can never describe a board the TD has
  // since left — the discipline `st.sugSlots` already uses. The division picker, the steppers,
  // the filter, the day tabs and the view tabs all call this; a jump is the only gesture that
  // leaves a return behind.
  function clearJumpOrigin(){ st.jumpFrom=null; }
  // Where the button would take him, or null when there is nowhere to go. The 17 of 1,330
  // clicks that move nothing are exactly this: a return to the scope already on screen would
  // put a button on the toolbar naming the division the TD is looking at.
  function jumpBackTo(){
    var o=st.jumpFrom;
    if(!o) return null;
    if(o.div===st.div && o.view===st.view) return null;
    return o;
  }
  function renderBackJump(){
    var b=el("backJump"); if(!b) return;
    var o=jumpBackTo();
    if(!o){ b.hidden=true; b.textContent=""; b.removeAttribute("title"); return; }
    // LANG-1 §5.2 (proposed with this build, ruled 8/17): the arrow, the plain word, the
    // division named in full. "Division" is kept vocabulary (§5.9); nothing here is coined.
    b.hidden=false;
    b.textContent="← Back to "+o.div;
    b.title="← Back to "+o.div;
  }
  function goBackFromJump(){
    var o=jumpBackTo(); if(!o) return;
    // Exactly what D3 rules and nothing else. The day is deliberately NOT restored: neither
    // jump moves it (measured 0 of 1,330 clicks from By day, 0 of 98 from By Venue), so a
    // return that wrote it would be restoring something it was never asked to.
    st.div=o.div; st.view=o.view; st.selMatch=o.sel;
    clearJumpOrigin();
    announce("Back to "+o.div);
    render();
  }

  // CONSOLE-2 · 8/7 note 7 (ruled shape, verbatim): view -> the venue grid, the division set to
  // the card's own, the day set to the day it MUST be played (falling back to the shown day when
  // the card carries no assigned day), the card selected, render. Selecting it is what makes the
  // jump useful: "Where can this go?" primes on the selection, so the director lands on the board
  // with the answer one click away.
  // ISSUES-1: the origin is recorded first, through the writer both jumps share. Nothing below
  // this line changed — the go is exactly the go that shipped, announcement included.
  function jumpToGrid(m){
    recordJumpOrigin();
    st.view="opening";
    if(m.div) st.div=m.div;
    st.day=m.mustDay||st.day;
    st.selMatch=m.id;
    announce(m.div+" on the venue grid — "+fmtDay(st.day));
    render();
  }

  function renderTray(){
    var t=el("tray"); t.innerHTML="";
    if(!st.unplaced.length){ t.innerHTML='<div class="tray-empty">All matches placed.</div>'; return; }
    st.unplaced.forEach(function(m){
      var c=document.createElement("div"); c.className="tray-card";
      // CUI-3 touch-up: a held card keeps the facts it had on the board. This printed the raw
      // label, so dragging a card to the dock stripped its seed, events, rating and locality
      // badge — the same people, suddenly anonymous, until it was placed again. It goes through
      // the canonical renderer now, with the board card's own bare-label fallback for a match
      // the plan never gave players (`unplaced` carries ids only).
      var whoHtml = whoLine(m, esc(m.label));   // CARD-1: same side model as the board card
      // CONSOLE-2 · 8/7 note 6: this line carried `id · division` and was then hidden WHOLESALE
      // by `.tray-card .cid{display:none}` — the internal-id ban took the division name down
      // with it, so a dock card said who was playing and never what they were playing. The
      // division renders; the id does not. It stays on the node as `data-mid` for the same
      // reason the board card carries one (tests and debugging), which is also what note 7's
      // jump and this harness family read.
      c.setAttribute("data-mid", m.id);
      c.innerHTML='<div class="cid">'+esc(m.div)+'</div><div class="cwho">'+whoHtml+'</div>'+
        // The short date form, approved 8/8 with the blanket grant: "must be Jan 23", the same
        // `fmtDay` the board cards have always used. An ISO date is a machine's way of saying it.
        '<div class="creason">'+esc(m.reason||"")+(m.mustDay?(" · must be "+esc(fmtDay(m.mustDay))):"")+'</div>';
      c.draggable=true;                                       // EC-1: drag a dock card onto a cell to place it
      c.addEventListener("dragstart", function(e){ st.dragId=m.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", m.id); }catch(_){} });
      c.addEventListener("dragend", function(){ st.dragId=null; c.classList.remove("dragging"); clearDropHints(); });
      var pl=document.createElement("div"); pl.className="placer";
      var vs=document.createElement("select"); COLS.forEach(function(x){ var o=document.createElement("option"); o.value=x.id; o.textContent=x.id; vs.appendChild(o); });
      var ts=document.createElement("select"); timeOptions(m.duration).forEach(function(x){ var o=document.createElement("option"); o.value=x; o.textContent=x; ts.appendChild(o); });
      var pb=document.createElement("button"); pb.className="btn-ghost btn-sm"; pb.textContent="Place"; pb.style.fontSize="14.5px"; pb.style.padding="3px 9px";
      pb.addEventListener("click", function(ev){ ev.stopPropagation(); placeUnplaced(m, vs.value, ts.value); });
      // CONSOLE-2 · 8/7 note 7: ONE jump function, two ways to reach it, on ANY tab (the dock
      // renders in the side column everywhere, so reach-from-any-tab is automatic). The button
      // sits beside Place in the existing hover row; the right-click accelerator calls the same
      // function and its preventDefault is scoped to the card alone.
      var sb=document.createElement("button"); sb.className="btn-ghost btn-sm"; sb.textContent="Show on grid";
      sb.style.fontSize="14.5px"; sb.style.padding="3px 9px";
      sb.addEventListener("click", function(ev){ ev.stopPropagation(); jumpToGrid(m); });
      c.addEventListener("contextmenu", function(ev){ ev.preventDefault(); ev.stopPropagation(); jumpToGrid(m); });
      pl.appendChild(vs); pl.appendChild(ts); pl.appendChild(pb); pl.appendChild(sb);
      // SCORE-1: a held card's undo lives on the dock card, beside Place — the two ways back
      // onto the board, one that asks the TD where and one that already knows. A card the round
      // DELIVERED unplaced carries no control: it was never taken off by this sitting.
      if(touchedThisSitting(m.id)) pl.appendChild(undoButton(m.id));
      c.appendChild(pl);
      t.appendChild(c);
    });
  }

  // Issues panel: full scan across all divisions, this day (dedup by id-pair)
  // Scope-anchored issue scan: conflicts on the division's shown matches (conflictsFor is cross-division aware,
  // so a shared player double-booked in ANOTHER division is still caught), plus over-capacity cells in scope.
  function scopeIssues(){
    var mine=scopeMatches(), out=[], seen={};
    mine.forEach(function(a){
      conflictsFor(a).forEach(function(c){ var b=c.other; var key=[a.id,b.id].sort().join("|"); if(seen[key]) return; seen[key]=1;
        if(c.kind==="dbl") out.push({kind:"dbl", title:"Player double-booked", cross:c.cross, note:c.who+" cannot play both", sub:a.id+" & "+b.id+" — "+a.start+" & "+b.start, ids:[a.id,b.id]});
        else out.push({kind:"rest", title:"Rest gap", cross:c.cross, note:"Under "+fmtDur(MIN_S2S)+" for "+c.who, sub:a.id+" & "+b.id+" — "+a.start+" & "+b.start, ids:[a.id,b.id]});
      });
    });
    var cells={};
    mine.forEach(function(m){ var key=m.location+"|"+m.day+"|"+m.start; if(cells[key]) return; cells[key]=1;
      var used=usedAt(m.location,m.day,hhmm2min(m.start)), cap=capAt(m.location,m.day,hhmm2min(m.start));
      if(used>cap) out.push({kind:"capacity", title:"Over capacity", note:m.location+" needs "+used+" courts but has "+cap+" at "+m.start, sub:m.day, ids:[m.id]});
    });
    // CUI-3: the two rules this panel could not see — and, since DRAW-1 (a6-ii), transit and the
    // per-division daily cap through the same chain. SWAP-1 adds feeder ordering, which CLOSES
    // the S36 trio: the all-clear below now means all five kinds, and nothing the guard chain
    // knows is invisible to this panel.
    var TITLES={hours:"Outside venue hours", early:"Starts too early",
                transit:"Transit too tight", dailycap:"Over the daily cap",
                feeder:"Out of round order"};
    mine.forEach(function(m){
      if(!m.location || !m.start) return;
      slotBlocks(m, m.location, m.start, m.day).forEach(function(b){
        if(b.pair){ var pk=b.kind+"|"+b.pair; if(seen[pk]) return; seen[pk]=1; }
        // `feeder` reads in the hard tone with `hours`: it is not a judgment call — the engine
        // refuses to build the board and `validate_multi` grades it as a conflict.
        out.push({kind:(b.kind==="hours"||b.kind==="feeder") ? "capacity" : "rest",
                  title:TITLES[b.kind]||b.kind,
                  note:b.note, sub:m.id+" — "+m.start+", "+m.day, ids:[m.id]});
      });
    });
    // EVAL-1 §2.3 — THE LIST THE KEYSTONE ASKS FOR. Every match out of the day's order of play on
    // the day(s) this board is showing, ACROSS EVERY DIVISION — not only the one in the picker.
    // That cross-division reach is the whole point: on 8/15 all 7 matches the TD's move broke sat
    // in divisions he never opened, so a division-scoped list would have named none of them.
    //
    // Scoped to the shown day rather than the whole board because this panel describes what is on
    // screen; the board-wide number lives on the counter strip, and the Change Check tab carries
    // the board-wide list.
    var byId={}; st.matches.forEach(function(x){ byId[x.id]=x; });
    shownDays().forEach(function(d){
      var s=dayShapeState(d);
      Object.keys(s).sort().forEach(function(id){
        var m=byId[id]; if(!m) return;
        out.push({kind:"rest", title:"Out of the day's order of play",
                  cross:(m.div!==st.div), note:matchName(m)+" — "+aheadPhrase(m.div),
                  sub:fmtDay(d)+" · "+m.start+" · "+m.location, ids:[id]});
      });
    });
    return out;
  }
  // The day(s) the board in front of the TD is showing. The By-day view shows one; the By Venue
  // grid spans whatever days the division's opening matches fall on, so it is asked rather than
  // assumed. `st.day` is the fallback and never a guess: it is the tab the day view would open.
  function shownDays(){
    if(st.view==="day") return st.day ? [st.day] : [];
    var days={};
    scopeMatches().forEach(function(m){ if(m.day) days[m.day]=1; });
    var out=Object.keys(days).sort();
    return out.length ? out : (st.day ? [st.day] : []);
  }
  // ---- CUI-3 · SLOT-SUGGEST rail -----------------------------------------------------------
  // `st.suggest` holds the id the sweep was asked about; the slots are recomputed on every render
  // so the list can never describe a board that has since changed underneath it.
  function suggestSlots(){
    if(!st.suggest || st.suggest!==st.selMatch) return null;
    return cleanSlots(selectedMatch());
  }
  // SWAP-1: recomputed every render for the same reason the slots are — a swap list that
  // described a board which has since moved underneath it would be worse than no list.
  function suggestSwaps(){
    if(!st.suggest || st.suggest!==st.selMatch) return null;
    var m=selectedMatch();
    if(!m || st.matches.indexOf(m)<0) return null;      // dock cards: SLOT-SUGGEST owns them
    return swapPairs(m);
  }
  function suggestRank(loc, win){
    var s=st.sugSlots; if(!s) return 0;
    for(var i=0;i<s.length;i++){ if(s[i].loc===loc && s[i].start===win) return i+1; }
    return 0;
  }
  function renderSuggest(){
    var host=el("suggest"); if(!host) return;
    var head=el("suggestHead"), panel=el("suggestPanel");
    host.innerHTML="";
    var m=selectedMatch();
    if(head) head.textContent="Open Slots and Swaps";   // CONSOLE-2 · 6a#5: BOTH sites, or the static one reverts on the next render
    if(!m){
      panel.classList.remove("hot");
      host.innerHTML='<div class="empty-note">Select a card to see where it can go.</div>';
      return;
    }
    // The card, not its id: a real match id is a pair of joined USTA numbers and would fill the
    // panel with a string nobody reads.
    var lab=document.createElement("div"); lab.className="sugfor";
    lab.textContent=whoText(m) || m.label || m.id;                 // CARD-1: side-aware
    host.appendChild(lab);
    var btn=document.createElement("button");
    btn.type="button"; btn.className="btn-ghost btn-sm"; btn.id="suggestBtn";
    btn.textContent = st.sugSlots ? "Clear" : "Where can this go?";
    btn.addEventListener("click", function(){
      st.suggest = st.sugSlots ? null : m.id; render();
    });
    host.appendChild(btn);
    var slots=st.sugSlots;
    if(!slots){ renderSwaps(host, m); return; }
    panel.classList.add("hot");
    if(!slots.length){
      // Report-the-reason rather than do-nothing (the pattern the retired ±15 control established,
      // which outlived it). No coverage prose (ruling 56) — it says what happened, not what was checked.
      var e=document.createElement("div"); e.className="empty-note";
      e.textContent="No clean slots this day."; host.appendChild(e); renderSwaps(host, m); return;
    }
    var list=document.createElement("div"); list.className="suglist";
    slots.forEach(function(sl, i){
      var row=document.createElement("div"); row.className="sugrow";
      row.innerHTML='<span class="sugn">'+(i+1)+'</span><span class="sugwhere">'+
                    esc(sl.loc)+' · '+esc(sl.start)+'</span>';
      var go=document.createElement("button");
      go.type="button"; go.className="btn-ghost btn-sm"; go.textContent="Move here";
      // Accepting goes through the NORMAL move path, so the guards run again at commit and the
      // emit is the existing `move` op. A suggestion is never a bypass.
      go.addEventListener("click", function(){
        var cur=selectedMatch(); if(!cur) return;
        st.suggest=null;
        if(st.matches.indexOf(cur)>-1) moveMatch(cur, sl.loc, sl.start);
        else placeUnplaced(cur, sl.loc, sl.start);
      });
      row.appendChild(go); list.appendChild(row);
    });
    host.appendChild(list);
    renderSwaps(host, m);
  }
  // ---- SWAP-1 · the swap rail, under the slot list in the SAME panel -------------------------
  // Ruling 85 decision 4: one action answers both halves of the question — open slots above,
  // swaps below, as the shared mockup draws them stacked
  // (`reference/product/cui3_editor_mockup_2026-08-01.html:379-401`).
  //
  // ⚠ THE IN-CARD CONTROL TRAP. Every control this build adds lives in the SIDE PANEL and never
  // on a match card — DRAW-1's rule, and the ±15 nudge's exact failure: the card's click handler
  // early-returns for SELECT/BUTTON WITHOUT stopping propagation, so an in-card button's click
  // reaches the cell, `placeSelected` undoes the change, and the edit stays in the emit. The
  // hover-preview below is the only thing this build puts near a card, and it is a CSS class on
  // mouseenter/mouseleave — no click path, no re-render, no state, no standing highlight
  // (ruling 56's declutter).
  function swapPreview(bid, on){
    var ns=document.querySelectorAll('.mcard[data-mid="'+(window.CSS && CSS.escape ? CSS.escape(bid) : bid)+'"]');
    for(var i=0;i<ns.length;i++) ns[i].classList.toggle("swappeer", !!on);
  }
  // ⚠ THE PREVIEW'S REACH, and why the rail says where a partner is.
  //
  // The sweep is deliberately CROSS-DIVISION — same day, all venues, every division, which is
  // where most of the useful trades are (measured on the committed field: 417 of 446 offers on
  // 2026-01-24 have a partner in another division). The board renders ONE division at a time.
  // So a preview that only outlines a card cannot reach most partners, and the first cut of this
  // rail promised the hover unconditionally — true for 29 of 446 rows.
  //
  // Fixed the honest way round, NOT by narrowing the sweep (that would discard the offers that
  // ARE the feature): the row NAMES the partner's division whenever it differs, which answers
  // "where is this match" for every row, and the hover line is printed only when at least one
  // row can actually deliver it. `scopeMatches()` is read directly rather than re-derived, so
  // "is it on the board" can never drift from what the board actually drew.
  function renderSwaps(host, a){
    var cands=st.sugSwaps;
    if(!cands) return;                                   // the action was not taken, or a dock card
    var hd=document.createElement("div"); hd.className="swaphead";
    hd.textContent="Swap options · up to "+SWAP_SHOW;
    host.appendChild(hd);
    var rows=swapRows(cands);
    if(!rows.length){
      var e=document.createElement("div"); e.className="empty-note";
      e.textContent="No swaps available."; host.appendChild(e); return;
    }
    var onBoard={}; scopeMatches().forEach(function(x){ onBoard[x.id]=1; });
    if(rows.some(function(c){ return onBoard[c.b.id]; })){
      var hint=document.createElement("div"); hint.className="swaphint";
      hint.textContent="hover a row to preview its partner on the board";
      host.appendChild(hint);
    }
    var list=document.createElement("div"); list.className="suglist";
    rows.forEach(function(c, i){
      var b=c.b, here=!!onBoard[b.id];
      var who=whoText(b) || b.label || b.id;                       // CARD-1: side-aware
      // The division, whenever it is not the one on screen: the board shows a single division,
      // so without this the row describes a match the director has no way to find.
      var whereHtml = b.div!==a.div
        ? '<span class="swapdiv">'+esc(b.div)+'</span>' : '';
      var row=document.createElement("div"); row.className="sugrow swaprow"+(here?" here":"");
      row.setAttribute("data-swap", b.id);   // the partner, named for the harness — data, not a control
      row.innerHTML='<span class="sugn">'+(i+1)+'</span>'+
                    '<span class="swapwho"><span class="swapx">⇄</span> '+esc(who)+
                    ' — '+esc(b.start)+' '+esc(b.location)+
                    whereHtml+
                    '<span class="swapwhy">'+esc(swapWhy(a, c))+'</span></span>';
      // Bound ONLY where the outline can land. A listener that reliably does nothing is how the
      // rail came to promise something it could not deliver.
      if(here){

      // Gender column, forwarded by `editor_plan._players_meta` — the answer the desk vetted,
      // not a reading of which divisions somebody entered. The inference above STAYS, as the
      // fallback for a person the entry list has no value for: a plan generated before this
      // build carries no key at all, and that console behaves exactly as it did.
      //
      // This is what closes the blind spot rather than narrowing it: the inference is blank on
      // 33 of 132 people standing on a Mixed card and cannot test 1,947 of 6,996 replaced x
      // candidate pairs (27.8%, measured 8/8), because a Mixed-only registrant has entered no
      // gendered division to read. `subEligWhy` below is UNCHANGED — it is fed truth instead of
      // guesses. A name PLAYERS knows and the three lists do not still gets a profile, so the
      // fact never depends on the inference having found the person first.
      Object.keys(PLAYERS||{}).forEach(function(n){
        var g=SEX[(PLAYERS[n]||{}).gender];

  // The entry list speaks "M"/"F"; this console's registration vocabulary is "men"/"women" and
  // every reader of `regProfileOf` already speaks it. One map, so the two never drift.
  var SEX={M:"men", F:"women"};

  // 2026-08-08): where the answer is a fact the Mixed-composition guard BLOCKS; where it is
  // absent the row greys with its reason and stays selectable. The tool never blocks on a guess
  // — that is the ruling's own stated principle, and this predicate is the line between them.
  function sexFact(name){ return SEX[(PLAYERS[name]||{}).gender] || null; }
  // ELIG-1 Part A · THE eligibility test (D1-v2, ruling 88), at one named site. Returns null when
  // the candidate may legally fill this card, or the TRUE reason they may not. Down, never up on
  // age — registering for 70 & over proves 70+, so a 70, 65, 60 … card is open to them and an
  // 80 & over card is not. Gender must match; on a MIXED card it matches the gender of the player
  // being REPLACED, so the team keeps one of each.
  //
  // Event type is deliberately NOT tested here (Operator-confirmed 2026-08-06). This panel only
  // ever opens on a doubles card — `divIsDoubles` gates it — and a candidate's own singles /
  // doubles registrations say nothing about whether he may fill one: the pool's one singles-only
  // man is 75 and male, a legal fill for a 70 & over men's doubles team, and putting him behind a
  // line that reads "not eligible for this division" would say something untrue. It is also what
  // the build's target numbers were measured against (16 of 63 rows on the worked card).
  function subEligWhy(div, out, name){
    var d=divParse(div||""), p=regProfileOf(name);
    if(p.floor!=null && p.floor<d.age)
      return "outside the rule: registered no higher than "+p.floor+" & over";
    var need=(d.gender==="mixed") ? regProfileOf(out||"").gender : d.gender;
    if(need && p.gender && p.gender!==need)
      // GENDER-1 · the LOGIC is unchanged — it is fed a fact instead of a guess. The SENTENCE
      // had to move with it, and this is called out rather than absorbed: it said "registered in
      // men's events", which is a true account of the inference and a FALSE one of the entry
      // list. A Mixed-only registrant has entered no gendered division at all — 33 of 132 people
      // standing on a Mixed card, measured — so on exactly the people this build newly tests,
      // the old sentence stated something untrue on a TD-facing surface. It now says which
      // source it read, because the two are different claims and the director acts on them
      // differently: an entry-list answer is the desk's own record, a registration reading is
      // the tool's deduction.
      return "outside the rule: "+
             (sexFact(name)
               ? (p.gender==="women"?"a woman":"a man")+" on the entry list"

  // `out` (the player being replaced) is needed only by the Mixed half of the gender test; omit

  function subCandidates(div, out){
    var evs=divSort(Object.keys(NON_DRAWN), MIXED_L1);
    if(div && NON_DRAWN[div])

    evs.forEach(function(ev){
      (NON_DRAWN[ev]||[]).forEach(function(c){

        // whose withdrawal the tool cannot read can never be picked, so on a panel whose whole
        // job is "who can take this player's place" it is furniture. RENDER-SIDE, and that is
        // the whole of it: the plan's `non_drawn` contract is untouched (still 41 rows), and the
        // flag SURVIVES where it belongs — both people stay on the exceptions CSV with DESK-1's
        // FACT -> EXPLANATION -> ACTION sentences and on the withdrawn-list accounting.
        //
        // Measured at the ruling: 6 of 41 rows, and they are TWO people (Michael Harmon and
        // Murad Sofizade, three divisions each) whose single entry row carries three status
        // words, which no rule may allocate — ruling (b), print the raw row, invent nothing,
        // flag it. DESK-1 moved this premise from 44 dead rows to 6 and the strip was re-put to
        // the Operator at the new numbers rather than built on the old ones.
        //
