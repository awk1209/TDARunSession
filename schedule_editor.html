        // ineligible candidate still renders behind ELIG-1's counted line with its true reason,
        // because a list silently shorter than it looks is the failure D-18 guards against.
        // This drops rows that are not candidates at all, which the counted line never claimed.
        if(c.unclear) return;

        // LANG-1 item 46 · the source fix. "printed draw" is retired vocabulary — the glossary
        // splits it into Raw Draw (the desk's export, the truth) and System Draw (anything this
        // tool renders). This candidate is in the RAW DRAW, which is why he cannot be a
        // substitute. NO RENDERED DELTA ON THIS FIELD, stated rather than claimed: the string
        // needs a `not_buildable` candidate and this pool holds 0 of them
        // (`tests/rpt2_conflicts.py` part D pins `EDIT_CONSOLE_LEFT = 0` before and after).
        if(c.bucket==="not_buildable") why="already in the Raw Draw";
        else if(st.subUsed[c.usta_id]) why="already substituted into "+st.subUsed[c.usta_id];
        rows.push({card:c, ev:ev, why:why, eligWhy:subEligWhy(div, out, c.name)});

    });

  }
  // One row renderer for both halves of the panel, so a revealed row is the SAME row it would
  // have been in the top list — same reason, same selectability. Eligibility and pickability are
  // separate axes: `why` (already in the Raw Draw · already substituted into …) is what greys a
  // row and blocks the click, and it is untouched by Part A. CONSOLE-2 · 6d retired the third
  // reason from this list by dropping those rows upstream rather than greying them.
  function subRows(host, list){
    var lastEv=null;
    list.forEach(function(r){
      if(r.ev!==lastEv){ lastEv=r.ev;
        var h=document.createElement("div"); h.className="nd-divhead"; h.textContent=r.ev;
        host.appendChild(h); }
      var d=document.createElement("div");
      var selng=st.subCand && st.subCand.usta_id===r.card.usta_id;
      d.className="subrow"+(r.why?" off":"")+(selng?" sel":"");
      d.innerHTML='<span class="cwho">'+esc(r.card.name)+'</span>'+
        '<span class="nd-badge">'+esc(r.card.status)+'</span>'+
        (r.why?'<div class="why">'+esc(r.why)+'</div>':'')+
        (r.eligWhy?'<div class="elig">'+esc(r.eligWhy)+'</div>':'');
      if(!r.why){
        d.addEventListener("click", function(){
          st.subCand = selng ? null : {name:r.card.name, usta_id:r.card.usta_id};
          render();
        });
      }
      host.appendChild(d);
    });
  }
  function renderSubstitute(){
    var host=el("subBody"); if(!host) return; host.innerHTML="";
    // CONSOLE-2 · 8/7 note 5 ("lock the confirmation … so it is always visible when scrolling
    // potential subs"): the confirmation renders into the PINNED zone above the scrolling pool.
    // THE FULL CLUSTER, not the button alone, and that is the deciding detail — keeping the
    // seed is only legal WITH a recorded reason (enforced at `subApply`), so a confirm button
    // separated from its own required textarea would be a confirm whose precondition sits
    // off-screen. Cleared on every render, including the early returns below, or a stale
    // confirmation outlives the card it belonged to.
    var pin=el("subPinned"); if(pin) pin.innerHTML="";
    var m=selectedMatch();
    if(!m || !divIsDoubles(m.div)){

        'Substitute on their Round 1 match.</div>';

    }
    var reals=(m.players||[]).filter(isReal);
    if(st.subOut && reals.indexOf(st.subOut)<0) st.subOut=null;
    // SUBFIX-1 (C, Operator ruling 8/8): `subApply` clears `st.subOut`, so re-opening the panel
    // falls back to `reals[0]` — and `players` is sorted, so the man just substituted IN can
    // sort first and be pre-loaded as the next man to substitute OUT. The default now steps
    // over anyone this session put in, and prefers the side the substitution landed on, so the
    // pick offered is the REMAINING ORIGINAL PARTNER rather than an opponent who happens to
    // sort early. THE DEFAULT ONLY — the dropdown below still lists every real player on the
    // card and picking one explicitly is untouched, as are the pool and its selectability.
    // Both partners substituted this session (legal, rare) falls back to today's `reals[0]`
    // rather than leaving the panel with no selection at all.
    var sides=sidesOf(m);
    var landed=sides ? [sides[0], sides[1]].filter(function(side){
                 return side.some(function(p){ return st.subbedIn[p]; }); })[0] : null;
    var partner=(landed||[]).filter(function(p){ return !st.subbedIn[p]; });
    var notSubbedIn=reals.filter(function(p){ return !st.subbedIn[p]; });
    var out=st.subOut||partner[0]||notSubbedIn[0]||reals[0];
    // ELIG-1 Part A: the show-everyone line is per CARD. Opening it on one card must not silently
    // widen the next card's list back to the whole pool — the narrowing is the point.
    if(st.subShowFor!==m.id){ st.subShowFor=m.id; st.subShowAll=false; }

    var octl=document.createElement("div"); octl.className="subctl";
    octl.innerHTML='<label>Replace</label>';
    var osel=document.createElement("select");
    reals.forEach(function(p){ var o=document.createElement("option"); o.value=p; o.textContent=p;
      if(p===out) o.selected=true; osel.appendChild(o); });
    osel.addEventListener("change", function(){ st.subOut=osel.value; st.subCand=null; render(); });

    }

    // can legally fill the card in hand. Everyone else is COUNTED on one line that opens them,
    // each keeping its true reason and still selectable — the escape hatch is what preserves
    // D-18's principle while narrowing the list D-18 required whole: the failure D-18 guards
    // against is a list SILENTLY shorter than it looks, and a row that is neither shown nor
    // counted is the defect. Where nobody is eligible the panel SAYS SO IN WORDS — 7 of 51
    // divisions on the committed field, so an empty box is not a theoretical risk.
    var fit=rows.filter(function(r){ return !r.eligWhy; }),
        rest=rows.filter(function(r){ return r.eligWhy; });

      // all-greyed list under "nobody is eligible" leaves the director to work out for himself
      // that the pool holds no woman — the tool knows, so it says so. Display only: the rows
      // below are unchanged and every one of them is still selectable.
      var needG=(divParse(m.div||"").gender==="mixed") ? regProfileOf(out).gender : null;
      none.textContent = needG
        ? ("Nobody waiting in the pool is a "+(needG==="women"?"woman":"man")+" who can take "+
           out+"'s place in "+m.div+" — a Mixed team is one man and one woman. Everyone waiting "+
           "is listed below, with the reason.")
        : ("Nobody waiting in the pool is eligible for "+m.div+
           ". Everyone waiting is listed below, with the reason.");
      host.appendChild(none);
    }
    subRows(host, fit);
    if(rest.length){
      var det=document.createElement("details"); det.className="sub-more"; det.open=!!st.subShowAll;
      var sm=document.createElement("summary");
      sm.textContent=rest.length+(fit.length?" others":" people")+
                     " aren't eligible for this division — show them";
      det.appendChild(sm);

      // no re-render on toggle: the open state IS `st.subShowAll`, and re-rendering here would
      // rebuild the element under the click that opened it.

    var cluster = pin || host;
    // the seed decision (NQ-3, D-48): drop is the DEFAULT, keep is one click WITH a recorded
    // reason. The SEED-COUNT verdict renders inline right here, at the moment of choosing.
    // ABSENT on a round-robin division (ruled): RR prints no seed — nothing to drop, and a
    // stray marker parsed off an RR grid must not conjure an empty badge.
    var seed=(m.fmt==="rr")?null:seedOf(m.div, out);
    if(seed!=null){
      var sd=document.createElement("div"); sd.className="subctl";
      var kb=document.createElement("button"); kb.type="button"; kb.className="btn-ghost btn-sm";
      kb.textContent = st.subKeep ? "Let the seed drop" : "Keep the seed";
      kb.addEventListener("click", function(){ st.subKeep=!st.subKeep; render(); });
      sd.innerHTML='<div class="seedline">This team is seeded <b>'+esc(seed)+'</b>. '+
        (st.subKeep?'The seed will be KEPT — record why below.':'The seed drops (the default).')+'</div>';
      sd.appendChild(kb);
      if(st.subKeep){
        var ta=document.createElement("textarea"); ta.rows=2;
        ta.placeholder="Why does the replacement justify the seed? (required)";
        ta.value=st.subReason||"";
        ta.addEventListener("change", function(){ st.subReason=ta.value; });
        sd.appendChild(ta);
      }
      seedCountVerdict(m.div, !st.subKeep).forEach(function(v){
        var l=document.createElement("div"); l.className="seedline "+(v.warn?"warn":"info");

    var ni=document.createElement("input"); ni.type="text"; ni.placeholder="Note for the rekey list (optional)";
    ni.value=st.subNote||""; ni.addEventListener("change", function(){ st.subNote=ni.value; });

  }
  function subApply(){
    var m=selectedMatch(); if(!m) return;
    var reals=(m.players||[]).filter(isReal);
    var out=st.subOut||reals[0], cand=st.subCand;
    if(!out || !cand) return;
    // §5(c) defense-in-depth: re-check eligibility at APPLY, not only at render — no path
    // (keyboard, stale state, hand-set st.subCand) may substitute someone already in the Raw
    // Draw or whose withdrawal the tool cannot read. CONSOLE-2 · 6d strengthened this rather
    // than weakening it: a dead row is no longer RETURNED by `subCandidates` at all, so a
    // hand-set `st.subCand` naming one falls to the `!row` branch below and is refused with
    // "not in the entered-but-not-drawn pool" — which is now the true statement about it.
    // ⚠ ELIG-1 Part A: this guard stays on `why` ONLY. Ruling 88 made an out-of-rule candidate
    // revealable and SELECTABLE — the Operator's stated reason for the counted line over a bare
    // filter was never being locked out by a judgment the tool got wrong — so refusing here on
    // `eligWhy` would take back with one hand what the ruling gave with the other.
    var row=subCandidates(m.div, out).filter(function(r){ return r.card.usta_id===cand.usta_id; })[0];
    if(!row || row.why){
      flashBlock("Blocked · "+cand.name+" cannot be substituted in — "+
                 (row?row.why:"not in the entered-but-not-drawn pool")+".");
      st.subCand=null; render(); return;
    }
    // GENDER-1 (2026-08-08) · a Mixed team stays one man and one woman. Sits AFTER the `why`
    // guard and BEFORE rule 34's, because it is the cheaper and more specific refusal: rule 34
    // asks who this player already partners across the whole board, this asks one question about
    // the card in hand. Both name their two players and their division, and neither applies
    // anything before refusing.
    //
    // This does NOT re-open the guard above it to `eligWhy`. `eligWhy` greys a row on a
    // judgment — including one made from an inference — and ruling 88 keeps such a row
    // selectable. This blocks only where the entry list states both genders outright.
    var mixWhy=mixedBlockWhy(m, out, cand.name);
    if(mixWhy){ flashBlock(mixWhy); render(); return; }
    var why=subBlockedWhy(m, out, cand.name);
    if(why){ flashBlock(why); render(); return; }      // rule 34: an error prevented, not warned
    var seed=(m.fmt==="rr")?null:seedOf(m.div, out), keep=!!st.subKeep;
    if(seed!=null && keep && !(st.subReason||"").trim()){
      flashWarn("Keeping the seed needs a recorded reason — it rides the change into the rekey list.");
      render(); return;
    }
    var outId=(PLAYERS[out]||{}).usta_id||null;
    // Every match in this division that carries the outgoing player changes — a substitution
    // is a roster change, and leaving a bye-fed later-round card showing the old name would
    // make the board lie. One `substitute` edit per affected match id.
    var affected=st.matches.concat(st.unplaced).filter(function(x){
      return x.div===m.div && (x.players||[]).indexOf(out)>-1; });
    affected.forEach(function(x){
      x.players=x.players.map(function(p){ return p===out?cand.name:p; }).sort();
      x.label=String(x.label||"").split(out).join(cand.name);
      // SUBFIX-1 (A): `teams` is THE side model (`sidesOf` prefers it over both fallbacks), so
      // rewriting only `players`/`label` left every doubles card that shows a name rendering
      // from the one key the substitution never touched — 180 of 264 carry it and they are
      // exactly the cards with names on them, which is why no card showed a sub. Seven
      // surfaces read `sidesOf`; the fix is here, at the source, not seven times over.
      // Name-for-name, side membership preserved: a side the outgoing player is not on is
      // passed through untouched, and an absent key stays absent (the 84 no-name cards must
      // not gain one). Emptiness is preserved by construction, which is what keeps
      // `awaitingLabel` — the named risk — reading the same feeder on all 43 bye pairs.
      if(x.teams && x.teams.length===2){
        x.teams=x.teams.map(function(side){
          return (side||[]).indexOf(out)>-1
            ? side.map(function(p){ return p===out?cand.name:p; })
            : side;
        });
      }
      var ed={sub:{out:outId, "in":cand.usta_id, out_name:out, in_name:cand.name}};
      if(seed!=null){ ed.seed_effect = keep?"kept":"dropped";
                      ed.seed_kept_reason = keep?st.subReason.trim():null; }
      if((st.subNote||"").trim()) ed.note=st.subNote.trim();
      st.subEdits[x.id]=ed;
      st.subTags[x.id]={out:out, "in":cand.name, div:m.div};
    });
    // the seed data follows the ruling: drop = the team's badge goes; keep = the incoming
    // player inherits it (the partner keeps theirs either way only on a keep).
    var per=seedMapOf(m.div);
    if(seed!=null && per){
      var t=teamsOf(m);
      var mySide = t ? (t[0].indexOf(out)>-1 ? t[0] : t[1]) : [out];
      delete per[out];
      if(keep){ per[cand.name]=seed; }
      else { mySide.forEach(function(p){ delete per[p]; }); }
    }
    st.subUsed[cand.usta_id]=m.div;
    st.subbedIn[cand.name]=true;                       // SUBFIX-1 (C): see `renderSubstitute`
    st.subOut=null; st.subCand=null; st.subKeep=false; st.subReason=""; st.subNote="";
    clearBlock();
    announce(cand.name+" in for "+out+" — "+affected.length+" card(s) updated; the change is in the rekey list.");
    render();
  }
  // ---- DRAW-1 · the changes-to-rekey rail (rulings 56 + 66/D-38) --------------------------
  // One row per substitution, grouped by division in the ONE display order (divSort — the
  // committed JS mirror of division_order.display_key, asserted against Python by
  // tests/div1_order.py), ordered by draw (match id) inside a division. NO clearable state —
  // whether a change has been keyed into Tournament Desk is the director's lane. The list
  // itself travels with the emit as the `substitute` edits.
  function renderRekey(){
    var host=el("rekey"); if(!host) return; host.innerHTML="";
    var groups={};
    Object.keys(st.subEdits).forEach(function(id){
      var tag=st.subTags[id]; if(!tag) return;
      var k=tag.div+"|"+tag.out+"|"+tag["in"];
      (groups[k]=groups[k]||{div:tag.div, out:tag.out, inn:tag["in"], ids:[]}).ids.push(id);
    });
    var keys=Object.keys(groups);
    if(!keys.length){ host.innerHTML='<div class="tray-empty">Nothing to re-enter.</div>'; return; }
    var byDiv={};
    keys.forEach(function(k){ var g=groups[k]; (byDiv[g.div]=byDiv[g.div]||[]).push(g); });
    divSort(Object.keys(byDiv), MIXED_L1).forEach(function(div){
      var h=document.createElement("div"); h.className="nd-divhead"; h.textContent=div; host.appendChild(h);
      byDiv[div].sort(function(a,b){ var x=a.ids.slice().sort()[0], y=b.ids.slice().sort()[0];
        return x<y?-1:(x>y?1:0); });
      byDiv[div].forEach(function(g){
        var first=st.subEdits[g.ids.slice().sort()[0]]||{};
        var seed = first.seed_effect
          ? (first.seed_effect==="kept" ? " · seed kept — "+(first.seed_kept_reason||"")
                                        : " · seed dropped")
          : "";
        var d=document.createElement("div"); d.className="rekey-row";
        d.innerHTML='<span class="subtag" title="'+esc(g.inn)+' in for '+esc(g.out)+'">SUB</span> '+
          esc(g.inn)+' in for '+esc(g.out)+esc(seed)+
          (first.note?'<div class="isub">'+esc(first.note)+'</div>':'')+
          '<div class="isub">'+g.ids.slice().sort().join(", ")+'</div>';
        host.appendChild(d);
      });
    });
  }

  function renderIssues(){

  }

  // ---- CUI-2: the standing warning bar ------------------------------------
  // The run report caught a rest conflict that an edit introduced and nobody saw:
  // the Issues panel only scans what is currently on screen, so a clash created in
  // one division and left behind in another stayed invisible until the applied-edits
  // report. This scan covers EVERY division and day, and whatever it finds stays on
  // screen until it is actually fixed. The engine's own advisory notices ride in the
  // same bar so there is one place to look rather than three.
  function globalConflicts(){
    var seen={}, dbl=[], rest=[];
    st.matches.forEach(function(a){
      conflictsFor(a).forEach(function(c){
        var key=[a.id,c.other.id].sort().join("|");
        if(seen[key]) return; seen[key]=1;
        var line=c.who+" — "+a.div+" at "+a.start+" and "+c.other.div+" at "+c.other.start+", "+a.day;
        (c.kind==="dbl"?dbl:rest).push(line);
      });
    });
    return {dbl:dbl, rest:rest};
  }
  // ---- CUI-5 (Part D, ruled 8/5): the two-rounds advisory says the HUMAN sentence ---------
  // It used to read "<division> plays rounds 2 and 3 on <date>". That is the DIVISION's
  // sentence: it names no person and no clock, so the one thing the TD actually has to weigh
  // — that whoever wins the morning match is back on court the same afternoon, and how many
  // hours later — was nowhere on the screen. Nothing else covers this: the cap mirror and the
  // cross-level rest check both iterate the players ON a match, and a later elimination round
  // has none yet, so every person-level check is structurally blind here. This advisory IS the
  // coverage.
  //
  // The clocks are DERIVED from the board's own cards. `st.matches` already holds every
  // placement with its division, day, round and start, so `td-editor-plan/v1` gains no field
  // and the engine is not asked for anything: the console had the answer the whole time.
  function roundClocks(event, day){
    var by={};
    (st.matches||[]).forEach(function(m){
      if(m.div!==event || m.day!==day || m.round==null || !m.start) return;
      if(by[m.round]==null || m.start<by[m.round]) by[m.round]=m.start;
    });
    return Object.keys(by).map(Number).sort(function(a,b){ return a-b; })
             .map(function(r){ return {round:r, start:by[r]}; });
  }
  // CAD-1: which clock rule gave way, in the TD's own words. Keyed on the engine's `gate`; an
  // unrecognised or absent gate falls back to the pre-CAD-1 sentence's honesty — something bent
  // and the row does not say what.
  var YIELD_WORDS={
    "day_bands": "the early start promised to a player in three divisions that day gave way",
    "day_shape": "the day's order of play gave way",
    "day_bands+day_shape": "both the early start promised to a player in three divisions that "+
                           "day and the day's order of play gave way"
  };
  function ruleYieldHuman(e){
    var m=st.matches.filter(function(x){ return x.id===e.id; })[0];
    var who=m?whoText(m):"";
    return (e.event||e.id)+(who?" — "+who:"")+" on "+e.day+" at "+e.start+", where "+
           (YIELD_WORDS[e.gate]||"a clock rule gave way")+
           " so the match could stay on the day it was planned for";
  }
  // CAD-1 (8/18) — DORMANT BUT ALIVE, deprecate-not-delete. Rule 16 is now invariable for the
  // engine's own output, so `PLAN.cadence_conflicts` is empty on every board this tool builds and
  // this renderer draws nothing. It is NOT deleted, because the courier can still hand the
  // console a schedule with two rounds on one day — a plan carried forward from before this
  // build, or an edited result — and on that board this is still the sentence a director needs.
  // Its `forced` clause is the one part that is now unreachable by construction: it named the
  // ladder's cadence-breaking last rung, and that rung is gone.
  function cadenceHuman(c){
    var rs=roundClocks(c.event, c.day), head="Two rounds on one day · "+c.event;
    if(rs.length>=2){
      var a=rs[0], b=rs[rs.length-1];
      return head+" — whoever wins the "+a.start+" round-"+a.round+" match is back on court at "+
             b.start+" for round "+b.round+" ("+c.day+")";
    }
    // A hand edit can empty that division-day off the board. Then say what the engine recorded,
    // which is the sentence this line carried before — never nothing.
    return head+" — plays rounds "+(c.rounds||[]).join(" and ")+" on "+c.day;
  }

  // Everything worth flagging, gathered once and shared by the one-line bar and the tab.
  function warnItems(){
    var g=globalConflicts(), hard=[], soft=[];
    g.dbl.forEach(function(l){ hard.push("Double-booked · "+l); });
    g.rest.forEach(function(l){ soft.push("Less than "+fmtDur(MIN_S2S)+" between matches · "+l); });
    // DRAW-1 (a6-ii): the chain's soft kinds, swept globally like the conflicts above so a
    // transit or daily-cap breach can never hide behind the current scope. Deduped on the
    // symmetric pair key so one clash is one line.
    (function(){
      var seenB={};
      st.matches.forEach(function(m){
        if(!m.location || !m.start) return;
        slotBlocks(m, m.location, m.start, m.day).forEach(function(b){
          if(!b.soft) return;
          var k=b.kind+"|"+(b.pair||b.note); if(seenB[k]) return; seenB[k]=1;
          soft.push((b.kind==="transit"?"Transit too tight · ":"Over the daily cap · ")+b.note);
        });
      });
    })();
    // EVAL-1 §2.3 — the board-wide day-order list, so the Change Check tab can never read clean
    // over live breaks the way §0.3 measured it doing. Named one per match (LANG-1 ruling 3's
    // division · round · players), because the whole finding is that a count without names left
    // the TD nothing to act on. Listed ABOVE the engine notices below: these describe what the
    // BOARD now is, and those describe what the engine had to do to build it.
    (function(){
      var byId={}; st.matches.forEach(function(x){ byId[x.id]=x; });
      var board=dayShapeBoard();
      Object.keys(board).sort().forEach(function(d){
        Object.keys(board[d]).sort().forEach(function(id){
          var m=byId[id]; if(!m) return;
          soft.push("Out of the day's order of play · "+matchName(m)+" — "+
                    aheadPhrase(m.div)+", "+m.start+" "+fmtDay(d));
        });
      });
    })();
    // Engine notices. The spill list is whatever this run produced — its length moves
    // with the pins in play, so it is always read from the plan, never assumed.
    (PLAN.master_warnings||[]).forEach(function(w){ soft.push(String(w)); });
    var sp=PLAN.spills||[];
    sp.forEach(function(s){
      var line="Moved off its planned day · "+(s.event||s.id)+" — planned "+s.assigned_day+", now "+s.placed_day;
      // FIX-1 item 2: a spill that landed on a day its own division already plays is the one
      // the engine wants looked at, so it must not read like an ordinary day change.
      // CUI-5 (Part D): the two lines are now read as a PAIR — this one is the move that made
      // the collision, the `cadence_conflicts` line below is what the collision does to a
      // player. The phrase is kept (both lines are pinned in `tests/fix1_guards.py`); the
      // clause is what stops the two reading as the same sentence written twice.
      // CAD-1: dormant on an engine-built board — a move can no longer land on a day its own
      // division already plays. Alive for a couriered board, where it still can. The phrase is
      // pinned in `tests/fix1_guards.py` and stays exactly as it is.
      if(s.cadence_conflict){
        line="Two rounds on one day · "+line+", where the division already plays";
      }
      soft.push(line);
    });
    // FIX-1 item 2: cadence collisions are their own list, because one can exist with NO spill
    // (two rounds of a division planned onto the same day are placed there legitimately and
    // never spill). Reading only `spills` left exactly that case invisible here.
    // CAD-1: dormant on an engine-built board (the list is empty by construction now), alive for
    // a couriered one. See `cadenceHuman`.
    (PLAN.cadence_conflicts||[]).forEach(function(c){
      soft.push(cadenceHuman(c)+(c.forced?" — no other day could seat it":""));
    });
    // ENG-1 (ruling 73): the day-shape escapes. Grouped by day rather than listed one per match —
    // the committed field carries 38, and 38 individual lines would bury the spills above them.
    var esc={}; (PLAN.day_shape_exceptions||[]).forEach(function(e){
      (esc[e.day]=esc[e.day]||[]).push(e); });
    Object.keys(esc).sort().forEach(function(d){
      var n=esc[d].length;
      soft.push("Out of the day's order · "+n+" match"+(n===1?"":"es")+" on "+d+
                " could not be placed singles-then-mixed-then-doubles anywhere, so "+
                (n===1?"it was":"they were")+" placed anyway rather than left off the schedule");
    });
    // CAD-1 (8/18) — THIS SENTENCE WAS HALF WRONG AND IS REWRITTEN. It named "the head-start
    // band or the 9am finals floor" as the rules that gave way. The finals floor never gives way
    // again, and neither does the rest between rounds; the two rules that can are the early start
    // promised to a three-division player and the day's order of play, and the engine now says
    // WHICH in the row's `gate`. The old wording was also backwards about what happened: "placed
    // rather than dropped" reads as a last resort, when the point of the change is that the match
    // KEPT the day it was planned for and a clock courtesy gave way so it could.
    // `gate` is additive on a row this console already reads, so a plan generated before this
    // build still renders — it falls through to the undifferentiated wording, named as such.
    (PLAN.rule_escapes||[]).forEach(function(e){
      soft.push("Kept on its planned day · "+ruleYieldHuman(e));
    });
    return {hard:hard, soft:soft, all:hard.concat(soft)};
  }

  // CUI-2 patch (Operator review): the detail moved to its own tab so it stops compressing
  // the board. What stays here is ONE line — enough that a conflict still cannot hide while
  // you work in another division, which is the guarantee the run report bought us.
  // CONSOLE-2 · 8/7 note 3, and the SCOPE OF THE DELETION IS THE POINT. The Operator's ruling
  // ("'worth a look' and 25 to check are the same") is about the SOFT mode: the bar's advisory
  // lead duplicated the tab that sits three inches away, now reading "Change Check". The soft
  // lead and its "See all" button are gone.
  //
  // THE HARD MODE STAYS, and that is a deliberate carve-out recorded at the ruling and not a
  // hedge: "N players are in two places at once" is the CUI-2 double-booking announcement — the
  // guarantee that a conflict cannot hide while the director works in another division, bought
  // by the first run report. A double-booking is unplayable; everything else is advisory, and
  // only the advisory half was a duplicate.
  function renderWarnBar(){
    var bar=el("warnBar"); if(!bar) return;
    var w=warnItems();
    if(!w.hard.length){ bar.className="warnbar"; bar.innerHTML=""; return; }
    var lead=w.hard.length+" player"+(w.hard.length===1?" is":"s are")+" in two places at once";
    bar.innerHTML='<span>'+esc(lead)+'</span> <button class="btn-link" id="warnOpen">See all</button>';
    bar.className="warnbar show oneline stop";
    el("warnOpen").addEventListener("click", function(){ clearJumpOrigin(); st.view="warnings"; render(); });
  }

  function renderWarnings(){
    var host=el("tableWrap"); host.innerHTML="";
    var w=warnItems();
    // SCORE-1: this sitting's own changes, listed ABOVE the warnings with their undo controls.
    // This tab is where the TD reviews before finalizing, so what he changed belongs at the top
    // of it — and the row that names a change is the natural place to give it back. Zero-state
    // quiet: nothing changed this sitting, nothing rendered, and the tab is byte-identical to
    // the one that shipped.
    var changed=sittingEdits();
    if(!w.all.length && !changed.length){ host.innerHTML='<div class="none-good" style="padding:28px 12px">Nothing needs your attention. ✓</div>'; return; }
    if(changed.length) host.appendChild(sittingChangesBlock(changed));
    if(!w.all.length) return;
    function block(title, items, kind){
      if(!items.length) return;
      var h=document.createElement("div"); h.className="warnblock "+kind;
      var head=document.createElement("h3"); head.textContent=title+" ("+items.length+")";
      h.appendChild(head);
      items.forEach(function(t){ var d=document.createElement("div"); d.className="warnrow"; d.textContent=t; h.appendChild(d); });
      host.appendChild(h);
    }
    block("Must be fixed", w.hard, "stop");
    block("Change Check", w.soft, "soft");   // CONSOLE-2 · note 3: it matches the tab, or the tab lies
  }

  // SCORE-1: one row per change made in this sitting, each naming the match the way LANG-1
  // ruling 3 names one (division · round · players — no internal id reaches the screen) and
  // carrying the control that takes it back. Ordered by id so the list is stable across renders
  // rather than re-ordering itself under the TD's cursor.
  function sittingChangesBlock(ids){
    var h=document.createElement("div"); h.className="warnblock changes";
    var head=document.createElement("h3");
    head.textContent="Changes you made in this sitting ("+ids.length+")";
    h.appendChild(head);
    ids.forEach(function(id){
      var m=findMatch(id), e=st.edits[id], f=FLOOR.row[id];
      var was = (f && f.location && f.start)
                ? f.location+" "+f.start+" "+fmtDay(f.day)
                : "off the schedule";
      var d=document.createElement("div"); d.className="warnrow";
      var txt=document.createElement("span");
      // Branched on whether the entry NAMES A SLOT rather than on its op: `hold` is the only
      // op without one today, and a row that read `e.to.location` on an op that has no `to`
      // would throw inside a render, which takes the whole tab down rather than one line.
      txt.textContent = (e && e.to)
        ? "Moved · "+(m?matchName(m):"this match")+" — now "+
          e.to.location+" "+e.to.start+" "+fmtDay(e.to.day)+", was "+was
        : "Taken off the schedule · "+(m?matchName(m):"this match")+" — was "+was;
      d.appendChild(txt); d.appendChild(undoButton(id));
      h.appendChild(d);
    });
    return h;
  }

  function findMatch(id){ return st.matches.filter(function(m){return m.id===id;})[0] || st.unplaced.filter(function(m){return m.id===id;})[0]; }
  // ---- Bracket view (own full-width tab) --------------------------------------------------
  // EDIT-VIEWONLY (ruled 8/12): this tab is VIEW ONLY. No time, no venue, no Move, no Hold —
  // a bracket's axes are round and draw position, so nothing on this screen encodes the day,
  // time or venue a change would have to name, and every edit path lives on the views whose
  // axes are the clock and the court (By Venue, By day). Selection stays: tapping a box
  // highlights it and syncs the day, which changes nothing about the schedule.
  function bracketBox(id){
    var m=findMatch(id), sel=(id===st.selMatch);
    var box=document.createElement("div"); box.className="bk-match"+(sel?" sel":"");
    box.setAttribute("data-mid", id);
    var slot = m ? (m.location ? (fmtDay(m.day)+" · "+m.start+" · "+m.location) : "waiting for a slot") : "";
    // A later-round match has no players yet. Showing nothing but a date leaves the reader
    // with no idea what the box IS, so say so plainly — the engine's id is not the answer.
    var reals = m ? m.players.filter(isReal) : [];
    var whoHtml;
    if(!m){ whoHtml='<div class="btbd">—</div>'; }
    else if(!reals.length){ whoHtml='<div class="btbd">Winners to be decided</div>'; }
    else {
      // CARD-1: the bracket stacks one row PER SIDE, not per person. Stacking four people read
      // as four opponents, and a bye pair — two partners — read as a match between them.
      var s=sidesOf(m);
      if(s && (s[0].length || s[1].length)){
        whoHtml = [s[0], s[1]].filter(function(x){ return x.length; })
                    .map(function(x){ return '<div>'+sideHtml(m.div, x)+'</div>'; }).join("");
        if(!s[0].length || !s[1].length)
          whoHtml += '<div class="bwait">'+esc(awaitingLabel(m)||"awaiting an opponent")+'</div>';
      } else {
        whoHtml = reals.map(function(p){ return '<div>'+nameHtml(m.div, p)+'</div>'; }).join("");
        if(reals.length===1) whoHtml += '<div class="btbd">v winner to be decided</div>';
      }
    }
    var brl = m ? roundLine(m) : "";
    box.innerHTML='<div class="bid">'+
      (st.subTags[id]?'<span class="subtag" title="'+esc(st.subTags[id]["in"])+' in for '+
        esc(st.subTags[id].out)+'">SUB</span> ':'')+esc(id)+'</div>'+
      // CONSOLE-2 · 6b: the SUB badge kept its place at the top of the box, so the round line
      // sits with the slot line — the two facts about where this match sits in the draw and on
      // the clock, together.
      (brl? '<div class="bround">'+esc(brl)+'</div>' : '')+whoHtml+
      (slot? '<div class="bslot">'+esc(slot)+'</div>' : '');
    box.addEventListener("click", function(e){
      if(e.target.tagName==="SELECT"||e.target.tagName==="BUTTON") return;
      st.selMatch=(sel?null:id); if(m&&m.day) st.day=m.day; render();
    });
    return box;
  }

  // BRACKET-1a (Operator, 8/17, issue 1): THE SEAM LAYOUT. A card sits at the SEAM of the two
  // cards feeding it — the quarterfinal between its two round-1 matches, the semifinal between
  // its two quarterfinals, the final between the two semifinals, all the way up. That is what a
  // printed draw sheet does and it is the only rule this function knows.
  //
  // It is a MEASURE-then-PLACE pass, not arithmetic on a constant, because the thing it has to
  // line up against — how tall a card actually is — is decided by the browser: a wrapped name
  // makes a card taller, a "Winners to be decided" card is shorter than a two-name one, and a
  // bye placeholder is shorter again. One measurement pass over the whole bracket, then one
  // write pass of margins; each card's ACTUAL top is carried forward, so rounding cannot
  // accumulate down a column.
  //
  // Placement is by MARGIN, not by absolute positioning, so every column keeps its natural
  // height and the row of columns still stretches to the tallest — nothing has to be told how
  // tall it is. A card is never allowed above the bottom of the card before it, so an
  // impossible draw crowds rather than overlaps.
  //
  // ⚠ It reads geometry, so it needs the tab ON SCREEN. `render()` calls `setMode` before
  // `renderBracket`, so it is; if it ever is not, the measurement reads zero and the function
  // returns, leaving the plain stacked column the CSS gap already gives. Wrong-but-readable
  // beats a collapsed column.
  // BRACKET-2 (Operator, 8/20) — MAKE THE ROUNDS FIT THE SCREEN THAT IS ACTUALLY THERE.
  //
  // The shipped stylesheet floors an elimination column at 200px, which is right for a draw of
  // three or four rounds and impossible for one of seven: 7 x 200 + 6 gaps = 1,472px against a
  // panel that measures 1,222px at 1280x900 and 966px at 1024x900. So the floor is overridden
  // per bracket, from the panel's OWN measured width, and only downward — a shallow draw keeps
  // the column it has always had and this function changes nothing about it.
  //
  // ⚠ IT READS THE PANEL, NEVER THE WINDOW. `clientWidth` is what is left after the scrollbar,
  // the padding and whatever else the layout is doing, which is the only number that answers
  // "does this fit"; deriving it from `window.innerWidth` would be the same guess-from-a-
  // constant mistake `seamLayout` exists to have corrected.
  //
  // ⚠ THE FLOOR IS REAL AND IT IS A STATED TRADE. Below `BK_MIN` a card cannot hold a name and
  // a slot line without turning into a column of single words, so the bracket keeps that width
  // and the panel scrolls instead. An unreadable draw sheet that fits is worse than a readable
  // one that does not, and the divisions this can reach are named in the build's own report
  // rather than left to be found on a screen.
  var BK_MIN=132, BK_GAP_MIN=6;
  function fitColumns(host, bk, n){
    if(!n) return;
    var avail=host.clientWidth;
    if(!avail) return;                                   // off screen: nothing to measure
    var cs=window.getComputedStyle(bk), gap=parseFloat(cs.columnGap||cs.gap||0)||0;
    var pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
    var each=Math.floor((avail - pad - gap*(n-1))/n);
    if(!(each>0)) return;
    // THE GAP GOES BEFORE THE CARD DOES. When the draw is too deep to fit at the legibility
    // floor, the space between columns is spent first — it is empty, and the card is the thing
    // the TD is reading. Measured: the seven-round draw needed 998px of a 966px panel at
    // 1024x900 and fits exactly once its gaps come in from 12px to 6px, with the card still at
    // its floor. The gaps never widen, so a shallow draw keeps the spacing it shipped with.
    if(each < BK_MIN && n > 1){
      var tight=Math.max(BK_GAP_MIN, Math.floor((avail - pad - BK_MIN*n)/(n-1)));
      if(tight < gap){ bk.style.columnGap=tight+"px"; gap=tight;
                       each=Math.floor((avail - pad - gap*(n-1))/n); }
    }
    var w=Math.max(BK_MIN, each);
    // Only ever DOWNWARD: `min-width` is a floor, and raising it on a shallow draw would stretch
    // a three-round bracket across the whole panel — a change nobody asked for.
    if(w>=200) return;
    [].slice.call(bk.querySelectorAll(".bk-round")).forEach(function(c){
      c.style.minWidth=w+"px"; c.style.maxWidth=w+"px";
    });
  }
  // BRACKET-2 (8/20): ONE PASS OF THE PLACEMENT, at a given first-column gap. Returns the worst
  // CROWDING it had to do — how far, in pixels, the neediest card was pushed below its own seam
  // because the card above it was in the way — scaled back to the gap that would have prevented
  // it. Zero means every card landed exactly on its seam.
  function seamPass(cols, geo, GAP){
    var prev=null, deficit=0;
    cols.forEach(function(c, k){
      var g=geo[k], centres=[], cur=g.top;                    // `cur` = bottom of the card above
      c.kids.forEach(function(e, i){
        // The two cards feeding position i are positions 2i and 2i+1 of the column before it —
        // true by construction now that every column draws in draw order with its blanks in
        // place. A column with no feeder pair (the first, or a short one) simply stacks.
        var want=(prev && 2*i+1 < prev.length)
                 ? (prev[2*i] + prev[2*i+1])/2 - g.h[i]/2
                 : cur + (i ? GAP : 0);
        var m=Math.round(want - cur);
        // THE CLAMP, and now also the MEASUREMENT. A card is never allowed above the bottom of
        // the card before it, so an impossible column crowds rather than overlaps — but until
        // this build the crowding was silent, and a crowded card is a card off its seam.
        // Column k's spacing is 2^k times the first column's, so a shortfall of `d` there is
        // cured by `d / 2^k` of first-column gap: that is what is handed back.
        if(m < 0){ var need=(-m)/Math.pow(2, k); if(need > deficit) deficit=need; m=0; }
        e.style.marginTop=m+"px";
        var top=cur + m;                        // the ACTUAL top, carried forward — not `want`
        centres.push(top + g.h[i]/2);
        cur=top + g.h[i];
      });
      prev=centres;
    });
    return deficit;
  }
  function seamLayout(bk){
    var cols=[].slice.call(bk.querySelectorAll(".bk-round")).map(function(c){
      var sl=c.querySelector(".bk-slots");
      return {slots: sl, kids: [].slice.call(sl.children)};
    });
    if(!cols.length || !cols[0].kids.length) return;
    var bkTop=bk.getBoundingClientRect().top;
    // ONE read of the layout, before anything is written back to it.
    var geo=cols.map(function(c){
      return {top: c.slots.getBoundingClientRect().top - bkTop,
              h: c.kids.map(function(e){ return e.getBoundingClientRect().height; })};
    });
    if(!geo[0].h.length || !geo[0].h[0]) return;              // off screen: nothing to measure
    cols.forEach(function(c){ c.slots.style.gap="0px"; });    // margins own the spacing now
    // THE FIRST COLUMN'S GAP IS SOLVED FOR, NOT FIXED AT 4.
    //
    // The whole bracket's vertical rhythm hangs off one number: round 1 stacks at this gap, and
    // every later column's seam pitch is twice the one before it. So when a later card is too
    // tall to sit between its own feeders — which is what a narrower column does to a doubles
    // card carrying four names — the cure is to open round 1 up and lay out again, and there is
    // exactly one number to open.
    //
    // ⚠ IT IS A NO-OP WHERE NOTHING CROWDS. The first pass runs at the shipped gap of 4, and on
    // every case that fits — all 42 divisions at 1280x900, measured — it is the only pass and
    // writes exactly the margins BRACKET-1a wrote. This is a strict superset of that behaviour,
    // never a replacement for it, which is what lets the spacing authority take a new input
    // without re-opening what it already decided.
    //
    // Bounded, because a solver that cannot converge must still return a drawn bracket: each
    // round adds the shortfall the last one measured, and after the last attempt the bracket
    // keeps the best rhythm it found rather than looping. The cost of opening up is HEIGHT, and
    // a taller draw sheet is the right trade — a paper one is taller still.
    // ⚠ THE STEP IS A LOWER BOUND, WHICH IS WHY THIS ITERATES RATHER THAN SOLVING ONCE.
    // Dividing the shortfall by 2^k is exact for the usual case — a card crowded by the card
    // ABOVE IT, where what is short is the pitch between two seams. It UNDER-shoots for the
    // first card in a column, whose seam is an absolute position rather than a pitch: moving
    // that seam down by `d` needs the second feeder to move by `2d`, the opposite direction of
    // the same ratio. Rather than carry two formulas and pick between them, the step is kept
    // conservative and the loop is allowed the passes to converge — a pass re-measures nothing
    // (`geo` is read once, above) and is arithmetic plus a margin write, so the cheap thing is
    // the iteration and the expensive thing would have been the second formula.
    var GAP=4;
    for(var attempt=0; attempt<12; attempt++){
      var need=seamPass(cols, geo, GAP);
      if(need <= 0.5) break;                    // sub-pixel: every card is on its seam
      GAP += Math.max(2, Math.ceil(need) + 1);  // never stall on a sub-pixel shortfall
    }
  }

  function renderBracket(){
    var host=el("tableWrap"); host.innerHTML=""; var D=curDivObj();
    if(!D){ host.innerHTML='<div class="empty-note">No division selected.</div>'; return; }
    if(D.fmt!=="rr"){ var bk=document.createElement("div"); bk.className="bk";
      // Draw-sheet layout: the round LABEL sits outside the distribution flow. It used to be
      // a flex child of the same space-around column, so it claimed an equal share — one
      // ninth of a round-of-16 column but a half of the final's — which is what tipped each
      // successive round further down the page. With the label lifted out, every round's slot
      // area starts at the same height, which is what lets a card be placed against a card in
      // the column beside it at all. (The distribution that used to do the centring here —
      // `space-around`, then a fixed padding-and-gap step — is gone; `seamLayout` does it, and
      // does it by measurement.)
      // BRACKET-1a (Operator, 8/17, issue 1): SPACING IS MEASURED, NEVER ASSUMED — see
      // `seamLayout` below, which runs once the column is on the screen.
      // What this replaced: the offset of each column was `min(2^ri, CAP) * UNIT`, a doubling
      // step off a CONSTANT 78px. That arithmetic is exact if and only if every card is 74px
      // tall. Real cards are not: a round-1 card carrying two names and a slot line measured
      // 96.4px, one with a wrapped name 117.2px, a later round's "Winners to be decided" card
      // 76px, and a bye placeholder 76px — 60 of the rendered columns carried MIXED heights,
      // so no single padding-and-gap pair could ever have put every card on its seam. Measured
      // before the change: 92 columns off their seam across all 42 divisions, worst 662.6px,
      // the error GROWING down each column (the second column's four cards ran −21 · −69 ·
      // −128 · −170 on the Operator's own division). `UNIT` and `CAP` are retired with the
      // arithmetic they served — decision 3's cap was a bound on a multiplier that no longer
      // exists, and the fourth column it bought is now correct for the same reason every other
      // column is.
      // BRACKET-2 (Operator, 8/20): THE WHOLE DRAW, IN ONE VIEW.
      //
      // What this replaced: a FOUR-ROUND WINDOW with a `‹ earlier / later ›` stepper
      // (CUI-3 ruling 19, kept at EDIT-VIEWONLY 8/13). Measured at this build on the committed
      // field: 14 of the 42 elimination divisions run deeper than four rounds — 8 at five, 5 at
      // six, 1 at seven — so a third of the draw sheets could not be seen whole, which is the
      // one thing a draw sheet is for. The window is gone; every round renders.
      //
      // ⚠ THE WIDTH IS THE WHOLE PROBLEM, and it is solved by MEASUREMENT rather than by a
      // constant — `seamLayout`'s own lesson, one column over. The shipped floor is a 200px
      // column, and seven of those plus their gaps is 1,472px against the 1,222px the panel
      // actually offers at 1280x900 and 966px at 1024x900, so honouring it would hand back the
      // side-scroll EDIT-VIEWONLY spent a build removing (27 of 42 divisions → 0). Instead the
      // column width is DIVIDED OUT of the width really available, down to a legibility floor;
      // below that floor the bracket scrolls rather than printing something unreadable, which
      // is a trade stated in the open rather than discovered on a screen.
      var all=D.rounds||[], rounds=all;
      rounds.forEach(function(R, ri){ var col=document.createElement("div"); col.className="bk-round";
        var rn=document.createElement("div"); rn.className="rname"; rn.textContent=R.name; col.appendChild(rn);
        var slots=document.createElement("div"); slots.className="bk-slots";
        // EDIT-VIEWONLY (item 1, ruled 8/12): the byes. A round `r` of a draw whose deepest
        // round is `rmax` has 2^(rmax-r) pairings; `R.ids` carries the ones that were actually
        // placed, and a bye pairing has no placement, so it has no id and the column used to
        // draw nothing there. The difference is drawn as non-interactive placeholders — the way
        // a paper draw sheet leaves an unplayed pairing — so the column reads as a full round.
        // ⚠ `ri` WAS the index inside the four-round window and needed an anchor added to it to
        // reach the round's absolute depth. With the whole draw on screen the index IS the
        // depth (BRACKET-2), so the anchor is gone from the arithmetic rather than left at a
        // constant zero that a later reader would have to prove harmless.
        // Σ across the field = the plan's own bye count (275 on the 2026 field, asserted in
        // `tests/editvo1_viewonly.py` part C and again in `tests/bracket1_draworder.py` part
        // B) — the identity is what makes the count a contract rather than a styling choice.
        //
        // BRACKET-1 (Operator 8/17): POSITION is now EXACT. The column walks its draw positions
        // 1..2^(rmax-r) in order and asks each one what fills it — the placed match whose id
        // carries that number, or a placeholder. The engine mints ids in draw order, so the
        // match number IS the draw position (`ELIM_ID` above is the same parse `feedersOf`
        // runs), and `editor_plan._divisions` now hands `R.ids` over already sorted by it. What
        // this replaced: the round drew its real boxes in the order the plan listed them —
        // schedule order — and appended every blank at the foot, so Match 5 drew last because
        // it started last and 232 of the 275 blanks sat somewhere other than their own slot.
        // The COUNT is untouched: `missing` is the same arithmetic it always was, so the Σ
        // identity holds whatever the data does. An id that does not parse, repeats a number or
        // falls outside the round cannot be dropped — it draws at the foot, after the walk.
        var cap=Math.pow(2, all.length-1-ri);
        var missing=Math.max(0, cap - R.ids.length);
        var atPos={}, extra=[];
        R.ids.forEach(function(id){
          var g=ELIM_ID.exec(String(id||"")), k=g?+g[3]:0;

        bk.appendChild(col); }); host.appendChild(bk);

    } else { var teams=D.teams||[], tbl=document.createElement("table"); tbl.className="rr-table";
      var head="<tr><th></th>"+teams.map(function(t){return "<th>"+esc(t)+"</th>";}).join("")+"</tr>", rows="";
      teams.forEach(function(rt,ri){ rows+="<tr><th>"+esc(rt)+"</th>"; teams.forEach(function(ct,ci){ if(ri===ci){rows+='<td class="self"></td>';}
        else { var m=rrMatch(D,rt,ct); rows+='<td class="rr-cell'+(m&&m.id===st.selMatch?" sel":"")+'" data-id="'+(m?m.id:"")+'">'+(m?esc(rrCellText(m)):"·")+'</td>'; } }); rows+="</tr>"; });
      tbl.innerHTML=head+rows; host.appendChild(tbl);

      var cap=document.createElement("p"); cap.className="rr-caption"; cap.textContent="Round-robin — each team plays every other once."; host.appendChild(cap);
      // The cross-table shows the STRUCTURE; the strip below carries the same editable boxes

      // than being a read-only special case.
      var ids={}; st.matches.concat(st.unplaced).forEach(function(m){ if(m.div===D.name) ids[m.id]=1; });
      var list=Object.keys(ids).sort();
      if(list.length){
        var strip=document.createElement("div"); strip.className="bk-strip";

  }
  // RR-FRIENDLY (2026-08-13, call 1 option 1 — Operator ruling): what a cross-table cell SAYS.
  // It used to print the raw match id, which is the engine's diagnostic string and on a doubles
  // group 50 characters of USTA numbers — the last visible-id surface on the console, and the
  // whole of the 8/11 record's item 3. The cell now reads the match's when-and-where in the
  // vocabulary the strip cards below the grid already carry (`bracketBox`'s own slot line), so
  // a whole group's schedule reads along a team's row instead of one match at a time.
  //   ⚠ THE ID LEFT THE TEXT, NEVER THE DOM. It still rides `data-id` on every filled cell —
  //   that is what the click handler binds on and what `subfix1_side_model` parts C and F
  //   resolve all 90 cells by.
  // The location guard is `bracketBox`'s own, reused rather than re-invented: this field places
  // all 45 round-robin matches, but an unplaced one has no slot to name and "undefined ·
  // undefined" would be a worse cell than the id was.
  function rrCellText(m){
    return m.location ? (fmtDay(m.day)+" · "+m.start+" · "+m.location) : "waiting for a slot"; }
  // SUBFIX-1 (B): a cell is resolved by the team's MEMBERS, never by its printed label. The
  // labels in `D.teams` come from `Team.label()` (`scheduler_multi.py:49`), which is
  // `"/".join(members)` — so asking whether a single player's name contains the whole label is
  // structurally incapable of matching a doubles team, and every doubles cell rendered blank
  // and unclickable: 24 of 90 cells resolved, all 66 doubles cells dead across 7 of 9 groups.
  // A singles label is one name and splits to itself, so the singles path is the test it always
  // was (12 of 12 in both singles groups, before and after). Containment is kept PER MEMBER —
  // the same test the singles path already passes — rather than widened to an equality that
  // would newly refuse a label the roster join spells differently.
  function rrMatch(D,ta,tb){ var all=st.matches.concat(st.unplaced).filter(function(m){return m.div===D.name;});
    return all.filter(function(m){ function has(s){return String(s).split("/").every(function(mem){
      return m.players.some(function(p){return p.indexOf(mem)>-1;}); });} return has(ta)&&has(tb); })[0]; }

  // ---- by-player view (read-only): search a player, see their day (time/location/division/opponent) ----
  function allPlayers(){
    var s={}; st.matches.concat(st.unplaced).forEach(function(m){ (m.players||[]).forEach(function(p){ if(isReal(p)) s[p]=1; }); });

  function playerDayMatches(name){
    return st.matches.filter(function(m){ return m.day===st.day && (m.players||[]).indexOf(name)>-1; })
                     .sort(function(a,b){ return hhmm2min(a.start)-hhmm2min(b.start); });
  }
  function playerConflict(m, rows){   // overlap or <MIN_S2S against this player's own other matches
    for(var i=0;i<rows.length;i++){ var x=rows[i]; if(x.id===m.id) continue;
      var s=hhmm2min(m.start), e=endMin(m), xs=hhmm2min(x.start);
      if(overlap(s,e,xs,endMin(x))) return {kind:"dbl", other:x};
      if(Math.abs(xs-s)<MIN_S2S) return {kind:"rest", other:x};
    } return null;
  }
  // CUI-3: this hand-rolled the same span as `nameHtml` and carried no seed, so it silently missed
  // every field the card renderer gained. It calls the canonical renderer now — one card vocabulary,
  // three surfaces.
  function oppHtml(m, name){
    // CARD-1: on a doubles row the PARTNER is not an opponent. Comma-joining them into the same
    // list is this view's version of the four-opponents bug — the reader cannot tell which of
    // the three names is on their side.
    var s=sidesOf(m);
    if(s){
      var mine = s[0].indexOf(name)>-1 ? s[0] : (s[1].indexOf(name)>-1 ? s[1] : null);
      if(mine){
        var other=(mine===s[0])?s[1]:s[0];
        var partner=mine.filter(function(p){ return p!==name && isReal(p); });
        var parts=[];
        if(partner.length) parts.push('<span class="pt">with</span> '+sideHtml(m.div, partner));
        parts.push(other.length
          ? '<span class="vs">v</span> '+sideHtml(m.div, other)
          : '<span class="bwait">'+esc(awaitingLabel(m)||"awaiting an opponent")+'</span>');
        return parts.join(" ");
      }
    }
    var opp=(m.players||[]).filter(function(p){ return isReal(p) && p!==name; });
    if(!opp.length) return esc(m.label||"—");
    return opp.map(function(p){ return nameHtml(m.div, p); }).join(", ");
  }

  // ---- F6: entered-but-not-in-draw panel (current division) + no-draw divisions ----
  // ROSTER-1: the panel is keyed on the PARENT division. A round-robin division is scheduled as

  // division name never matched for any RR division — 9 group panels affirmatively printed

  // parent showed up in the no-draw block as if it had never printed a bracket.
  function ndParent(name){ var i=String(name||"").indexOf(" — "); return i<0?String(name||""):String(name).slice(0,i); }
  function ndCard(c){
    var d=document.createElement("div"); d.className="nd-card";

    var sw=document.createElement("div"); sw.className="nd-why";

  // CUI-2 patch: the board's scroll region is sized against the locked band, so the frozen
  // header row sits exactly under it at any window size or wrap of the toolbar.
  function syncStickyHeight(){
    var b=document.querySelector(".stickytop"); if(!b) return;
    document.documentElement.style.setProperty("--stickyH", b.offsetHeight+"px");
  }
  window.addEventListener("resize", syncStickyHeight);

  // BRACKET-1a: the seams are measured, so they have to be RE-measured when the measurement
  // changes. A narrower window wraps a name, which makes a card taller, which moves every seam
  // above it. Nothing overlaps if this never ran — the cards stay in normal flow — but the
  // bracket would quietly stop reading true until the next click, which is the whole defect
  // this build exists to end. It re-places on the bracket that is already there rather than
  // rebuilding it: `seamLayout` reads card heights and column tops, neither of which its own
  // margins affect, so running it again is idempotent. Debounced, because a drag-resize fires
  // this continuously and the deepest draw is 5,385px of bracket.
  var bkReflow;
  window.addEventListener("resize", function(){
    if(st.view!=="bracket") return;
    clearTimeout(bkReflow);
    bkReflow=setTimeout(function(){
      var bk=el("tableWrap").querySelector(".bk");
      if(bk) seamLayout(bk);
    }, 120);
  });

  // CUI-2 patch: the block can be folded away once copied, so it stops occupying the screen.
  // It opens EXPANDED — you emit in order to copy, and hiding it at that moment fights the task.
  function showToggle(open){
    var t=el("outToggle"); if(!t) return;
    t.hidden=false; t.textContent=open?"Hide this block":"Show the block";
    t.setAttribute("aria-expanded", open?"true":"false");
  }
  el("outToggle").addEventListener("click", function(){
    var open=el("out").classList.toggle("show");
    showToggle(open);
    announce(open?"Block shown.":"Block hidden.");
  });

  // -------------------------------------------------------------------------
  // CUI-2 — copy that tells the truth. Both programmatic paths are checked; when
  // they fail (a sandboxed artifact frame blocks each of them) the text is
  // selected on the page so the reader can copy it with the keyboard.
  // -------------------------------------------------------------------------
  function legacyCopy(txt){
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    return ok===true;
  }
  function copyKey(){ return (navigator.platform||"").indexOf("Mac")>-1 ? "⌘ C" : "Ctrl + C"; }
  el("copyBtn").addEventListener("click", function(){
    var o=el("out");
    if(!o.textContent){ o.textContent=JSON.stringify(emitDoc(),null,2); o.classList.add("show"); }
    var txt=o.textContent, btn=this;
    function done(){ btn.textContent="Copied"; announce("Copied to the clipboard."); setTimeout(function(){ btn.textContent="Copy"; },1600); }
    function manual(){
      try{
        var r=document.createRange(); r.selectNodeContents(o);
        var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        o.classList.add("selected");
        flashWarn("Press "+copyKey()+" to copy — your changes are selected above.");
      }catch(e){ flashWarn("Select the block above and copy it."); }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ if(legacyCopy(txt)) done(); else manual(); });
    } else if(legacyCopy(txt)){ done(); } else { manual(); }
  });

  // CUI-1: paste-path load handlers removed — the plan is embedded at generation (SAMPLE above).

  // EC-1: the Unplaced dock is a drop target — drop a placed card here to hold (unplace) it.
  (function(){ var tray=el("tray"); if(!tray) return;
    tray.addEventListener("dragover", function(e){ if(st && st.dragId && st.matches.some(function(x){return x.id===st.dragId;})){ e.preventDefault(); e.dataTransfer.dropEffect="move"; tray.classList.add("drop-ok"); } });
    tray.addEventListener("dragleave", function(e){ if(e.target===tray) tray.classList.remove("drop-ok"); });
    tray.addEventListener("drop", function(e){ e.preventDefault(); tray.classList.remove("drop-ok"); var m=st.matches.filter(function(x){return x.id===st.dragId;})[0]; if(m) holdMatch(m); });
  })();

  loadPlan(clone(SAMPLE)); render();
})();
</script>
