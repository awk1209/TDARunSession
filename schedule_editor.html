<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit the schedule</title>
<style>
  :root{
    /* ===== HOUSE-STYLE TOKENS (shared; the Setup console adopts these verbatim) ===== */
    /* palette */
    --paper:#E7EAE8; --panel:#FCFDFC; --ink:#14201B; --muted:#5C6B63;
    --line:#D2D8D4; --line-2:#E1E6E2; --field:#fff;
    --court:#1F6E55; --court-d:#16523D;
    --red:#A8323F; --red-bg:#F6EBEC; --red-line:#E3C4C8;
    --amber:#9C5F0E; --amber-bg:#F7F0E3; --amber-line:#E6D6B6;
    --blue:#246486; --blue-bg:#E8F0F4; --blue-line:#C7DBE5;
    /* type scale — CUI-2: light-mode-only house style, one step larger throughout */
    --fs-2xl:28px; --fs-xl:23px; --fs-lg:19px; --fs-md:17px; --fs-base:16px; --fs-sm:14px; --fs-xs:12px;
    --fs-mono:15px; --fs-mono-sm:13px;
    /* CUI-2 patch (Operator review) — the drag-drop board runs on its OWN scale, tuned for
       how much schedule fits on screen at once. The surrounding chrome keeps the larger
       reading sizes above; only the grid is dense. Adjust these four to retune density. */
    --grid-fs:12.5px; --grid-fs-sm:11px; --grid-fs-xs:10px;
    --grid-cell-w:172px; --grid-win-w:60px;
    /* spacing + radius */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --radius:7px;
    /* families */
    --sans: Arial, Helvetica, sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    /* ===== end HOUSE-STYLE TOKENS ===== */
  }
  /* CUI-2: dark mode retired — these pages publish as artifacts and print; one
     predictable light appearance everywhere beats a theme that follows the reader. */
  *{box-sizing:border-box}
  html,body{margin:0; max-width:100%}
  body{font-family:var(--sans); color:var(--ink); background:var(--paper); font-size:var(--fs-base); line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden}
  .wrap{max-width:none; margin:0 auto; padding:0 28px 40px}

  /* CUI-2 patch (Operator review): the controls you steer with stay put while the board
     scrolls — header, view tabs and the warning bar travel as one locked band. The emitted
     block is deliberately NOT in it; it is the tall element and it collapses instead. */
  .stickytop{position:sticky; top:0; z-index:30; background:var(--paper); padding-bottom:6px; box-shadow:0 6px 14px -8px rgba(20,32,27,.35)}
  header{background:var(--paper); padding:7px 0 5px}
  .hbar{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  h1{font-size:var(--fs-md); letter-spacing:.02em; margin:0; font-weight:700; color:var(--court-d); white-space:nowrap}
  .badge{display:none}   /* the schema name is not what the reader needs in prime position */
  .subtitle{font-size:var(--fs-sm); color:var(--muted); margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* ---- status counts: plain inline text, no chrome. Borders and pill backgrounds on four
     always-zero counters were pure decoration costing a whole row. ---- */
  .statusstrip{display:inline-flex; gap:12px; flex-wrap:wrap; margin:0; margin-left:auto}
  .chip{display:inline-flex; align-items:baseline; gap:4px; padding:0; border:0; background:none}
  .chip .clab{color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-size:var(--fs-xs)}
  .chip .cval{font-family:var(--sans); font-size:var(--fs-sm); font-weight:700; color:var(--muted)}
  .chip.ok .cval{color:var(--court-d)}
  .chip.bad{border-color:var(--red-line); background:var(--red-bg)} .chip.bad .cval,.chip.bad .clab{color:var(--red)}
  .chip.warn .cval{color:var(--amber)}
  .chip.zero .cval{color:var(--muted)}

  /* ---- progressive disclosure: load-plan + issues ---- */
  .loadwrap{margin:12px 0 0}
  .loadwrap>summary{list-style:none; display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-family:var(--sans); font-size:var(--fs-sm); letter-spacing:.08em; text-transform:uppercase; color:var(--court-d); padding:5px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); user-select:none}
  .loadwrap>summary::-webkit-details-marker{display:none}
  .loadwrap>summary:hover{border-color:var(--court)}
  .loadwrap>summary::before{content:"+"; font-weight:700}
  .loadwrap[open]>summary::before{content:"\2212"}
  .intake{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px}
  .intake label{display:block; font-family:var(--sans); font-size:var(--fs-sm); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .intake textarea{width:100%; max-width:100%; min-height:64px; resize:vertical; padding:9px 10px; font-family:var(--sans); font-size:var(--fs-mono); color:var(--ink); border:1px solid var(--line); border-radius:6px; background:var(--field)}
  .intake-row{display:flex; gap:9px; margin-top:9px; flex-wrap:wrap; align-items:center}
  .intake .note{font-family:var(--sans); font-size:var(--fs-sm); color:var(--muted)}
  .intake .err{color:var(--red); font-family:var(--sans); font-size:var(--fs-sm); display:none}

  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0}
  .toolbar .lbl{font-family:var(--sans); font-size:var(--fs-sm); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .daytabs{display:flex; gap:6px; flex-wrap:wrap}
  .daytab{font-family:var(--sans); font-size:var(--fs-sm); padding:6px 11px; border-radius:var(--radius); cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
  .daytab:hover{border-color:var(--court)}
  .daytab:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
  .daytab.active{background:var(--court); color:#fff; border-color:var(--court)}
  /* PLAYER-SNAP (ruled 8/13) — THE BY-PLAYER TAB LEAVES THE SCREEN. The 8/11 record's item 6
     asked for an auto-snap to a selected player's earliest match; the Operator later ruled
     "hide it" instead, and the later ruling wins — the snap was measured and NOT built, and
     the record's item 6 is SUPERSEDED. Deprecate, do not delete: this ONE rule is the whole
     switch. The button and its handler, `renderByPlayer` and its entire call chain
     (`allPlayers`, `renderPlayerList`, `playerDayMatches`, `playerConflict`, `oppHtml`), both
     `playerSearch` handlers, the `playerGroup` chrome and every `st.view==="player"` branch
     all stay byte-for-byte and keep working behind the hide — a post-MVP build lifts this rule
     and the view returns in the state it shipped in.
     ⚠ HIDE, NOT DELETE, FOR A MEASURED REASON: `r4_editor`, `card1_teams` and
     `subfix1_side_model` use this view as the CHECKING SURFACE for other shipped features
     (seeds on the opponent column, doubles partner-vs-opponent rendering, a substitution's new
     name reaching every surface). Deleting it would strip all three of their surface. Their
     drives are JS clicks, which work on hidden elements exactly as they do on `#subPanel`. */
  #viewPlayer{display:none}
  .divpick{font-family:var(--sans); font-size:var(--fs-md); padding:7px 9px; border:1px solid var(--line); border-radius:var(--radius); background:var(--field); color:var(--ink); min-width:220px; max-width:100%}
  /* CUI-3 (ruling 19): 51 divisions in a native select is type-ahead only — this narrows it. */
  .divfilter{font-family:var(--sans); font-size:var(--fs-md); padding:7px 9px; border:1px solid var(--line); border-radius:var(--radius); background:var(--field); color:var(--ink); min-width:150px; max-width:100%}
  .navbtn{font-family:var(--sans); font-size:var(--fs-lg); padding:5px 11px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer}
  .navbtn:hover{border-color:var(--court)}
  .spacer{margin-left:auto}
  button{font-family:var(--sans); cursor:pointer; border-radius:var(--radius); font-size:var(--fs-md); font-weight:600; border:1px solid transparent; padding:8px 14px}
  button:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
  .btn-primary{background:var(--court); color:#fff} .btn-primary:hover{background:var(--court-d)}
  .btn-ghost{background:transparent; color:var(--court-d); border:1px solid var(--line)} .btn-ghost:hover{border-color:var(--court)}
  .btn-sm{font-size:var(--fs-sm); padding:6px 11px}

  /* ---- venue-as-tab (narrow screens only) ---- */
  .venuetabs{display:none; gap:6px; flex-wrap:wrap; margin:0 0 12px}
  .venuetabs .lbl{font-family:var(--sans); font-size:var(--fs-xs); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); align-self:center}
  .venuetab{font-family:var(--sans); font-size:var(--fs-sm); padding:6px 11px; border-radius:var(--radius); cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
  .venuetab:hover{border-color:var(--court)}
  .venuetab.active{background:var(--court); color:#fff; border-color:var(--court)}

  /* CUI-2 patch: the board fills the screen even when a division is small. It used to sit in
     the top-left of an otherwise blank page, with a handful of matches squeezed into a corner
     while most of the display went unused. Stretching the panel gives sparse divisions large,
     easy drop targets instead of a cramped block. */
  .layout{display:grid; grid-template-columns:1fr 400px; gap:16px; align-items:stretch;
          min-height:calc(100vh - var(--stickyH, 200px) - 26px)}
  @media (max-width:1000px){ .layout{grid-template-columns:1fr} }
  .layout>*{min-width:0}   /* let grid tracks shrink; wide table/bracket scroll inside their own overflow:auto */
  /* CUI-2 patch: the side column scrolls on its own too, so the page stops growing to several
     thousand pixels and the board stays where you left it. */
  /* CUI-2 patch: the side column is a flex column with a height cap, so its children were
     being SHRUNK to nothing and then clipped by overflow:hidden — that is what crushed the
     panels to 22px and hid the bracket entirely. Panels now hold their natural height, each
     panel body scrolls on its own, and the bracket takes the slack. */
  /* ISSUES-1 (D2 option 2, Operator ruling 8/17): the column SCROLLS. It used to clip with
     `overflow:hidden` and no scrollbar, so a panel past the bottom edge was not below the fold
     — it was unreachable, at every scroll position, forever. Measured on the shipped console at
     1024x900, that put the Issues list's own box 159.5px outside the column and lost 154px of
     list on 122 of the 203 (division, day) pairs. The panel caps below are per panel and stay;
     the clip is what is lifted, and nothing in a scrolling column can be out of reach.
     ⚠ The height cap itself is load-bearing and untouched: the column ends where the screen
     does, which is what keeps the board on screen. */
  .side{max-height:calc(100vh - var(--stickyH, 200px) - 26px); overflow-y:auto; min-height:0}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; min-width:0;
         display:flex; flex-direction:column; min-height:0; flex:0 0 auto; overflow:hidden}
  /* the side panels sit at their natural height at the top of the column. (The rule that let
     the last panel absorb the slack existed for the bracket, which now has its own view —
     leaving it in stretched an empty Issues box down the whole screen.) */
  .side{justify-content:flex-start}
  .panel h3{flex:0 0 auto; font-size:var(--fs-sm); letter-spacing:.04em; text-transform:uppercase; margin:0; padding:7px 12px; color:var(--court-d); border-bottom:1px solid var(--line-2); font-weight:700}
  /* CUI-2 patch: the board gets its own scroll region, sized to what is left of the screen
     under the locked band. That is what lets the time/venue header row freeze (it sticks
     inside THIS box), and it stops the page itself growing to 4,700px. */
  #tableWrap{overflow:auto; max-width:100%; max-height:calc(100vh - var(--stickyH, 200px) - 26px); height:100%}
  #mainPanel{display:flex; flex-direction:column; min-height:0}
  /* a short board stretches its rows to fill rather than leaving the screen blank below */
  #tableWrap .sched{min-height:100%}

  /* ---- CUI-5 (OI-53, §15 D3 option 2) · the foldable side panels ----
     Three panels gain the ▸/▾ caret the Issues panel has had since CUI-2: "Where can this go?",
     "Substitute a partner" and "Entered, but not in a draw". All three open BY DEFAULT — the
     pool panel exists so the 63 entered-but-not-drawn people cannot vanish, and shipping it
     collapsed would undo the reason it was built.
     The fold is the lever for the measured complaint, not a decoration: the two `.suggest-body`
     panels cap at 34vh EACH, which is 68vh between them, so at 1280x900 with a doubles card
     selected only 2 of the 4 panels below the pool sit fully inside the column (at 1280x1440
     all 4 do — the column is over-subscribed by the cap family, not by any one panel).
     Measured at CUI-5: folding "Substitute a partner" returns 306px and takes that 2 to 3;
     folding both suggest panels returns 321px and all 4 fit. Open, the wrapper costs nothing —
     the column's content is 953px before and after the conversion. Shrinking the caps was
     rejected: that shuffles the complaint — every panel gets shorter so all four fit badly —
     instead of fixing it.
     Styled to match `.panel h3`, which these summaries replace, so the column still reads as
     one design; `.issues-panel` keeps its own larger heading. */
  .fold-panel>summary{list-style:none; cursor:pointer; user-select:none; display:flex; align-items:center; gap:7px; flex:0 0 auto; font-size:var(--fs-sm); letter-spacing:.04em; text-transform:uppercase; margin:0; padding:7px 12px; color:var(--court-d); border-bottom:1px solid var(--line-2); font-weight:700}
  .fold-panel>summary::-webkit-details-marker{display:none}
  .fold-panel>summary::before{content:"\25B8"; font-size:.8em; color:var(--muted)}
  .fold-panel[open]>summary::before{content:"\25BE"}
  .fold-panel>summary:hover{color:var(--court)}

  /* ---- issues panel (collapsible) ---- */
  .issues-panel>summary{list-style:none; cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; font-size:var(--fs-lg); letter-spacing:.08em; text-transform:uppercase; padding:11px 14px; color:var(--court-d); border-bottom:1px solid var(--line-2); font-weight:700}
  .issues-panel>summary::-webkit-details-marker{display:none}
  .issues-panel>summary::before{content:"\25B8"; font-size:.8em; color:var(--muted)}
  .issues-panel[open]>summary::before{content:"\25BE"}
  .issues-panel>summary:hover{color:var(--court)}
  #issuesHead.hot{color:var(--red)}

  /* ---- time-rows schedule table ---- */
  /* fixed layout so the venues divide the width evenly and all of them stay on screen —
     under auto layout the 2-up cards pushed each column to ~740px and forced a sideways
     scroll, which defeats the point of seeing the whole board. */
  .sched{width:100%; table-layout:fixed; border-collapse:collapse; background:var(--panel)}
  .sched th, .sched td{border:1px solid var(--line-2); vertical-align:top; text-align:left}
  /* the time/venue header row freezes; the time column freezes across a sideways scroll */
  .sched thead th{position:sticky; top:0; background:var(--panel); z-index:3; padding:5px 7px; font-family:var(--sans); font-size:var(--grid-fs); color:var(--court-d)}
  .sched thead th.thwin{left:0; z-index:5}
  .sched thead th .cap{font-size:var(--grid-fs-xs); color:var(--muted); font-weight:400}
  .sched .thwin{width:var(--grid-win-w)}
  .sched col.cwin{width:var(--grid-win-w)}
  .sched col.cempty{width:76px}                       /* a venue with nothing on it this view */
  .sched thead th.empty{color:var(--muted); font-weight:400}
  .sched td.win{position:sticky; left:0; z-index:2; font-family:var(--sans); font-size:var(--grid-fs); font-weight:700; color:var(--ink); padding:6px 6px; width:var(--grid-win-w); background:var(--paper); white-space:nowrap}
  .sched td.cell{padding:3px 4px; min-width:var(--grid-cell-w)}
  /* CUI-2 patch: cards flow across the cell instead of one per line. With three venues on a
     wide screen each column is ~470px, so this roughly doubles what fits without shrinking
     anything further. Scoped to the board — the tray and bracket keep full-width cards. */
  .sched td.cell .mcard{display:inline-block; vertical-align:top; width:calc(50% - 4px); margin-right:3px}
  @media (max-width:1250px){ .sched td.cell .mcard{width:100%; margin-right:0} }
  .sched td.cell.overcap{background:var(--red-bg)}
  .cellcap{font-family:var(--sans); font-size:var(--fs-xs); color:var(--muted); margin-bottom:5px}
  .cellcap.over{color:var(--red); font-weight:700}
  .empty-note{font-family:var(--sans); font-size:var(--fs-base); color:var(--muted); padding:28px 12px; text-align:center}

  /* ---- match card ---- */
  .mcard{border:1px solid var(--line); border-left:3px solid var(--court); border-radius:5px; padding:3px 6px; background:var(--field); margin-bottom:3px}
  .mcard.rr{border-left-color:var(--blue)}
  .mcard.sel{outline:2px solid var(--blue); outline-offset:1px}
  .mcard.hard{border-left-color:var(--red); background:var(--red-bg)}
  .mcard:hover{border-color:var(--court)}
  .mcard .mtop{display:flex; justify-content:space-between; gap:6px; align-items:baseline}
  .mcard .mtime{font-family:var(--sans); font-size:var(--grid-fs-sm); font-weight:700; color:var(--court-d)}
  .mcard .mday{font-family:var(--sans); font-size:var(--grid-fs-xs); color:var(--blue); background:none; border:0; border-radius:0; padding:0}
  /* The engine's match id is never shown. It is diagnostic, and for a round-robin doubles
     match it is built from USTA player numbers
     (E48-M1-919414115+921354808v10763848+10867268) — not something to put in front of a
     tournament director. It stays in the DOM and in the emitted block; it is simply not
     rendered. Cards carry data-mid for tests and debugging. */
  .mcard .mid, .bk-match .bid{display:none !important}
  /* CONSOLE-2 · 6b: the round and match number DO render — they are the draw's own vocabulary,
     not the engine's id. Muted and under the names, so the card still leads with who is playing. */
  .mcard .mround{font-family:var(--sans); font-size:var(--grid-fs-xs); color:var(--muted); margin-top:1px}
  .bk-match .bround{font-family:var(--sans); font-size:var(--fs-xs); color:var(--muted); margin-bottom:2px}
  .mcard .mwho{font-size:var(--grid-fs); font-weight:600; margin-top:1px; line-height:1.25}
  /* CUI-2 patch: the editing controls are the tallest thing on a card and are only needed on
     the card you are actually working. They appear on hover, focus, or selection — drag and
     select-then-tap-a-slot are both untouched, so nothing becomes unreachable. */
  .mcard .medit{display:none; gap:5px; margin-top:4px; flex-wrap:wrap; align-items:center}
  .mcard:hover .medit, .mcard:focus-within .medit, .mcard.sel .medit{display:flex}
  .mcard .medit select{font-family:var(--sans); font-size:var(--grid-fs-sm); padding:1px 4px; border:1px solid var(--line); border-radius:4px; background:var(--field); color:var(--ink)}
  /* EC-1 drag-drop */
  .mcard{cursor:grab}
  .mcard:active{cursor:grabbing}
  .mcard.dragging{opacity:.4}
  .mcard .ntip{font-family:var(--sans); font-size:var(--grid-fs-xs); color:var(--muted)}
  .sched td.cell.drop-ok{outline:3px dashed var(--court); outline-offset:-3px}
  #tray.drop-ok{outline:3px dashed var(--red); outline-offset:-3px}
  /* CUI-3 · SLOT-SUGGEST: a candidate cell reuses the shipped drop-ok outline and adds its rank. */
  .sched td.cell.suggested{position:relative; background:rgba(31,110,85,.05)}
  .sugchip{position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%;
    background:var(--court); color:#fff; font-family:var(--sans); font-size:11px; font-weight:700;
    line-height:18px; text-align:center}
  .suggest-panel.hot{border-color:var(--court)}
  /* ELIG-1 (Part C, OI-50) · capped and scrolling like its siblings `.tray-items`/`.issues-list`
     below. The substitute pool is 63 rows on the committed field — a 5,205px body — and `.side`
     is a fixed-height column that CLIPS (`overflow:hidden`), so an uncapped panel did not push
     Changes-to-rekey / Waiting-for-a-slot / the pool panel / Issues below the fold, it put them
     5,000px outside a box with no scrollbar. Same 34vh as the others so the right-hand column
     reads as one design. */
  /* CONSOLE-2 · 6a#4: the body had NO horizontal padding while its own `<summary>` heading has
     12px (`.fold-panel>summary`), so every line in both side panels sat 12px outside the heading
     that named it. One rule, both panels — "Where can this go?" and Substitutes use this body. */
  .suggest-body{display:flex; flex-direction:column; gap:8px; padding:0 12px;
    overflow:auto; min-height:0; max-height:34vh}
  /* CONSOLE-2 · 6a#6: `.empty-note` is centred and used at 15 sites (bracket, by-player, the
     docks, the withdrawn view…). SCOPED to the two side panels, on the ruling — a global change
     would re-centre surfaces nobody complained about. */
  .suggest-body .empty-note{text-align:left; padding-left:0; padding-right:0}
  /* CONSOLE-2 · note 5: the pinned confirmation zone. It sits ABOVE the scrolling pool inside
     the same fold, takes only the height it needs, and never scrolls — the 34vh cap family
     (OI-50) governs the POOL ROWS, which is the list the cap exists for. Empty until a
     candidate is picked, so it costs the column nothing the rest of the time. */
  .sub-pinned{display:flex; flex-direction:column; gap:8px; flex:0 0 auto; padding:0 12px}
  .sub-pinned:not(:empty){padding-top:8px; padding-bottom:8px; border-bottom:1px solid var(--line-2)}
  /* EDIT-VIEWONLY (item 2, ruled 8/12) — ALL ON-SCREEN SUBSTITUTION IS OUT OF THE MVP.
     Substitutions are keyed in Tournament Desk after rekey, so the Substitutes panel is HIDDEN
     and SUBFIX-2 is retired. Deprecate, do not delete: this ONE rule is the whole switch. The
     panel's HTML (`open` attribute included, OI-53's ratified default), `renderSubstitute` and
     its entire call chain, the eligibility and gender guards and rule 49's console-side refusal
     all stay byte-for-byte and keep running into the hidden panel — a post-MVP build lifts this
     rule and the feature returns in the state it was ratified in.
     ⚠ HIDE, NOT DELETE, FOR A MEASURED REASON: `.suggest-body` above is ONE rule styling BOTH
     side panels, and it carries the 34vh cap that closed OI-50. Deleting this panel with its
     styling would strip that cap off "Where can this go?", which stays. */
  #subPanel{display:none}
  .suglist{display:flex; flex-direction:column; gap:6px}
  .sugrow{display:flex; align-items:center; gap:9px; padding:6px 8px; border:1px solid var(--line-2);
    border-radius:8px; background:var(--field)}
  .sugn{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
    border-radius:50%; background:var(--court); color:#fff; font-family:var(--sans); font-size:11px;
    font-weight:700; line-height:1; flex:0 0 auto}
  .sugwhere{font-family:var(--sans); font-size:var(--fs-sm); color:var(--ink); flex:1 1 auto}
  .sugfor{font-family:var(--sans); font-size:var(--fs-sm); color:var(--muted); overflow-wrap:anywhere}
  /* SWAP-1 · the swap rail sits under the slot list in the same panel (ruling 85 decision 4). */

  <!-- CUI-2 patch: one compact identity line. The old block spent 134px on a large title,
       a subtitle repeating what the grid already shows, and a row of bordered chips. -->
  <header>
    <div class="hbar">
      <h1>Edit Console</h1>
      <span class="subtitle" id="subtitle"></span>
      <span class="statusstrip" id="statusStrip"></span>
    </div>
  </header>

  <!-- CUI-1: the paste path is retired. This console ships PRELOADED — the run surface
       generates it with the schedule embedded (editor_plan.render_editor_console swaps the
       var SAMPLE line below). The operator never handles td-editor-plan/v1; only the emitted
       schedule-edits/v1 block travels back (B-1 intact). -->

  <div class="toolbar">
    <div class="daytabs" role="tablist" aria-label="View">
      <div class="daytab" id="viewOpening" role="tab" tabindex="0">By Venue</div>
      <div class="daytab" id="viewBracket" role="tab" tabindex="0">Bracket</div>
      <div class="daytab" id="viewDay" role="tab" tabindex="0">By day</div>
      <div class="daytab" id="viewPlayer" role="tab" tabindex="0">By player</div>
      <div class="daytab" id="viewWithdrawn" role="tab" tabindex="0">Withdrawn</div>
      <div class="daytab" id="viewWarnings" role="tab" tabindex="0">Change Check</div>
    </div>
    <span class="divgroup" id="divGroup">
      <button class="navbtn" id="divPrev" aria-label="Previous division">‹</button>
      <input class="divfilter" id="divFilter" type="search" placeholder="filter divisions…" aria-label="Filter divisions" autocomplete="off">
      <select class="divpick" id="divSel" aria-label="Division"></select>
      <button class="navbtn" id="divNext" aria-label="Next division">›</button>
    </span>
    <!-- ISSUES-1 (D4 placement 1, Operator ruling 8/17): the return sits beside the control it
         undoes. It is hidden until a jump has somewhere to return to, so it costs the pinned
         band nothing the rest of the time — and the band is the measured cause of issue 3, so
         that matters. It is OUTSIDE `.divgroup`, which is a folded `inline-grid` (ELIG-1 Part D)
         whose cells belong to the picker; a fifth child would land in that grid.
         ⚠ The pinned-strip placement inside the Issues panel was ruled OUT, not overlooked: the
         pane ships CLOSED, so a control living in it is invisible exactly when it is needed. -->
    <button class="backjump" id="backJump" type="button" hidden></button>
    <span class="warnbar" id="warnBar" role="status"></span>
    <span class="daygroup" id="dayGroup" style="display:none">
      <span class="lbl">Day</span><div class="daytabs" id="dayTabs"></div>
    </span>
    <span class="playergroup" id="playerGroup" style="display:none">
      <span class="lbl">Player</span>
      <input class="playersearch" id="playerSearch" list="playerList" placeholder="search a player…" aria-label="Search player" autocomplete="off" />
      <datalist id="playerList"></datalist>
    </span>
    <span class="spacer"></span>
    <!-- EDITBASE-1: the block's own size, beside the button that emits it. -->
    <span class="changecount" id="changeCount" role="status" aria-live="polite"></span>
    <!-- SCORE-1 (Operator addition, 8/20): the control that clears the block sits beside the
         number it clears. It is SHOWN ALWAYS and disabled when there is nothing to take back —
         a control that vanishes teaches the TD it never existed; one that is grey says
         "nothing to take back yet". Two clicks, always: this is the one gesture on the surface
         that is not itself redoable. -->
    <button class="btn-ghost" id="startOver" type="button" disabled>Start over</button>
    <button class="btn-primary" id="emitBtn">Save my changes</button>
    <button class="btn-ghost" id="copyBtn">Copy</button>
  </div>

  <div id="blockbar" class="blockbar" role="alert" hidden></div>
 </div>

  <div class="emit" id="emitOut">
    <button class="btn-link" id="outToggle" hidden aria-expanded="true" aria-controls="out">Hide this block</button>
    <pre id="out"></pre>
  </div>

  <div class="venuetabs" id="venueTabs" aria-label="Venue (narrow screens)"></div>

  <div class="layout" id="layout">
    <div class="panel" id="mainPanel"><div id="tableWrap"></div></div>
    <aside class="side" id="sidePanels">
      <details class="panel suggest-panel fold-panel" id="suggestPanel" open><summary><span id="suggestHead">Open Slots and Swaps</span></summary><div class="suggest-body" id="suggest"></div></details>
      <!-- CONSOLE-2 · 8/7 note 5: the confirmation cluster is PINNED at the top of the pane and
           only the candidate pool scrolls beneath it. It lives INSIDE the fold, so folding the
           panel still hides everything (CUI-5/OI-53). -->
      <details class="panel fold-panel" id="subPanel" open><summary>Substitutes</summary><div class="sub-pinned" id="subPinned"></div><div class="suggest-body" id="subBody"></div></details>
      <!-- CONSOLE-2 · 6c (Operator ruling 8/8, after his own challenge): "Re-enter at the desk"
           and "Entered, but not in a draw" LEAVE this console. Both were duplicates of printed
           deliverables, in a side column already known to be over-subscribed (CUI-5/OI-53).
           Where the information lives now, and it is MORE complete in both cases:
             · the re-key list -> `draw_sheets.render_rekey`, the Step-6 printed page, which
               carries the run's whole change list (moves AND substitutions) where this rail
               carried substitutions only. The board still shows a substitution in place, live,
               via the SUB badge.
             · the entered-but-not-drawn pool -> `csv_export.write_exceptions_csv`, whose
               accounting is asserted closed on every run (entries == scheduled + exceptions),
               and the Withdrawn tab, both still here. DESK-1's FACT -> EXPLANATION -> ACTION
               sentences are written at one source site that feeds all of them.
           The only thing genuinely console-only was TIMING — the printed page arrives after the
           courier trip — and that was judged not to outweigh the clutter. -->
      <div class="panel" id="trayPanel"><h3>Waiting for a slot</h3><div class="tray-items" id="tray"></div></div>
      <details class="panel issues-panel" id="issuesPanel">
        <summary><span id="issuesHead">Issues (0)</span></summary>
        <div class="issues-list" id="issues"></div>
      </details>
    </aside>
  </div>

</div>

    NON_DRAWN=doc.non_drawn||{}; WITHDRAWN=doc.withdrawn||[];   // F6: surface-only pools
    REG=null;                                         // ELIG-1: registration profiles rebuild lazily
    TRANSIT=r.transit_minutes||{};                    // DRAW-1 (a6-ii): inter-venue transit map
    DAILY_CAPS=doc.daily_caps||{};                    // DRAW-1 (a6-ii): per-division daily caps
    SEEDS=doc.seeds||{};                              // EC-F2: seed flags ({} on a pre-seed plan)
    PLAYERS=doc.players||{};                          // CUI-3: per-player card facts ({} = inert)
    FLOORS=doc.division_floors||{};                   // CUI-3: resolved earliest start per division
    OPENING=new Set(doc.opening_ids||[]);             // F3: each player's earliest match per division — the opening-match set (spans all days)
    // CONSOLE-2 · 6b: the round names come FROM THE PLAN, which knows a division's depth, and
    // are never re-derived from the cards on screen. That is ROUND-1's lesson, one day old when
    // this was written: deriving the ceiling from the rows in hand named a round the division
    // does not have on 1,008 of 1,164 handout lines. A round-robin group carries no `rounds`
    // block at all — there is no Final to name in a group — so it falls to "Round N", the same
    // string `draw_sheets._round_of` prints for an RR draw.
    ROUND_NAME={};
    // EVAL-1 §5.2: the confirmed finals-map day per division, resolved UPSTREAM
    // (`editor_plan._finals_day_of` already unwrapped the round-robin group suffix), so the
    // browser reads a day and never works out which division a group belongs to (F11). A plan
    // built without a finals map carries no key and leaves this empty, which is inert.
    FINALS_DAY={};
    (doc.divisions||[]).forEach(function(D){
      (D.rounds||[]).forEach(function(R){ ROUND_NAME[D.name+"|"+R.round]=R.name; });
      if(D.finals_day) FINALS_DAY[D.name]=D.finals_day;
    });
    // CONSOLE-2 (8/8 item 5): the three inputs the day-order PREVIEW reads. All three already
    // travel on `td-editor-plan/v1` — this build adds no contract field. A plan whose
    // `day_shape.order` is absent or empty leaves `DAY_ORDER` empty and the preview inert,
    // which is `kind_order_of`'s own "empty/omitted => the rule is off".
    DAY_ORDER={}; ((con.day_shape||{}).order||[]).forEach(function(k,i){ DAY_ORDER[k]=i; });
    DS_EXC={}; (doc.day_shape_exceptions||[]).forEach(function(e){ DS_EXC[e.id+"|"+e.day+"|"+e.start]=1; });
    DS_NOPREC={}; (doc.spills||[]).forEach(function(s){ DS_NOPREC[s.id]=1; });
    st={ matches:(doc.placements||[]).map(function(m){ var c=clone(m); c.mustDay=m.day; c.duration=m.duration||DEF_DUR; return c; }),
         unplaced:(doc.unplaced||[]).map(function(m){ var c=clone(m); c.duration=c.duration||DEF_DUR; return c; }),
         day:(doc.days||[])[0], div:(doc.divisions||[{}])[0].name, selMatch:null, edits:{},
         view:"opening", playerQ:null, venue:((COLS[0]||{}).id),
         // SWAP-1: `sugSwaps` rides the SAME action as `sugSlots` (ruling 85 decision 4) — one
         // "Where can this go?" answers both halves, open slots above and swaps below.
         suggest:null, sugSlots:null, sugSwaps:null, divQ:"",   // F3: opening-matches is the default primary axis · CUI-3: SLOT-SUGGEST
         // DRAW-1: the substitution state. subEdits/subTags are keyed by match id (separate
         // from st.edits so a move and a substitution on the same match can BOTH emit);
         // subUsed marks a pool person already substituted in (usta_id -> division).
         // SUBFIX-1 (C): subbedIn is the same record BY NAME (name -> true) — the Replace
         // default reads it, and only a name can answer "is this row a man I put in?".
         // Cumulative and never cleared, unlike subEdits/subTags which a second substitution
         // on the same card overwrites; a defaulting rule that forgets is the defect itself.
         subEdits:{}, subTags:{}, subUsed:{}, subbedIn:{},
         subOut:null, subCand:null, subKeep:false, subReason:"", subNote:"",
         // ELIG-1 Part A: the show-everyone line, and the card it was opened on
         subShowAll:false, subShowFor:null,
         // ISSUES-1 (D3 option 3, Operator ruling 8/17): the scope a jump left, or null.
         // ONE key for BOTH jumps — the Issues card's and `jumpToGrid`'s — written by one
         // helper and read by one control, so the record cannot know which jump made it.
         // Client state only: nothing here reaches the emit.
         jumpFrom:null,
         // SCORE-1a: which two entries came from ONE swap gesture. Client state only — it never
         // reaches the emit, and it lives in `st` so `loadPlan` rebuilds it like every other
         // store and Start Over stays a fresh-load identity by construction.
         swapPair:{} };
    seedFromPlan(doc);
    captureFloor();          // SCORE-1: the delivered schedule, recorded once, after the seeding
  }

  // -------------------------------------------------------------------------
  // EDITBASE-1 (2026-08-08) — the console STARTS with the changes already made.
  //
  // The failure this ends (2027 run report D2): the engine applies every block against the
  // ORIGINAL build, so a second paste carrying one correction silently erased four moves and a
  // substitution, and the printed set went out with a player the director believed he had
  // removed. Standing procedure 2 tells the run to regenerate this console after any change —
  // and before this, a regenerated console forgot every change and emitted a block that was
  // wrong in exactly the way nothing could detect, because it looked perfectly legitimate.
  //
  // ⚠ THE EMIT LIST ONLY. The board is NOT touched, and must not be: this console is generated
  // from the EDITED result, so every card already shows its change. Seeding the board too would
  // apply each change twice — a match moved once would move again, a substitution would look for
  // a player who is no longer in the match. Everything below writes to the emit stores
  // (`st.edits` / `st.subEdits`) and to the two rails that describe them; nothing writes to
  // `st.matches`, `st.unplaced` or `SEEDS`.
  //
  // Only records the engine ACTUALLY APPLIED are carried. A `rejected` or `skipped` record
  // changed nothing, so re-emitting it would put a change on the wire that never happened and
  // inflate the counter the courier checks — and a substitution GENDER-1 refused would ride
  // back out to the engine that refused it.
  function seedFromPlan(doc){
    var prior=doc.applied_edits;
    if(!Array.isArray(prior)) return;                 // a base build carries no key at all
    var divOf={}; (doc.placements||[]).forEach(function(p){ divOf[p.id]=p.div; });
    (doc.unplaced||[]).forEach(function(p){ if(p.div) divOf[p.id]=p.div; });
    prior.forEach(function(a){
      var id=a.id||a.match, res=a.result;
      if(!id) return;
      if((a.op==="move"||a.op==="pin") && res==="placed"){
        st.edits[id]={op:a.op, to:{day:a.day, start:a.start, location:a.location}};
      } else if(a.op==="hold" && res==="held"){
        st.edits[id]={op:"hold"};
      } else if(a.op==="substitute" && res==="substituted"){
        var ed={sub:{out:a.out, "in":a["in"], out_name:a.out_name, in_name:a.in_name}};
        if(a.seed_effect!==undefined){ ed.seed_effect=a.seed_effect;
                                       ed.seed_kept_reason=a.seed_kept_reason||null; }
        if(a.note) ed.note=a.note;
        st.subEdits[id]=ed;
        // The re-enter rail reads `subTags`, and the panel reads `subUsed`/`subbedIn`. Without
        // them a regenerated console would emit two substitutions while showing "Nothing to
        // re-enter" and offering the same pool person a second time — the emit list and what the
        // director is looking at have to be the same list.
        st.subTags[id]={out:a.out_name, "in":a.in_name, div:divOf[id]||null};
        if(a["in"]!=null && divOf[id]) st.subUsed[a["in"]]=divOf[id];
        if(a.in_name) st.subbedIn[a.in_name]=true;
      }
    });
  }

  // =========================================================================================
  // SCORE-1 (2026-08-20) — THE FLOOR, and the three surfaces that measure against it.
  //
  // D1 (Operator ruling, chat 8/20): THE FLOOR IS THIS COURIER ROUND'S DELIVERED SCHEDULE. One
  // answer serves three readers — the score card's zero, where a per-card undo puts a card
  // back, and what Start Over means by "the version this console opened with" — so the three
  // controls can never disagree about where "back" is.
  //
  // ⚠ CAPTURED AFTER `seedFromPlan`, deliberately. A regenerated console opens with the prior
  // round's changes ALREADY on the board and already in the emit (brief §0.4: "6 changes in
  // this block", `Day order` 8 live at load). Those changes ARE the delivered schedule — the
  // floor — and not this sitting's work: their entries belong to the floor emit, they carry no
  // undo control, and Start Over returns to them rather than past them. Reaching further back
  // was ruled out and costed: it needs the ORIGINAL build to ride the plan, which is a contract
  // change and a second copy of history on a surface EDITBASE-1 deliberately built flat.
  //
  // Nothing here is a snapshot invented for undo. `loadPlan` builds `st.matches` from CLONES of
  // `doc.placements`, so the delivered fields were already recoverable by id — the same source
  // `mustDay` reads. What this records in addition is the one thing the document does not
  // carry: WHERE each card sat in its array, which is render order inside a cell.
  var FLOOR=null;
  // EXACTLY the fields a move or a hold rewrites (§0.5, measured by inspection) — nothing else
  // on a card can change while the console is open, so nothing else is worth keeping, and a
  // NAMED set is one a later build has to come back and widen on purpose rather than inherit by
  // accident. `hasOwnProperty` on all three, never a truth test: a card the round delivered HELD
  // has no `location`/`start` at all, and "restore" there means delete them again.
  function floorRow(m){
    var r={};
    ["location","start","day"].forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(m,k)) r[k]=m[k];
    });
    return r;
  }
  function captureFloor(){
    var f={row:{}, where:{}, idx:{}, edit:{}, breaks:null, emit:null};
    st.matches.forEach(function(m,i){ f.row[m.id]=floorRow(m); f.where[m.id]="matches"; f.idx[m.id]=i; });
    st.unplaced.forEach(function(m,i){ f.row[m.id]=floorRow(m); f.where[m.id]="unplaced"; f.idx[m.id]=i; });
    Object.keys(st.edits).forEach(function(id){ f.edit[id]=clone(st.edits[id]); });
    FLOOR=f;
    // The break set and the emit are read with `st` sitting AT the floor — which it is, exactly
    // once, here — so neither is ever recomputed over a board swapped out and back.
    BRK_STATE=null; DS_STATE=null;
    f.breaks=breakSet();
    BRK_STATE=null; DS_STATE=null;
    f.emit=JSON.stringify(emitDoc());
  }

  // Two entries say the same thing, or they do not. Compared field by field rather than through
  // `JSON.stringify`, because key order is a property of how an object happened to be built and
  // this question is not about that.
  function sameEdit(a,b){
    if(!a || !b) return !a && !b;
    if(a.op!==b.op) return false;
    var ta=a.to||null, tb=b.to||null;
    if(!ta || !tb) return !ta && !tb;
    return ta.day===tb.day && ta.start===tb.start && ta.location===tb.location;
  }
  // Did THIS SITTING change this card? The one test all three surfaces read — the undo
  // control's presence, the margin's touched-slot set, and the Change Check listing.
  //
  // ⚠ It is a comparison AGAINST THE FLOOR ENTRY, not `st.edits[id] !== undefined`. Under D1 a
  // seeded entry IS the floor, so a card carrying one and nothing else is unchanged and shows no
  // control — there is nothing on the document to restore it to. And a card moved away and moved
  // back reads CHANGED, which is §0.3's measured defect stated as a test: the console had no
  // gesture that returned a block to zero, so a move-and-move-back left a no-op op naming the
  // card's own delivered slot on the wire and the counter reading "1 change in this block".
  function touchedThisSitting(id){
    if(!FLOOR) return false;
    var cur=Object.prototype.hasOwnProperty.call(st.edits,id) ? st.edits[id] : null;
    var flo=Object.prototype.hasOwnProperty.call(FLOOR.edit,id) ? FLOOR.edit[id] : null;
    return !sameEdit(cur, flo);
  }
  function sittingEdits(){
    if(!FLOOR) return [];
    return Object.keys(st.edits).filter(touchedThisSitting).sort();
  }
  // Start Over's enable test and the score's zero-state gate: has anything moved since load?
  // Read off the EMITTED BLOCK rather than off a count kept beside it — SUBFIX-2 trap 2's
  // assert-never-build discipline — which also makes it cover the substitution stores, reset by
  // Start Over by construction even though undo never touches them.
  function dirtyThisSitting(){
    return !!FLOOR && JSON.stringify(emitDoc())!==FLOOR.emit;
  }
  // How many changes this sitting made, said with the number the TD would count: entries on the
  // wire now that were not on it at load. It counts a substitution too, because Start Over
  // removes one — the sentence has to be true about everything the button is about to do.
  function sittingChangeCount(){
    if(!FLOOR) return 0;
    var was={}; JSON.parse(FLOOR.emit).edits.forEach(function(e){ was[JSON.stringify(e)]=1; });
    return emitDoc().edits.filter(function(e){ return !was[JSON.stringify(e)]; }).length;
  }

  // The board's live rule breaks as a SET, board-wide, one key per break — so "new" and
  // "cleared" are set differences and never a subtraction of two totals. §0.1's step 3 is the
  // whole reason: the swap completing CLEARS the capacity line and MINTS a day-order break, so
  // the total is unmoved at 8 while one break leaves and one arrives. A card that showed only
  // totals would read that as "nothing happened".
  //
  // Four kinds, and they are exactly the kinds this console already computes — no new rule is
  // enforced and no new judgment is made, so there is nothing here for `validate_multi` to
  // mirror. Memoised per render beside `DS_STATE` and cleared at the top of `render()` for the
  // same reason: a set that outlived a gesture would describe a board that has since moved.
  var BRK_STATE=null;
  function breakSet(){
    if(BRK_STATE) return BRK_STATE;
    var out={}, seen={};
    var board=dayShapeBoard();
    Object.keys(board).forEach(function(d){
      Object.keys(board[d]).forEach(function(id){ out["dayorder|"+d+"|"+id]=1; });
    });
    st.matches.forEach(function(a){
      conflictsFor(a).forEach(function(c){
        var pair=[a.id,c.other.id].sort().join("|");
        if(seen[c.kind+"|"+pair]) return; seen[c.kind+"|"+pair]=1;
        out[c.kind+"|"+a.day+"|"+pair]=1;
      });
    });
    var cells={};
    st.matches.forEach(function(m){
      if(!m.location || !m.start) return;
      var key=m.location+"|"+m.day+"|"+m.start; if(cells[key]) return; cells[key]=1;
      var t=hhmm2min(m.start);
      if(usedAt(m.location,m.day,t) > capAt(m.location,m.day,t)) out["cap|"+key]=1;
    });
    BRK_STATE=out; return out;
  }
  // Must-fix first, then check — the split the Change Check tab already draws and the guard
  // chain already enforces: `moveMatch` REFUSES a double-book and an over-capacity, and WARNS
  // on a rest gap and on day order.
  // Two labels per kind: the CARD's (a bare phrase, counted — "7 out of the day's order") and
  // the BAR's (a clause that follows "N matches" — "2 matches with too little rest"). One list,
  // so a kind cannot be named two ways on two surfaces.
  var BRK_KINDS=[["dbl","double-booked","double-booked"],
                 ["cap","over the court limit","over the court limit"],
                 ["rest","short rest","with too little rest"],
                 ["dayorder","out of the day's order","out of the day's order"]];

  // THE RUNNING SCORE. The metric arrived RULED from EVAL-1 (§4 decision 2, Operator 8/16) and
  // is not decided here: three numbers, read in order, board-wide, measured against the floor.
  //   1 · rule breaks      — new minus cleared, by kind, must-fix before check
  //   2 · off the schedule — held this sitting and not yet placed back
  //   3 · margin           — the tightest slot this sitting touched
  // Display only, over facts the console already computes. The engine stays the grader; this
  // never blocks and never excuses.
  function sittingScore(){
    var s={dirty:false, added:[], cleared:[], delta:0, off:0, margin:null};
    if(!FLOOR) return s;
    s.dirty=dirtyThisSitting();
    var now=breakSet(), was=FLOOR.breaks;
    Object.keys(now).forEach(function(k){ if(!was[k]) s.added.push(k); });
    Object.keys(was).forEach(function(k){ if(!now[k]) s.cleared.push(k); });
    s.delta=s.added.length - s.cleared.length;
    // Component 2 · `st.unplaced` NET OF THE BASE DOCK: a card the round delivered unplaced is
    // floor, not this sitting's doing. §0.3's failure is what this ends — the strip's `Unplaced`
    // chip is division-scoped, so a held card read `Unplaced=1` in its own division and `0` in
    // all fifty others, and nothing that persisted said the board was a card short.
    s.off=st.unplaced.filter(function(m){ return FLOOR.where[m.id]!=="unplaced"; }).length;
    s.margin=tightestTouched();
    return s;
  }
  // Component 3 · MARGIN — court slack at the slots this sitting touched, tightest named.
  // BOTH ENDS of every gesture: the slot a card came from and the slot it went to. §0.2 measured
  // the pair, and it is the pair that carries the information — the E10/E32 swap is
  // court-neutral, so both 01-29 instants stay at zero slack, which is exactly why either half
  // alone overloads the day and exactly what the two totals cannot say.
  function tightestTouched(){
    var slots={}, out=null;
    sittingEdits().forEach(function(id){
      var e=st.edits[id], f=FLOOR.row[id];
      if(e && e.to && e.to.location && e.to.start) slots[e.to.location+"|"+e.to.day+"|"+e.to.start]=1;
      if(f && f.location && f.start) slots[f.location+"|"+f.day+"|"+f.start]=1;
    });
    Object.keys(slots).forEach(function(k){
      var p=k.split("|"), t=hhmm2min(p[2]);
      if(t==null) return;
      var free=capAt(p[0],p[1],t)-usedAt(p[0],p[1],t);
      if(!out || free<out.free) out={loc:p[0], day:p[1], start:p[2], free:free};
    });
    return out;
  }

  // ---- ONE-CLICK UNDO ----------------------------------------------------------------------
  //
  // EDITBASE-1's blocks are ABSOLUTE — the engine applies a block against the original build —
  // so taking a change back is DELETING ONE ENTRY and never unwinding history. That is what
  // makes this cheap, and it is why every block this console can now emit is a SUBSET of a block
  // that already validates: no op is added, no field is added, the contract does not move.
  //
  // ⚠ SUBFIX-2 — the OTHER undo — shipped glitchy and was REVERTED with no surviving diff. Its
  // trap 3 (restore `teams` as well as `players`/`label`) transposes to the set §0.5 measured
  // for a move and a hold: `location` · `start` · `day` · array membership · ARRAY POSITION.
  // Every one is restored from the floor row, never from memory, and the harness grades the
  // restored board by BYTES against a fresh load rather than by inspection.
  //
  // ⚠ Trap 2 (the counter must come down) is answered BY CONSTRUCTION and asserted, never built:
  // `renderChangeCount` derives from `emitDoc().edits.length` and `emitDoc` reads `st.edits`, so
  // deleting the entry moves the number. The harness pins 1 -> 0 and the zero-edit block.
  // The other half of the swap this match came from, or null.
  //
  // ⚠ THE PAIRING IS LIVE ONLY WHILE BOTH MATCHES STILL SIT WHERE THE SWAP PUT THEM. Move
  // either one again and the two stop being one gesture — the TD has since done something else
  // to one of them — so undo goes back to being per-match. The test is the two ENTRIES the swap
  // itself wrote, compared field for field, never a flag that a later edit would have to
  // remember to clear: a second swap on one of the cards, a plain move, or an undo of the
  // partner all break the pairing by construction rather than by bookkeeping.
  function swapPartner(id){
    var p=st.swapPair[id]; if(!p) return null;
    var other=(p.a===id) ? p.b : p.a;
    if(!touchedThisSitting(id) || !touchedThisSitting(other)) return null;
    if(!sameEdit(st.edits[p.a], p.ea) || !sameEdit(st.edits[p.b], p.eb)) return null;
    return other;
  }
  // One match, restored. Mutation only — no bar, no render, no announce — because a swap undo
  // restores TWO and the board has to be settled before anything describes it.
  function undoOne(id){
    var floor=FLOOR.row[id]; if(!floor) return false;   // not on the delivered document: nothing to return to
    var m=findMatch(id); if(!m) return false;
    // 1 · the fields — `floorRow`'s three, restored symmetrically with the same
    // `hasOwnProperty` discipline that captured them, so a delivered-held card's absent
    // `location`/`start` are DELETED again rather than written as `undefined`.
    ["location","start","day"].forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(floor,k)) m[k]=floor[k]; else delete m[k];
    });
    // 2 · membership and 3 · POSITION, in one step. A filter-and-push rebuild would put the card
    // in the right cell in the wrong PLACE — SWAP-1's own measured comment on this surface: it
    // "would restore every position and still leave two cards re-ordered inside their cell".
    st.matches=st.matches.filter(function(x){ return x.id!==id; });
    st.unplaced=st.unplaced.filter(function(x){ return x.id!==id; });
    var arr = FLOOR.where[id]==="unplaced" ? st.unplaced : st.matches;
    arr.splice(floorSlot(arr, id), 0, m);
    // 4 · the entry. Back to what it was AT LOAD — deleted on a card the round delivered clean,
    // and back to the SEEDED entry on one a prior round moved. D1 again: the seeded change is
    // floor, so undoing this sitting's move must not drop a prior round's change off the wire.
    if(Object.prototype.hasOwnProperty.call(FLOOR.edit,id)) st.edits[id]=clone(FLOOR.edit[id]);
    else delete st.edits[id];
    delete st.swapPair[id];
    return true;
  }
  function undoEdit(id){
    if(!FLOOR || !touchedThisSitting(id)) return;
    // SCORE-1a: ONE GESTURE, ONE UNDO. A swap moved two matches, so taking it back moves two
    // back. Undoing one half alone put a match on top of its own partner — one more match than
    // the hour has courts — which is a board the TD never asked for, reached in a single click.
    var mate=swapPartner(id), ids=mate ? [id, mate] : [id];
    // §1.4, the WYSIWYG rule, unchanged: an undo is APPLIED AND FLAGGED, never refused. A match
    // restored into a slot some LATER edit has crowded is legal to restore — the emitted subset
    // block is exactly what the engine would apply — and refusing it would make the console
    // stricter than the engine, the disagreement COURTS-1 spent a build removing in the other
    // direction. What changed is only WHAT COUNTS AS ONE UNDO.
    BRK_STATE=null; DS_STATE=null;
    var before=breakSet();
    var done=ids.filter(undoOne);
    if(!done.length) return;
    BRK_STATE=null; DS_STATE=null;
    var left=mintedPhrase(before, breakSet());
    st.selMatch=id;
    var lead = (done.length>1)
      ? "Swap taken back — both matches are back where this schedule was delivered."
      : "Change taken back — the match is back where this schedule was delivered.";
    if(left) flashWarn(lead+" ⚠ That leaves "+left+". See which in Issues.");
    else clearBlock();
    announce(lead);
    render();
  }
  // What an undo LEFT BEHIND, read off the same board-wide record the score card reads — so the
  // bar and the card can never describe the same board two ways (the mirror-hazard line).
  //
  // ⚠ THIS REPLACES A BORROWED REFUSAL SENTENCE, and that is the point rather than a tidy-up.
  // What shipped on 8/20 reused `capBlockMsg`/`blockMsg` WORD FOR WORD — the sentences this
  // console prints when it REFUSES a move — so a change that had been applied opened with
  // "MHCC has 24 courts and they're all in use at 11:00" and read as an error. Reported by the
  // Operator on the surface the same day. The sentence now leads with what happened and names
  // the consequence second, with a route, which is EVAL-1's own shape.
  function mintedPhrase(before, after){
    var by={};
    Object.keys(after).forEach(function(k){
      if(before[k]) return;
      var kind=k.split("|")[0]; by[kind]=(by[kind]||0)+1;
    });
    var parts=BRK_KINDS.filter(function(p){ return by[p[0]]; }).map(function(p){
      var n=by[p[0]];
      return n+" match"+(n===1?"":"es")+" "+p[2];
    });
    if(parts.length<2) return parts[0]||"";
    return parts.slice(0,-1).join(", ")+" and "+parts[parts.length-1];
  }
